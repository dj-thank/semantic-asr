[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "semantic-asr"
version = "0.2.0"
description = "Evidence-preserving Japanese ASR with path pooling, adaptive reranking, semantic MBR, and selective acoustic verification"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "SHOTA Moriwaki" }]
keywords = ["ASR", "Japanese", "Whisper", "Qwen", "mora", "speech recognition"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = []

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.1,<2",
  "numpy>=1.26",
]
qwen = [
  "qwen-asr>=0.0.6,<0.1",
  "librosa>=0.10",
]
train = [
  "torch>=2.4",
  "transformers>=4.51",
]
rerank = [
  "sentence-transformers>=5,<6",
  "torch>=2.4",
  "transformers>=5,<6",
]
kenlm = [
  "kenlm>=0.2.0",
]
japanese = [
  "pyopenjtalk>=0.4",
]
dev = [
  "build>=1.2",
  "jsonschema>=4.20",
  "pytest>=8",
  "ruff>=0.8",
]

[project.scripts]
semantic-asr = "semantic_asr.cli_root:main"

[project.urls]
Homepage = "https://github.com/dj-thank/semantic-asr"
Repository = "https://github.com/dj-thank/semantic-asr"
Issues = "https://github.com/dj-thank/semantic-asr/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Historical patch fixtures intentionally preserve exact long source lines.
"scripts/apply_pr_review_fixes.py" = ["E501"]
"scripts/apply_pr_review_fixes_v2.py" = ["E501"]
