name: Semantic ASR v0.2 CI

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-research-stack
  pull_request:
    branches:
      - codex/semantic-asr-foundation-v0.1.0
      - main

permissions:
  contents: read

concurrency:
  group: semantic-asr-v02-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'pytest>=8,<9' 'ruff==0.12.12' 'jsonschema>=4,<5' 'build>=1,<2'

      - name: Lint and format gate
        run: |
          ruff check .
          ruff format --check .

      - name: Compile all Python sources
        run: python -m compileall -q src tests scripts examples

      - name: Run model-free test suite
        run: pytest -q

      - name: Validate research attribution registry
        run: python scripts/validate_research_registry.py

      - name: Run CPU-only end-to-end demonstration
        run: python examples/v02_cpu_demo.py

      - name: Train reproducible constrained reranker fixture
        run: |
          python scripts/train_reranker_v2.py \
            examples/v02-ranking-groups.jsonl \
            --output .ci-artifacts/reranker.json \
            --epochs 80 \
            --seed 17
          python - <<'PY'
          import json
          from pathlib import Path

          row = json.loads(Path('.ci-artifacts/reranker.json').read_text(encoding='utf-8'))
          assert row['format'] == 'semantic-asr-constrained-linear-reranker-v1'
          assert len(row['modelDigest']) == 64
          assert row['report']['pairwise_accuracy'] >= 0.9
          PY

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify wheel installation in a clean environment
        shell: bash
        run: |
          python -m venv .wheel-venv
          .wheel-venv/bin/python -m pip install --upgrade pip
          .wheel-venv/bin/python -m pip install dist/*.whl
          .wheel-venv/bin/python - <<'PY'
          from semantic_asr.candidate_pool import CandidatePath, CandidatePool
          from semantic_asr.research_registry import default_research_registry

          pool = CandidatePool.from_paths((
              CandidatePath('a', '東京', -1.0),
              CandidatePath('b', '京都', -2.0),
          ))
          assert len(pool.candidates) == 2
          assert len(default_research_registry().digest) == 64
          PY

      - name: Validate repository hygiene
        shell: bash
        run: |
          if find . -path './.git' -prune -o -type f \
            \( -iname '*.wav' -o -iname '*.mp3' -o -iname '*.flac' \
               -o -iname '*.safetensors' -o -iname '*.gguf' -o -iname '*.pt' \
               -o -iname '*.pth' -o -iname '*.ckpt' \) -print | grep -q .; then
            echo 'Raw audio or model-weight artifact found in repository.' >&2
            exit 1
          fi
          if git grep -nE '(sk-[A-Za-z0-9_-]{16,}|BEGIN (RSA |OPENSSH )?PRIVATE KEY)' -- . \
            ':(exclude).github/workflows/v02-ci.yml'; then
            echo 'Likely secret material found.' >&2
            exit 1
          fi

  optional-cpu-torch:
    name: Optional PyTorch / CPU
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install project, pytest and CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'pytest>=8,<9'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run v0.1 and v0.2 optional training tests
        run: pytest -q tests/test_training_optional.py tests/test_training_v2_optional.py
