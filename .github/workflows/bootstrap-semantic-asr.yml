name: Bootstrap Semantic ASR foundation

on:
  push:
    branches:
      - codex/semantic-asr-foundation-v0.1.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-asr-foundation-bootstrap
  cancel-in-progress: false

jobs:
  hydrate-test-and-commit:
    if: ${{ !contains(github.event.head_commit.message || '', '[semantic-asr-foundation]') }}
    runs-on: ubuntu-latest
    env:
      SOURCE_ARCHIVE_SHA256: 8687f0ab78ae996e158fb5a045d3a2792fce621ac469b7888173ddf42ef6489
      BOOTSTRAP_SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/semantic-asr-foundation-v0.1.0
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Reconstruct and safely extract verified source
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-* | base64 --decode > /tmp/semantic-asr-source.tgz
          echo "${SOURCE_ARCHIVE_SHA256}  /tmp/semantic-asr-source.tgz" | sha256sum --check --strict
          python - <<'PY'
          import tarfile
          from pathlib import Path

          archive = Path('/tmp/semantic-asr-source.tgz')
          root = Path('.').resolve()
          with tarfile.open(archive, 'r:gz') as stream:
              for member in stream.getmembers():
                  if member.issym() or member.islnk() or not (member.isfile() or member.isdir()):
                      raise RuntimeError(f'unsupported archive member: {member.name}')
                  target = (root / member.name).resolve()
                  try:
                      target.relative_to(root)
                  except ValueError as exc:
                      raise RuntimeError(f'unsafe archive path: {member.name}') from exc
              stream.extractall(root, filter='data')
          PY
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-semantic-asr.yml

      - name: Install development and CPU training dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Static checks, schemas, rights and complete tests
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python -m compileall -q src tests scripts
          ruff check src tests scripts
          python scripts/validate_rights_registry.py data/rights_registry.example.json
          set -o pipefail
          pytest -q | tee /tmp/semantic-asr-pytest.log

      - name: Exercise installed application paths
        shell: bash
        run: |
          set -euo pipefail
          semantic-asr --help
          semantic-asr demo --output runs/demo.json
          semantic-asr fuse examples/candidates.json --output runs/fused.json
          semantic-asr rights data/rights_registry.example.json

      - name: Reject raw data, weights and likely secrets
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.wav' -o -name '*.mp3' -o -name '*.m4a' -o -name '*.flac' -o -name '*.pt' -o -name '*.pth' -o -name '*.safetensors' \) | grep -q .; then
            echo 'Raw audio or model weights must not be committed.' >&2
            exit 1
          fi
          if grep -RIE --exclude-dir=.git --exclude-dir=dist --exclude='*.md' '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,})' .; then
            echo 'Possible secret detected.' >&2
            exit 1
          fi

      - name: Build wheel and validate a clean installation
        shell: bash
        run: |
          set -euo pipefail
          python -m build --wheel
          python -m venv /tmp/semantic-asr-clean
          /tmp/semantic-asr-clean/bin/python -m pip install --upgrade pip
          /tmp/semantic-asr-clean/bin/python -m pip install dist/*.whl
          /tmp/semantic-asr-clean/bin/semantic-asr --help
          /tmp/semantic-asr-clean/bin/semantic-asr demo --output /tmp/semantic-asr-demo.json
          /tmp/semantic-asr-clean/bin/semantic-asr fuse examples/candidates.json --output /tmp/semantic-asr-fused.json

      - name: Write reproducible validation evidence
        shell: bash
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import platform
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path

          lines = [line for line in Path('/tmp/semantic-asr-pytest.log').read_text(encoding='utf-8').splitlines() if line.strip()]
          pytest_summary = lines[-1]
          source_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          payload = {
              'schemaVersion': '1.0.0',
              'project': 'Semantic ASR',
              'release': '0.1.0',
              'branch': 'codex/semantic-asr-foundation-v0.1.0',
              'bootstrapSourceCommit': os.environ['BOOTSTRAP_SOURCE_COMMIT'],
              'bootstrapSourceTree': source_tree,
              'sourceArchiveSha256': os.environ['SOURCE_ARCHIVE_SHA256'],
              'workflowRunId': int(os.environ['WORKFLOW_RUN_ID']),
              'validatedAt': datetime.now(UTC).isoformat(),
              'platform': platform.platform(),
              'python': platform.python_version(),
              'pytestSummary': pytest_summary,
              'compileall': 'passed',
              'ruff': 'passed',
              'rightsRegistry': 'passed',
              'wheelBuild': 'passed',
              'cleanWheelInstall': 'passed',
              'installedCliSmoke': 'passed',
              'rawAudioOrWeightsCommitted': False,
              'likelySecretsDetected': False,
              'realFasterWhisperInference': 'not-run',
              'realQwen3ASRInference': 'not-run',
              'realQwen38TeacherInference': 'not-run',
              'heldOutJapaneseSpeechBenchmark': 'not-run'
          }
          Path('VALIDATION.json').write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          Path('VALIDATION.md').write_text(
              '# Semantic ASR v0.1.0 validation\n\n'
              f"- Validated: `{payload['validatedAt']}`\n"
              f"- Bootstrap source commit: `{payload['bootstrapSourceCommit']}`\n"
              f"- Source archive SHA-256: `{payload['sourceArchiveSha256']}`\n"
              f"- GitHub Actions run: `{payload['workflowRunId']}`\n"
              f"- Pytest: `{pytest_summary}`\n"
              '- Compileall, Ruff, rights registry, wheel build, clean installation and installed CLI smoke tests: passed.\n'
              '- Raw audio/model weights committed: no.\n'
              '- Likely secrets detected: no.\n\n'
              '## Claim boundary\n\n'
              'This gate validates source integrity, deterministic algorithms, contracts, optional CPU-PyTorch auxiliary heads, packaging and application smoke paths. '
              'It does not claim measured recognition-quality improvements because real Whisper/Qwen weights and a held-out Japanese speech corpus were not executed in this gate.\n',
              encoding='utf-8'
          )
          PY

      - name: Commit the foundation only after every gate passes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[semantic-asr-foundation] Build evidence-preserving Semantic ASR v0.1.0'
          git push origin HEAD:codex/semantic-asr-foundation-v0.1.0
