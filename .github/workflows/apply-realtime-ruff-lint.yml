name: Apply realtime Ruff lint fix

on:
  push:
    branches:
      - codex/realtime-reazon-hayamimi-64
    paths:
      - ".patch-bootstrap/realtime-ruff-lint.READY"

permissions:
  contents: write

concurrency:
  group: apply-realtime-ruff-lint-64
  cancel-in-progress: false

jobs:
  lint-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/realtime-reazon-hayamimi-64
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.8"
      - name: Apply Ruff fix only to this slice
        run: |
          python -m ruff check --fix --unsafe-fixes src/semantic_asr/realtime_reazon.py
          python -m ruff format \
            src/semantic_asr/realtime_reazon.py \
            scripts/realtime_reazon.py \
            tests/test_realtime_reazon.py \
            tests/test_realtime_reazon_runner.py
          python -m ruff check \
            src/semantic_asr/realtime_reazon.py \
            scripts/realtime_reazon.py \
            tests/test_realtime_reazon.py \
            tests/test_realtime_reazon_runner.py
          git diff --check
      - name: Remove one-shot bootstrap and commit
        run: |
          git rm -f \
            .github/workflows/apply-realtime-ruff-lint.yml \
            .patch-bootstrap/realtime-ruff-lint.READY
          git add \
            src/semantic_asr/realtime_reazon.py \
            scripts/realtime_reazon.py \
            tests/test_realtime_reazon.py \
            tests/test_realtime_reazon_runner.py
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: satisfy Ruff for realtime Reazon slice"
          git push origin HEAD:codex/realtime-reazon-hayamimi-64
