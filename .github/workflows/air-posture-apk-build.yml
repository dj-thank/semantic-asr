name: Air Posture APK Build

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API 36
        shell: bash
        run: |
          sdkmanager 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Restore isolated source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/air-posture-src"
          tar -xzf tools/air-posture-build/source.tgz -C "$RUNNER_TEMP/air-posture-src"
          test -f "$RUNNER_TEMP/air-posture-src/fitbit-air-posture/settings.gradle.kts"

      - name: Unit tests and debug APK
        shell: bash
        run: |
          gradle --no-daemon -p "$RUNNER_TEMP/air-posture-src/fitbit-air-posture" test assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          APK="$RUNNER_TEMP/air-posture-src/fitbit-air-posture/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          sha256sum "$APK"
          cp "$APK" "$RUNNER_TEMP/AirPostureLab-v0.2.0-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AirPostureLab-v0.2.0-debug-apk
          path: ${{ runner.temp }}/AirPostureLab-v0.2.0-debug.apk
          if-no-files-found: error
          retention-days: 1
