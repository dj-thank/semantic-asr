name: PR50 offline validation tools

on:
  push:
    branches: [codex/pr50-integration-20260906]
    paths: [.github/workflows/pr50-offline-tools.yml]

permissions:
  contents: read

jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Download development tool wheels only
        run: python -m pip download --only-binary=:all: --dest tools ruff build wheel 'setuptools>=77'
      - uses: actions/upload-artifact@v7
        with:
          name: pr50-offline-tools-${{ github.sha }}
          path: tools/
          retention-days: 14
          if-no-files-found: error
