name: Validate joint document and phonetic stack

on:
  push:
    branches:
      - codex/document-lattice-joint-decoding-v03
    paths:
      - .github/workflows/validate-document-joint-v03.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/document-lattice-joint-decoding-v03
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Dependency-free validation
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff format --check src tests scripts examples
          python -m ruff check src tests scripts examples
          python -m compileall -q src tests scripts examples
          python -m pytest -q --junitxml=joint-document-pytest.xml
          python -m build --wheel
          python examples/document_joint_deliberation.py --help
          python scripts/benchmark_document_deliberation.py --help
      - name: Optional CPU PyTorch validation
        run: |
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q tests/test_phonetic_heads_optional.py
      - name: Write immutable validation ledger
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("joint-document-pytest.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          counts = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          head = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          tree = subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip()
          wheel = next(Path("dist").glob("*.whl"))
          payload = {
              "schemaVersion": "1",
              "head": head,
              "tree": tree,
              "python": "3.12",
              "dependencyFreePytest": counts,
              "optionalCpuTorchTest": "passed",
              "ruffFormat": "passed",
              "ruffLint": "passed",
              "compileall": "passed",
              "wheelBuild": "passed",
              "wheelSha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "examples": [
                  "examples/document_joint_deliberation.py --help",
                  "scripts/benchmark_document_deliberation.py --help",
              ],
              "claimBoundary": (
                  "software-contract validation only; no Japanese CER or runtime promotion claim"
              ),
          }
          canonical = json.dumps(payload, ensure_ascii=False, sort_keys=True, separators=(",", ":"))
          payload["digest"] = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          Path("docs/DOCUMENT_JOINT_VALIDATION.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Commit ledger and remove temporary workflow
        shell: bash
        run: |
          rm -f .github/workflows/validate-document-joint-v03.yml
          rm -f joint-document-pytest.xml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/DOCUMENT_JOINT_VALIDATION.json .github/workflows/validate-document-joint-v03.yml
          git commit -m 'Record joint document stack validation ledger'
          git push origin HEAD:codex/document-lattice-joint-decoding-v03
