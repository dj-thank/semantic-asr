name: Reproducible validation evidence

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: validation-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Export exact tracked source for independent reproduction
        shell: bash
        run: |
          mkdir -p evidence
          git archive --format=tar HEAD > evidence/source.tar
          python - <<'PY'
          import hashlib
          import json
          import platform
          import subprocess
          from pathlib import Path

          manifest = {
              "schema": "semantic-asr-validation-source-v1",
              "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(),
              "archive_sha256": hashlib.sha256(Path("evidence/source.tar").read_bytes()).hexdigest(),
              "python": platform.python_version(),
              "claim": "Source identity only; no accuracy claim.",
          }
          Path("evidence/source-manifest.json").write_text(
              json.dumps(manifest, indent=2) + "\n", encoding="utf-8"
          )
          PY
      - name: Publish source snapshot
        uses: actions/upload-artifact@v7
        with:
          name: validation-source-${{ github.sha }}
          path: |
            evidence/source.tar
            evidence/source-manifest.json
          retention-days: 14
          if-no-files-found: error
      - name: Install model-free validation environment
        run: python -m pip install -e '.[dev]'
      - name: Record resolved validation dependencies
        run: python -m pip freeze > evidence/dependencies.txt
      - name: Run test suite with machine-readable results
        run: python -m pytest -q --junitxml=evidence/pytest.xml
      - name: Verify source immutability
        run: git diff --exit-code
      - name: Publish validation results even on test failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-results-${{ github.sha }}
          path: |
            evidence/source-manifest.json
            evidence/dependencies.txt
            evidence/pytest.xml
          retention-days: 14
          if-no-files-found: error
