name: v0.2 one-time formatter

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-adaptive-reranking

permissions:
  contents: write

concurrency:
  group: semantic-asr-v02-autoformat
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/semantic-asr-v0.2-adaptive-reranking
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Apply the repository formatter
        run: |
          python -m pip install 'ruff==0.16.5'
          python -m ruff format src tests scripts
      - name: Commit exact formatter output
        run: |
          if git diff --quiet; then
            echo 'No formatter changes required.'
            exit 0
          fi
          git config user.name 'semantic-asr-format-bot'
          git config user.email '204638875+dj-thank@users.noreply.github.com'
          git add src tests scripts
          git commit -m 'style(v0.2): apply Ruff formatter output'
          git push origin HEAD:codex/semantic-asr-v0.2-adaptive-reranking
