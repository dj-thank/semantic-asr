name: Codex README-intent verification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-readiness-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONUTF8: "1"

jobs:
  verify:
    name: Codex entry (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: ubuntu-latest
            python: "3.12"
          - os: windows-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install model-free development environment
        run: python -m pip install -e '.[dev]'
      - name: Run the same entry point as Codex
        run: python scripts/codex_verify.py --profile core --output-dir "${{ runner.temp }}/semantic-asr-codex-evidence" --total-seconds 1200 --stage-seconds 600
      - name: Read-only source formatting diagnostics on failure
        if: failure()
        shell: python
        env:
          CODEX_VERIFY_OUTPUT: ${{ runner.temp }}/semantic-asr-codex-evidence
        run: |
          import os
          import pathlib
          import subprocess
          import sys
          output = pathlib.Path(os.environ["CODEX_VERIFY_OUTPUT"])
          output.mkdir(parents=True, exist_ok=True)
          with (output / "source-format.diff").open("wb") as stream:
              subprocess.run(
                  [sys.executable, "-m", "ruff", "format", "--diff", "src", "tests", "scripts"],
                  stdout=stream, check=False,
              )
      - name: Publish only verification summary and source-format diagnostic
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: codex-verification-${{ matrix.os }}-${{ matrix.python }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/semantic-asr-codex-evidence/report.json
            ${{ runner.temp }}/semantic-asr-codex-evidence/source-format.diff
          if-no-files-found: warn
          retention-days: 14
