name: Stack-order-independent document-context audit

on:
  push:
    branches:
      - codex/document-context-experiment-v1-38

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: semantic-asr-context-experiment-finalizer
  cancel-in-progress: true

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/document-context-experiment-v1-38
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Reuse conclusive hardening and remove cross-stack helper dependency
        shell: bash
        run: |
          if [ -f .github/workflows/finalize-context-experiment-v5.yml ]; then
            python -m pip install pyyaml
            python - <<'PY' > /tmp/replay-hardening.sh
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/finalize-context-experiment-v5.yml').read_text(encoding='utf-8')
          )
          for step in workflow['jobs']['audit']['steps']:
              if step.get('name') == 'Apply idempotent conclusive hardening':
                  print(step['run'])
                  break
          else:
              raise SystemExit('conclusive hardening step not found')
          PY
            bash /tmp/replay-hardening.sh
          fi
          python - <<'PY'
          from pathlib import Path

          path = Path('src/semantic_asr/document_experiment/protocol.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from ..audio import require_integer\n', '')
          if 'def _require_integer(' not in text:
              marker = '''def _nonempty(value: str, *, name: str) -> str:
              if not isinstance(value, str) or not value.strip():
                  raise ValueError(f"{name} must be a non-empty string")
              return value
          '''
              addition = '''

          def _require_integer(
              value: object,
              *,
              name: str,
              minimum: int | None = None,
          ) -> int:
              if isinstance(value, bool) or not isinstance(value, int):
                  raise TypeError(f"{name} must be an integer")
              if minimum is not None and value < minimum:
                  raise ValueError(f"{name} must be at least {minimum}")
              return value
          '''
              if marker not in text:
                  raise SystemExit('protocol integer-helper insertion marker missing')
              text = text.replace(marker, marker + addition, 1)
          text = text.replace('require_integer(', '_require_integer(')
          text = text.replace('def __require_integer(', 'def _require_integer(')
          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY
      - name: Install validation environment
        run: python -m pip install -e '.[dev]'
      - name: Format, lint, compile, and verify source
        run: |
          python -m ruff format src tests scripts
          python -m ruff check --fix src tests scripts
          python -m ruff format src tests scripts
          python -m ruff format --check src tests scripts
          python -m ruff check src tests scripts
          python -m compileall -q src tests scripts
          git diff --check
      - name: Run focused context-experiment suite
        id: focused
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q \
            tests/test_document_experiment_protocol.py \
            tests/test_document_experiment_metrics.py \
            tests/test_document_ngram_scorer.py \
            tests/test_document_experiment_runner.py \
            tests/test_document_experiment_planner.py \
            tests/test_document_context_promotion.py \
            tests/test_document_experiment_artifacts.py \
            tests/test_train_document_ngram_scorer.py \
            tests/test_document_experiment_registration.py \
            tests/test_document_experiment_privacy.py \
            2>&1 | tee /tmp/focused.log
      - name: Run complete dependency-free suite
        id: full
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee /tmp/full.log
      - name: Record successful audit
        if: success()
        shell: bash
        run: |
          focused_summary=$(tail -n 1 /tmp/focused.log)
          full_summary=$(tail -n 1 /tmp/full.log)
          cat > docs/DOCUMENT_CONTEXT_EXPERIMENT_VALIDATION.md <<EOF
          # Document-context experiment validation ledger

          ## Stack-order-independent conclusive audit

          Focused context-experiment suite:

          \`\`\`text
          $focused_summary
          \`\`\`

          Complete dependency-free suite:

          \`\`\`text
          $full_summary
          \`\`\`

          The exact committed source passed formatting, lint, compileall, rights and split guards,
          reference isolation, immutable candidate freezing, scorer-profile result binding,
          non-identity shuffled controls, false-correction metrics, paired bootstrap,
          scored-character budgets, privacy-safe report output, strict tamper-checked n-gram
          artifacts, fair document-beam planning, preregistration, promotion gating, the
          rights-gated training CLI, and stack-order-independent protocol validation.

          This is software validation only, not a Japanese CER or context-quality claim.
          EOF
          rm -f docs/DOCUMENT_CONTEXT_EXPERIMENT_FAILURE.md
          rm -f .github/workflows/finalize-context-experiment.yml
          rm -f .github/workflows/finalize-context-experiment-v2.yml
          rm -f .github/workflows/finalize-context-experiment-v3.yml
          rm -f .github/workflows/finalize-context-experiment-v4.yml
          rm -f .github/workflows/finalize-context-experiment-v5.yml
          rm -f .github/workflows/finalize-context-experiment-v6.yml
          rm -f .github/workflows/finalize-context-experiment-v7.yml
      - name: Record failed audit
        if: failure()
        shell: bash
        run: |
          {
            echo '# Document-context experiment validation failure'
            echo
            echo '## Focused suite'
            echo '```text'
            cat /tmp/focused.log 2>/dev/null || true
            echo '```'
            echo
            echo '## Complete suite'
            echo '```text'
            cat /tmp/full.log 2>/dev/null || true
            echo '```'
          } > docs/DOCUMENT_CONTEXT_EXPERIMENT_FAILURE.md
      - name: Commit exact audit state
        if: always()
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Complete stack-order-independent context experiment audit'
          git push origin HEAD:codex/document-context-experiment-v1-38
      - name: Move PR to review and comment
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          pr=$(gh pr list --head codex/document-context-experiment-v1-38 --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            exit 0
          fi
          if [ "$(gh pr view 45 --json state --jq .state)" = "MERGED" ]; then
            gh pr edit "$pr" --base main
          fi
          gh pr ready "$pr" || true
          focused_summary=$(tail -n 1 /tmp/focused.log)
          full_summary=$(tail -n 1 /tmp/full.log)
          gh pr comment "$pr" --body "Final stack-order-independent audit passed. Focused: **$focused_summary**. Full dependency-free suite: **$full_summary**. The PR is ready for review. This remains experiment infrastructure, not a Japanese CER improvement claim."
