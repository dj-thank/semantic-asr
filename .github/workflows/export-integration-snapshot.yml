name: Apply verified v0.2 compatibility integration
# Re-run only after the validated compatibility archive has been restored.

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-integrated
    paths:
      - .github/workflows/export-integration-snapshot.yml

permissions:
  contents: write

concurrency:
  group: semantic-asr-v02-compatibility-integration
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the exact integration branch
        uses: actions/checkout@v6
        with:
          ref: codex/semantic-asr-v0.2-integrated
          fetch-depth: 0
          persist-credentials: true

      - name: Reassemble and verify the validated payload
        shell: bash
        run: |
          set -euo pipefail
          parts=(.github/semantic-v02-compat.part{00..09})
          for part in "${parts[@]}"; do
            test -f "$part"
          done
          # part00 was staged with 2,000 overlapping characters; keep only the
          # exact first 8,000 bytes, then append the remaining non-overlapping parts.
          head -c 8000 "${parts[0]}" > "$RUNNER_TEMP/semantic-v02-compat.b64"
          cat "${parts[@]:1}" >> "$RUNNER_TEMP/semantic-v02-compat.b64"

          b64_size="$(wc -c < "$RUNNER_TEMP/semantic-v02-compat.b64" | tr -d ' ')"
          echo "reassembled_base64_bytes=$b64_size"
          if [ "$b64_size" -ne 52308 ]; then
            echo "Expected 52308 base64 bytes" >&2
            exit 1
          fi

          base64 --decode "$RUNNER_TEMP/semantic-v02-compat.b64" \
            > "$RUNNER_TEMP/semantic-v02-compat.tar.gz"
          tar_size="$(stat -c%s "$RUNNER_TEMP/semantic-v02-compat.tar.gz")"
          tar_sha="$(sha256sum "$RUNNER_TEMP/semantic-v02-compat.tar.gz" | cut -d' ' -f1)"
          echo "decoded_tar_bytes=$tar_size"
          echo "decoded_tar_sha256=$tar_sha"
          if [ "$tar_size" -ne 39229 ]; then
            echo "Expected 39229 decoded bytes from the padded Base64 payload" >&2
            exit 1
          fi
          if [ "$tar_sha" != "77d63fa5c430ae4bade18cdc4b62b8657b6fb513df4815fc0458d193cd1548f8" ]; then
            echo "Decoded archive SHA-256 changed between reconstruction attempts" >&2
            exit 1
          fi
          gzip -t "$RUNNER_TEMP/semantic-v02-compat.tar.gz"
          tar -tzf "$RUNNER_TEMP/semantic-v02-compat.tar.gz" >/dev/null
          tar -xzf "$RUNNER_TEMP/semantic-v02-compat.tar.gz"
          rm -f \
            .github/semantic-v02-compat.tar.gz.b64 \
            .github/semantic-v02-compat.part{00..09} \
            .github/workflows/export-integration-snapshot.yml

      - name: Restore exact shared research type aliases
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import ast
          from pathlib import Path


          def imported_names(source: str) -> set[str]:
              names: set[str] = set()
              for node in ast.parse(source).body:
                  if isinstance(node, (ast.Import, ast.ImportFrom)):
                      names.update(alias.asname or alias.name for alias in node.names)
              return names


          cascade_path = Path("src/semantic_asr/cascade.py")
          cascade = cascade_path.read_text(encoding="utf-8")
          if "StageKind = Literal[" not in cascade:
              if "Literal" not in imported_names(cascade):
                  cascade = cascade.replace(
                      "from __future__ import annotations\n",
                      "from __future__ import annotations\n\nfrom typing import Literal\n",
                      1,
                  )
              anchor = "@dataclass(frozen=True, slots=True)\nclass ExecutionBudget:"
              if anchor not in cascade:
                  raise RuntimeError("ExecutionBudget anchor missing from cascade.py")
              aliases = '''DecisionStatus = Literal[
              "unresolved",
              "accepted",
              "provisional",
              "rejected",
          ]
          StageKind = Literal[
              "generator",
              "scorer",
              "reranker",
              "calibrator",
              "verifier",
              "second-ear",
              "proposal",
              "normalizer",
          ]
          '''
              cascade = cascade.replace(anchor, aliases + "\n" + anchor, 1)
              cascade_path.write_text(cascade, encoding="utf-8")

          ngram_path = Path("src/semantic_asr/ngram.py")
          ngram = ngram_path.read_text(encoding="utf-8")
          if "Tokenizer = Callable[[str], Sequence[str]]" not in ngram:
              names = imported_names(ngram)
              missing_imports = [name for name in ("Callable", "Sequence") if name not in names]
              if missing_imports:
                  ngram = ngram.replace(
                      "from __future__ import annotations\n",
                      "from __future__ import annotations\n\n"
                      f"from collections.abc import {', '.join(missing_imports)}\n",
                      1,
                  )
              anchor = "def character_tokenize("
              if anchor not in ngram:
                  raise RuntimeError("character_tokenize anchor missing from ngram.py")
              ngram = ngram.replace(
                  anchor,
                  "Tokenizer = Callable[[str], Sequence[str]]\n\n\n" + anchor,
                  1,
              )
              ngram_path.write_text(ngram, encoding="utf-8")
          PY

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the model-free development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build

      - name: Canonically format and lint the integrated source
        run: |
          python -m ruff format src tests scripts
          python -m ruff check --fix src tests scripts
          python -m ruff check src tests scripts

      - name: Run the complete model-free validation suite
        run: |
          python -m compileall -q src tests scripts
          python -m pytest -q

      - name: Build and verify wheel entrypoints
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/wheel"
          python -m build --wheel --outdir "$RUNNER_TEMP/wheel"
          python -m venv "$RUNNER_TEMP/wheel-venv"
          source "$RUNNER_TEMP/wheel-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install "$RUNNER_TEMP"/wheel/*.whl
          semantic-asr --help >/dev/null
          for command in \
            partition-manifest \
            score-ranker-calibration \
            apply-ranker \
            benchmark \
            calibrate-ranker \
            train-ngram \
            train-listwise-ranker \
            train-fusion \
            generate-candidates \
            deployment-gate \
            throttle-policy
          do
            semantic-asr "$command" --help >/dev/null
          done
          python -m semantic_asr --help >/dev/null

      - name: Commit the verified compatibility integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "semantic-asr-integration"
          git config user.email "204638875+dj-thank@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: unify v0.2 runtime and research APIs"
          git push origin HEAD:codex/semantic-asr-v0.2-integrated
