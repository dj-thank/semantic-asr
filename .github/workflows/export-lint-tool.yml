name: Export offline validation linter

on:
  push:
    branches: [codex/accuracy-reliability-20260905]
    paths: [.github/workflows/export-lint-tool.yml]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install and export linter binary
        run: |
          python -m pip install ruff
          mkdir -p lint-tool
          python -c 'import shutil; shutil.copy2(shutil.which("ruff"), "lint-tool/ruff")'
          python -m ruff --version > lint-tool/version.txt
      - uses: actions/upload-artifact@v7
        with:
          name: offline-ruff
          path: lint-tool/
          retention-days: 1
          if-no-files-found: error
