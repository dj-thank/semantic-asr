name: Apply Semantic ASR v0.2 post-review fixes

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-research-stack
    paths:
      - .github/workflows/v02-post-review.yml

permissions:
  contents: write

jobs:
  apply-review-fixes:
    runs-on: ubuntu-24.04
    steps:
      - name: Let earlier branch mutation workflows settle
        run: sleep 75

      - name: Check out latest branch
        uses: actions/checkout@v4
        with:
          ref: codex/semantic-asr-v0.2-research-stack
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install 'pytest>=8,<9' 'ruff==0.12.12' 'jsonschema>=4,<5'

      - name: Apply deterministic post-review corrections
        run: python scripts/apply_v02_post_review.py

      - name: Format and validate corrected tree
        run: |
          ruff check . --fix
          ruff format .
          ruff check .
          ruff format --check .
          python -m compileall -q src tests scripts examples
          pytest -q
          python scripts/validate_research_registry.py
          python scripts/validate_v02_manifest.py examples/v02-experiment-manifest.json
          python examples/v02_cpu_demo.py

      - name: Remove one-shot mutation workflows
        run: |
          rm -f .github/workflows/v02-autofix.yml
          rm -f .github/workflows/v02-post-review.yml

      - name: Commit reviewed tree
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No post-review changes required.'
            exit 0
          fi
          git config user.name 'semantic-asr-ci'
          git config user.email '204638875+dj-thank@users.noreply.github.com'
          git add --all
          git commit -m 'fix: harden Semantic ASR v0.2 review edge cases'
          git pull --rebase origin codex/semantic-asr-v0.2-research-stack
          git push origin HEAD:codex/semantic-asr-v0.2-research-stack
