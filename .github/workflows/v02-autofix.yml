name: Semantic ASR v0.2 branch autofix

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-research-stack

permissions:
  contents: write

concurrency:
  group: semantic-asr-v02-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ruff-autofix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact branch
        uses: actions/checkout@v4
        with:
          ref: codex/semantic-asr-v0.2-research-stack
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install pinned formatter
        run: python -m pip install 'ruff==0.12.12'

      - name: Apply safe lint fixes and canonical formatting
        run: |
          ruff check . --fix
          ruff format .

      - name: Commit deterministic formatting changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'semantic-asr-ci'
          git config user.email '204638875+dj-thank@users.noreply.github.com'
          git add --all
          git commit -m 'style: apply deterministic v0.2 Ruff formatting'
          git push origin HEAD:codex/semantic-asr-v0.2-research-stack
