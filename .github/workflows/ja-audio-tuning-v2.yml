name: Tune Semantic ASR on real Japanese audio — expanded

on:
  push:
    branches:
      - codex/japanese-audio-tuning-20260904
    paths:
      - .ja-tuning/tune_japanese_audio_real_v2.py.gz.b64
      - .github/workflows/ja-audio-tuning-v2.yml

permissions:
  contents: read

jobs:
  tune:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Restore pinned model and dataset snapshots
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: semantic-asr-ja-real-v1-${{ runner.os }}-fw-0a363e9-ctc-f5fe070
          restore-keys: |
            semantic-asr-ja-real-v1-${{ runner.os }}-
      - name: Materialize and verify tuning driver
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .ja-tuning/tune_japanese_audio_real_v2.py.gz.b64 > /tmp/tune-v2.py.gz
          echo "9420fc8666ef3fce47d3eee04f57b322f2db8fee41437d749f68b373f26d0c27  /tmp/tune-v2.py.gz" | sha256sum -c -
          gzip -dc /tmp/tune-v2.py.gz > /tmp/tune-v2.py
          python -m py_compile /tmp/tune-v2.py
      - name: Install CPU inference and validation stack
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.6.0'
          python -m pip install -e '.[asr]'
          python -m pip install 'transformers==4.56.2' 'datasets==3.6.0' soundfile scipy 'pyopenjtalk==0.4.1' 'ruff==0.16.6'
          python -m ruff format /tmp/tune-v2.py
          python -m ruff format --check /tmp/tune-v2.py
          python -m ruff check /tmp/tune-v2.py
          python -m py_compile /tmp/tune-v2.py
      - name: Run repeated tuning and locked evaluations
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "300"
          OMP_NUM_THREADS: "4"
          MKL_NUM_THREADS: "4"
        run: |
          python /tmp/tune-v2.py \
            --reazon-train 24 \
            --reazon-calibration 16 \
            --reazon-test 16 \
            --jsut-guard 12 \
            --common-voice-test 20 \
            --beam-size 6 \
            --hypotheses 6 \
            --max-duration 12 \
            --cpu-threads 4 \
            --bootstrap 2000 \
            --output /tmp/ja-real-v2-report.json
      - name: Validate aggregate-only report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/ja-real-v2-report.json')
          report = json.loads(path.read_text())
          assert report['schema'] == 'semantic-asr-ja-real-tuning-v2'
          assert report['dataContract']['referenceBlindFeatureExtraction'] is True
          assert report['dataContract']['rawAudioPersisted'] is False
          assert report['dataContract']['rawReferencePersisted'] is False
          assert report['dataContract']['rawHypothesisPersisted'] is False
          assert report['iterations'][-1]['profileChangedAfterEvaluation'] is False
          assert sum(item['sampleCount'] for item in report['datasets']) == 88
          assert len(report['datasetFingerprint']) == 64

          forbidden_keys = {'reference', 'transcript', 'hypothesis', 'text', 'audioPath', 'audioBytes'}
          def visit(value):
              if isinstance(value, dict):
                  assert forbidden_keys.isdisjoint(value), forbidden_keys.intersection(value)
                  for child in value.values():
                      visit(child)
              elif isinstance(value, list):
                  for child in value:
                      visit(child)
          visit(report)
          print(json.dumps({
              'promotionReady': report['promotionReady'],
              'selectedProfile': report['selectedProfile'],
              'metrics': report['metrics'],
          }, ensure_ascii=False, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: semantic-asr-ja-real-v2-report
          path: /tmp/ja-real-v2-report.json
          if-no-files-found: error
          retention-days: 7
