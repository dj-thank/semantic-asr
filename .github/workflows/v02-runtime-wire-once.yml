name: v0.2 one-time runtime wiring

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write

concurrency:
  group: semantic-asr-v02-runtime-wire
  cancel-in-progress: true

jobs:
  wire-runtime:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/semantic-asr-v0.2-adaptive-reranking
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Wire balanced routing and legacy-teacher boundary
        run: python .github/scripts/wire_v02_runtime_once.py
      - name: Apply repository format and safe lint fixes
        run: |
          python -m pip install 'ruff==0.16.5'
          python -m ruff check --fix src/semantic_asr/longform.py src/semantic_asr/cli_v2.py
          python -m ruff format src/semantic_asr/longform.py src/semantic_asr/cli_v2.py
      - name: Commit exact runtime wiring
        run: |
          git config user.name 'semantic-asr-runtime-bot'
          git config user.email '204638875+dj-thank@users.noreply.github.com'
          git add src/semantic_asr/longform.py src/semantic_asr/cli_v2.py
          git commit -m 'feat(v0.2): wire balanced evidence routing into runtime'
          git push origin HEAD:codex/semantic-asr-v0.2-adaptive-reranking
