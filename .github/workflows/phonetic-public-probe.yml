name: Public speech phonetic probe

on:
  workflow_dispatch:
  push:
    branches: [codex/phonetic-error-driven-20260905]
    paths: [.github/workflows/phonetic-public-probe.yml]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install CPU-only public model inference environment
        run: |
          python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[asr]' 'transformers>=4.52,<5' pyopenjtalk-plus pyarrow soundfile
      - name: Record dependency versions
        run: |
          mkdir -p public-probe
          python -m pip freeze > public-probe/dependencies.txt
      - name: Infer public speech without reference-conditioned prompts
        run: python scripts/collect_phonetic_public_probe.py --output public-probe --per-split 24
      - name: Verify tracked source was not changed
        run: git diff --exit-code
      - name: Preserve public-text and numeric evidence, never audio or weights
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-phonetic-probe-${{ github.run_id }}
          path: public-probe/
          retention-days: 7
          if-no-files-found: error
