name: Apply frontier finalizer once

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-adaptive-reranking
    paths:
      - .github/scripts/apply_frontier_finalizer.py
      - .github/workflows/apply-frontier-finalizer-once.yml

permissions:
  contents: write

concurrency:
  group: semantic-asr-frontier-finalizer
  cancel-in-progress: false

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/semantic-asr-v0.2-adaptive-reranking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python .github/scripts/apply_frontier_finalizer.py
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format src tests
      - run: ruff check src tests
      - run: pytest -q
      - name: Commit final wiring
        run: |
          if git diff --quiet; then
            echo "No frontier wiring changes required."
            exit 0
          fi
          git config user.name "semantic-asr-ci"
          git config user.email "204638875+dj-thank@users.noreply.github.com"
          git add src/semantic_asr/advanced_adapters.py docs/ARCHITECTURE.md CHANGELOG.md tests src/semantic_asr
          git commit -m "feat: wire acoustic guard and frontier research extensions"
          git push origin HEAD:codex/semantic-asr-v0.2-adaptive-reranking
