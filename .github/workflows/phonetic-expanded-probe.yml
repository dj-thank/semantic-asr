name: Expanded public speech phonetic probe

on:
  workflow_dispatch:
  push:
    branches: [codex/phonetic-error-driven-20260905]
    paths: [.github/workflows/phonetic-expanded-probe.yml]

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Load prior sample identities for exclusion
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33946834870 --repo dj-thank/semantic-asr --name public-phonetic-probe-33946834870 --dir prior-probe
      - name: Install CPU-only acoustic and language inference dependencies
        run: |
          python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[asr]' 'transformers>=4.52,<5' pyopenjtalk-plus pyarrow soundfile
      - name: Expand hypotheses without supplying reference text
        run: python scripts/collect_expanded_phonetic_probe.py --prior prior-probe --output expanded-probe --per-split 24
      - name: Measure whole-candidate linguistic preferences
        run: python scripts/score_public_probe_context.py --probe expanded-probe --output expanded-context
      - name: Verify tracked source immutability
        run: git diff --exit-code
      - name: Retain numeric evidence and public references, never audio or weights
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expanded-phonetic-probe-${{ github.run_id }}
          path: |
            expanded-probe/
            expanded-context/
          retention-days: 7
          if-no-files-found: error
