name: Export source snapshot

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-adaptive-reranking
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build source snapshot
        run: |
          mkdir -p .snapshot
          tar --exclude=.git --exclude=.snapshot -czf .snapshot/semantic-asr-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: semantic-asr-source
          path: .snapshot/semantic-asr-source.tar.gz
          if-no-files-found: error
          retention-days: 1
