name: Export Semantic ASR source snapshot

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-adaptive-reranking
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-asr-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Create source archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source-snapshot
          tar \
            --exclude=.git \
            --exclude=source-snapshot \
            -czf source-snapshot/semantic-asr-source.tar.gz .
          sha256sum source-snapshot/semantic-asr-source.tar.gz \
            > source-snapshot/semantic-asr-source.sha256
          printf '%s\n' "${GITHUB_SHA}" > source-snapshot/source-commit.txt

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: semantic-asr-source
          path: source-snapshot/
          if-no-files-found: error
          retention-days: 3
