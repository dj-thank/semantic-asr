name: Real acoustic and LoRA weight pilot

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  train-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Verify the permanently versioned prior-exposure identities
        run: |
          python - <<'PY2'
          import hashlib, json, shutil
          from pathlib import Path
          source = Path('research/weight-pilot-20260905/exclusions.json')
          if hashlib.sha256(source.read_bytes()).hexdigest() != '585ef254c1c977555a859aeb404459ce14da4f3b1b1d6b367b55126cabc17a42':
              raise ValueError('prior exposure identity mismatch')
          records = json.loads(source.read_text())
          assert all(len(set(records[k])) == 72 for k in ('source_ids', 'pcm_sha256', 'reference_sha256'))
          shutil.copy2(source, 'pilot-exclusions.json')
          PY2
      - name: Install explicit CPU feasibility environment
        run: |
          python -m pip install 'torch==2.10.0' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . 'transformers==4.57.6' 'peft==0.18.0' 'safetensors==0.7.0' 'numpy==2.3.5' 'faster-whisper==1.2.1' 'ctranslate2==4.8.2' 'pyopenjtalk-plus==0.4.1.post9' 'pyarrow==22.0.0' 'soundfile==0.13.1'
          python -m pip check
          python -m pip freeze > pilot-dependencies.txt
      - name: Train new heads and real LoRA tensors, no reference-conditioned inference
        run: python scripts/train_public_weight_pilot.py --output weight-pilot --exclusions pilot-exclusions.json
      - name: Verify exported weights in a fresh Python process
        run: python scripts/train_public_weight_pilot.py --output weight-pilot --verify
      - name: Record notices and artifact hashes
        if: always()
        run: |
          python - <<'PY'
          import hashlib, json, shutil
          from pathlib import Path
          root = Path('weight-pilot')
          root.mkdir(exist_ok=True)
          for name in ('pilot-exclusions.json', 'pilot-dependencies.txt'):
              if Path(name).exists(): shutil.copy2(name, root / name)
          shutil.copy2('LICENSE', root / 'LICENSE-code-and-new-weights.txt')
          (root / 'NOTICE.txt').write_text(
              'Research feasibility pilot, NOT deployment weights.\n'
              'FLEURS, Google, Conneau et al. (2022), CC-BY-4.0; derived labels/features and training.\n'
              'https://huggingface.co/datasets/google/fleurs\n'
              'Base HuBERT: prj-beatrice/japanese-hubert-base-phoneme-ctc-v4, Apache-2.0.\n'
              'Base LLM: Qwen/Qwen3-0.6B-Base, Qwen Team, Apache-2.0.\n'
              'New heads and LoRA adaptation: semantic-asr, SHOTA Moriwaki, 2026.\n'
              'No raw audio/base weights redistributed. G2P labels are weak supervision.\n')
          hashes = {str(p.relative_to(root)): hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in root.rglob('*') if p.is_file()}
          (root / 'artifact-hashes.json').write_text(json.dumps(hashes, indent=2) + '\n')
          PY
      - name: Verify source immutability
        run: git diff --exit-code
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-weight-pilot-${{ github.run_id }}
          path: weight-pilot/
          retention-days: 30
          if-no-files-found: error
