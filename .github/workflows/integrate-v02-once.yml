name: Integrate Semantic ASR v0.2 branches once

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-integrated
    paths:
      - .github/workflows/integrate-v02-once.yml

permissions:
  contents: write

concurrency:
  group: semantic-asr-v02-integration
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out integration branch
        uses: actions/checkout@v6
        with:
          ref: codex/semantic-asr-v0.2-integrated
          fetch-depth: 0
          persist-credentials: true

      - name: Merge the research stack without discarding either history
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "semantic-asr-integration"
          git config user.email "204638875+dj-thank@users.noreply.github.com"
          git fetch origin codex/semantic-asr-v0.2-research-stack

          set +e
          git merge --no-ff --no-commit origin/codex/semantic-asr-v0.2-research-stack
          merge_status=$?
          set -e

          mapfile -t conflicts < <(git diff --name-only --diff-filter=U)
          for path in "${conflicts[@]}"; do
            # The adaptive branch is the runtime source of truth for paths that
            # both branches independently implemented. Files unique to the
            # research stack are retained by Git automatically.
            if git ls-files -u -- "$path" | awk '$3 == 2 { found=1 } END { exit !found }'; then
              git checkout --ours -- "$path"
              git add -- "$path"
            else
              git rm -f -- "$path"
            fi
          done

          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "Unresolved merge conflicts remain" >&2
            git diff --name-only --diff-filter=U >&2
            exit 1
          fi
          if [ "$merge_status" -ne 0 ] && [ "${#conflicts[@]}" -eq 0 ]; then
            echo "Merge failed without resolvable file conflicts" >&2
            exit "$merge_status"
          fi

      - name: Remove one-shot and auto-merge automation
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/SNAPSHOT_REQUEST \
            .github/scripts/apply_frontier_finalizer.py \
            .github/scripts/apply_frontier_finalizer_v2.py \
            .github/workflows/apply-frontier-finalizer-once.yml \
            .github/workflows/apply-frontier-finalizer-v2-once.yml \
            .github/workflows/export-source-snapshot.yml \
            .github/workflows/v02-autofix.yml \
            .github/workflows/v02-finalize.yml \
            .github/workflows/v02-mark-ready.yml \
            .github/workflows/v02-merge-after-green.yml \
            .github/workflows/v02-post-review.yml \
            .github/workflows/v02-record-validation.yml \
            .github/workflows/v02-merge-after-final.yml \
            .github/workflows/v02-release-merge.yml \
            .github/workflows/v02-release-verified-merge.yml \
            scripts/apply_pr_review_fixes.py \
            scripts/apply_pr_review_fixes_v2.py \
            scripts/finalize_v02_branch.py

      - name: Record the integration boundary
        shell: bash
        run: |
          cat > docs/INTEGRATION_V0.2.md <<'EOF'
          # Semantic ASR v0.2 integration boundary

          This branch is the explicit integration of:

          - `codex/semantic-asr-v0.2-adaptive-reranking` (runtime and frontier implementation), and
          - `codex/semantic-asr-v0.2-research-stack` (typed research, reproducibility, and governance implementation).

          Both Git histories are retained by a real merge commit. For paths independently
          implemented on both branches, the adaptive-reranking version is the initial source
          of truth because it already contains the broader executable runtime and model-free
          test surface. Files unique to the research stack are retained and must either be
          connected through explicit adapters or marked experimental; silent duplication is
          not treated as integration.

          The immutable evidence rule remains:

          ```text
          observedTranscript != normalizedTranscript
          ```

          Text-only models may rank evidence or propose a candidate. They may not directly
          author the observed transcript. Generated candidates require acoustic verification.

          One-shot mutation and automatic-merge workflows are deliberately removed. CI,
          frontier contracts, release gates, and real-audio workflows remain reviewable and
          fail closed.
          EOF

      - name: Normalize lint policy for data registries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          pyproject = Path("pyproject.toml")
          text = pyproject.read_text(encoding="utf-8")
          for stale in (
              '"scripts/apply_pr_review_fixes.py" = ["E501"]\n',
              '"scripts/apply_pr_review_fixes_v2.py" = ["E501"]\n',
          ):
              text = text.replace(stale, "")
          entry = '"src/semantic_asr/research_registry.py" = ["E501"]'
          if entry not in text:
              anchor = "[tool.ruff.lint.per-file-ignores]\n"
              addition = (
                  "# Source titles and falsification statements are immutable registry data.\n"
                  f"{entry}\n"
              )
              if anchor not in text:
                  raise RuntimeError("missing Ruff per-file-ignore section")
              text = text.replace(anchor, anchor + addition, 1)
          pyproject.write_text(text, encoding="utf-8")

          frontier_cli = Path("src/semantic_asr/frontier_cli.py")
          cli_text = frontier_cli.read_text(encoding="utf-8")
          old = (
              '        description="Semantic ASR frontier training, deployment, '
              'and real-audio experiment commands.",'
          )
          new = (
              "        description=(\n"
              '            "Semantic ASR frontier training, deployment, and real-audio "\n'
              '            "experiment commands."\n'
              "        ),"
          )
          if old in cli_text:
              cli_text = cli_text.replace(old, new, 1)
          frontier_cli.write_text(cli_text, encoding="utf-8")
          PY

      - name: Canonically format and repair safe lint findings
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'ruff==0.16.5'
          python -m ruff format src tests scripts
          python -m ruff check --fix --unsafe-fixes src tests scripts
          python -m compileall -q src tests scripts

      - name: Remove this one-shot workflow and commit the merge
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/integrate-v02-once.yml
          git add -A
          git diff --cached --check
          git commit -m "merge: integrate Semantic ASR v0.2 research and runtime stacks"
          git push origin HEAD:codex/semantic-asr-v0.2-integrated
