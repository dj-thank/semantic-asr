name: Assemble canonical score contract for issue 25

on:
  push:
    branches:
      - codex/canonical-score-contract-25

permissions:
  contents: write

jobs:
  assemble-validate-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/canonical-score-contract-25
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Assemble the canonical module
        shell: bash
        run: |
          cat .score-contract-parts/part-* | tr -d '\n\r' | base64 --decode > /tmp/score_contract.py.bz2
          python - <<'PY'
          import bz2
          from pathlib import Path

          compressed = Path('/tmp/score_contract.py.bz2').read_bytes()
          Path('src/semantic_asr/score_contract.py').write_bytes(bz2.decompress(compressed))
          PY
          test "$(sha256sum src/semantic_asr/score_contract.py | cut -d' ' -f1)" = "e49eac2fcc0d1bb0581a671151744c6586af8669922fa1ee5c544d96fae34e27"
      - name: Apply lossless repository migration rules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one {label}, found {count}')
              return text.replace(old, new)

          path = Path('src/semantic_asr/score_contract.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              'legacy_source.startswith("ctc-")',
              'legacy_source.startswith(("ctc-phone:", "ctc-mora:"))',
              'reserved CTC source condition',
          )
          text = replace_once(
              text,
              '                and (metadata or {}).get("frameCount") is not None\n',
              '',
              'legacy CTC frame-count guard',
          )
          text = replace_once(
              text,
              '            # its stored value is explicitly mean-frame likelihood and carries\n            # frameCount in the receipt.\n',
              '            # both reserved producers stored candidate values as mean-frame likelihood.\n',
              'legacy CTC explanation',
          )
          text = replace_once(
              text,
              'raise ValueError("use an applicable calibration profile to construct probabilities")',
              'raise ValueError("use an applicable calibrator profile to construct probabilities")',
              'probability construction error',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('tests/test_v02_ranker.py')
          text = path.read_text(encoding='utf-8')
          text = replace_once(
              text,
              '    assert calibrated.require_probability() == pytest.approx(0.72)\n',
              '    with pytest.raises(ValueError, match="Registry"):\n        calibrated.require_probability()\n',
              'legacy unregistered probability expectation',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Export the canonical public API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          path = Path('src/semantic_asr/__init__.py')
          text = path.read_text(encoding='utf-8')
          old = 'from .score_semantics import EvidenceScore, ScoreKind\n'
          new = textwrap.dedent('''
              from .score_contract import (
                  SCORE_SCHEMA_VERSION,
                  CalibrationProfile,
                  CalibrationProfileRegistry,
                  EvidenceScore,
                  ScoreContractError,
                  ScoreDomain,
                  ScoreMigrationError,
                  ScoreNormalization,
                  ScoreProvenance,
                  ScoreSemantics,
                  require_same_score_domain,
              )
              from .score_semantics import ScoreKind
          ''').lstrip()
          if text.count(old) != 1:
              raise SystemExit(f'expected one legacy score import, found {text.count(old)}')
          text = text.replace(old, new)
          marker = '    "EvidenceScore",\n'
          additions = textwrap.dedent('''
                  "SCORE_SCHEMA_VERSION",
                  "CalibrationProfile",
                  "CalibrationProfileRegistry",
                  "ScoreContractError",
                  "ScoreDomain",
                  "ScoreMigrationError",
                  "ScoreNormalization",
                  "ScoreProvenance",
                  "ScoreSemantics",
          ''')
          if text.count(marker) != 1:
              raise SystemExit(f'expected one EvidenceScore __all__ entry, found {text.count(marker)}')
          text = text.replace(marker, marker + additions)
          function_marker = '    "rank_candidate_pronunciations",\n'
          if text.count(function_marker) != 1:
              raise SystemExit('expected rank_candidate_pronunciations public marker')
          text = text.replace(
              function_marker,
              function_marker + '    "require_same_score_domain",\n',
          )
          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove bootstrap material
        shell: bash
        run: |
          rm -rf .score-contract-parts
          rm -f .github/workflows/assemble-score-contract-25.yml
      - name: Install and format
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff format src tests scripts
          python -m ruff check --fix src tests scripts
          python -m ruff format src tests scripts
          git diff --check
      - name: Validate the migration
        run: |
          python -m compileall -q src tests scripts
          python -m pytest -q
          python scripts/replay_phonetic_decisions.py
          python - <<'PY'
          from pathlib import Path

          definitions = []
          for path in Path('src/semantic_asr').glob('*.py'):
              for number, line in enumerate(path.read_text(encoding='utf-8').splitlines(), 1):
                  if line.startswith('class EvidenceScore'):
                      definitions.append((str(path), number))
          assert len(definitions) == 1, definitions
          assert definitions[0][0] == 'src/semantic_asr/score_contract.py', definitions
          PY
      - name: Commit the validated source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement the canonical score contract'
          git push origin HEAD:codex/canonical-score-contract-25
