name: Apply PR60 Ruff format patch

on:
  push:
    branches:
      - codex/research-cycle-integrity-v2
    paths:
      - ".patch-bootstrap/READY-FORMAT"

permissions:
  contents: write

concurrency:
  group: apply-pr60-ruff-format
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/research-cycle-integrity-v2
          fetch-depth: 0
      - name: Apply exact Ruff format diff
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .patch-bootstrap/ruff-format.patch.b64 > /tmp/ruff-format.patch
          echo "40b43fbe35aad47259dd33199e4a9344fbeddd14203a443fccf5401da64fae04  /tmp/ruff-format.patch" | sha256sum -c -
          git apply -p0 --check /tmp/ruff-format.patch
          git apply -p0 /tmp/ruff-format.patch
          echo "f2ac16b65f0ce3c066478df427be1c52578fc1b8c11b97297d030568f0d2d950  scripts/research_cycle.py" | sha256sum -c -
          echo "c2b1eb665956537c91ac42f5c201dbffb710e926ee6b8bdb4475e42afccd4f44  tests/test_research_cycle_receipt_integrity.py" | sha256sum -c -
          python -m compileall -q scripts/research_cycle.py tests/test_research_cycle_receipt_integrity.py
          git diff --check
          git add scripts/research_cycle.py tests/test_research_cycle_receipt_integrity.py
          test "$(git diff --cached --name-only)" = $'scripts/research_cycle.py\ntests/test_research_cycle_receipt_integrity.py'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Ruff formatting to integrity patch"
          git push origin HEAD:codex/research-cycle-integrity-v2
