name: Apply frontier finalizer v2 once

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-adaptive-reranking
    paths:
      - .github/scripts/apply_frontier_finalizer_v2.py
      - .github/workflows/apply-frontier-finalizer-v2-once.yml

permissions:
  contents: write

concurrency:
  group: semantic-asr-frontier-finalizer-v2
  cancel-in-progress: false

jobs:
  apply-test-and-self-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/semantic-asr-v0.2-adaptive-reranking
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply final patch and remove temporary automation
        run: python .github/scripts/apply_frontier_finalizer_v2.py
      - run: python -m pip install -U pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff format src tests
      - run: ruff check src tests
      - run: pytest -q
      - name: Commit the validated clean result
        run: |
          git config user.name "semantic-asr-ci"
          git config user.email "204638875+dj-thank@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No frontier changes required."
            exit 0
          fi
          git commit -m "feat: complete v0.2 frontier risk, scoring, LFM, and acoustic guards"
          git push origin HEAD:codex/semantic-asr-v0.2-adaptive-reranking
