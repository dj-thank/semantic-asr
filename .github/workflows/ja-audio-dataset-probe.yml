name: Probe Japanese audio evaluation data

on:
  push:
    branches:
      - codex/japanese-audio-tuning-20260904
    paths:
      - .github/workflows/ja-audio-dataset-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dataset dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'datasets[audio]>=3,<5' soundfile scipy numpy
      - name: Probe immutable ReazonSpeech test snapshot
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "120"
        run: |
          python - <<'PY'
          import io
          import json
          import soundfile as sf
          from datasets import Audio, load_dataset

          dataset_id = 'japanese-asr/ja_asr.reazonspeech_test'
          revision = 'dd08bfb9dfc1cef4e4d0609fd78c3755d48b926f'
          ds = load_dataset(dataset_id, revision=revision, split='test')
          ds = ds.cast_column('audio', Audio(decode=False))
          print(json.dumps({
              'dataset': dataset_id,
              'revision': revision,
              'rows': len(ds),
              'columns': ds.column_names,
              'features': str(ds.features),
          }, ensure_ascii=False))
          total_seconds = 0.0
          for index in range(min(8, len(ds))):
              row = ds[index]
              audio = row['audio']
              data, rate = sf.read(io.BytesIO(audio['bytes']), dtype='float32')
              duration = len(data) / rate
              total_seconds += duration
              print(json.dumps({
                  'index': index,
                  'rate': rate,
                  'duration': round(duration, 3),
                  'transcription': str(row.get('transcription', '')),
                  'audio_bytes': len(audio['bytes']),
              }, ensure_ascii=False))
          print(json.dumps({'sample_seconds': round(total_seconds, 3)}, ensure_ascii=False))
          PY
