name: PCM and runtime integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: audio-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audio-runtime:
    name: PCM and runtime integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install sample-level validation dependencies
        run: python -m pip install -e '.[dev]' 'numpy>=1.26'
      - name: Require the PCM tests to execute, not skip
        run: python -c "import numpy; print(numpy.__version__)"
      - name: Verify samples, decoder boundaries, concurrency and real orchestration
        run: python -m pytest -q tests/test_audio_sample_integrity.py tests/test_runtime_reliability.py tests/test_api.py tests/test_utterances.py tests/test_longform_deliberation.py tests/test_integrity_adversarial.py
      - name: Verify tracked source stayed unchanged
        run: git diff --exit-code
