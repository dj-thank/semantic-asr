        shell: bash
        run: |
          rm -f .github/workflows/finalize-phonetic-feature-export-v03.yml
          rm -f phonetic-export-tests.xml
          rm -rf .export-wheel
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts docs examples pyproject.toml .github/workflows
          git commit -m 'Validate frozen Japanese phonetic feature export'
          git push origin HEAD:codex/export-japanese-phonetic-features-v03

