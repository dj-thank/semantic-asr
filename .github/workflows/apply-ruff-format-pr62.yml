name: Apply Ruff formatting for PR 62

on:
  push:
    branches:
      - codex/dataset-lineage-rights-v2
    paths:
      - ".github/workflows/apply-ruff-format-pr62.yml"

permissions:
  contents: write

concurrency:
  group: apply-ruff-format-pr62
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/dataset-lineage-rights-v2
          fetch-depth: 0
      - name: Apply the exact Ruff diagnostic patch
        shell: bash
        run: |
          set -euo pipefail
          base="0414bb0c11db1864efbcd31e344ce6b51fdc7536"
          base_tree="e225bf41f57a80ee3efa805b27f915f289bba5dd"
          final_tree="b24a336f09f5b60d7daeb85f6e2f8549ec8401de"
          helper=".github/workflows/apply-ruff-format-pr62.yml"

          test "$(git merge-base HEAD "$base")" = "$base"
          test "$(git rev-parse "$base^{tree}")" = "$base_tree"
          test "$(git diff --name-only "$base"..HEAD)" = "$helper"

          printf '%s' '' | base64 --decode | gzip -dc > /tmp/format.patch
          echo "0cdbf99c01c79e3f6fec9779eb1f203f0c55ded8dc3d911a45c48959c11de2c1  /tmp/format.patch" | sha256sum -c -
          git apply -p0 --check /tmp/format.patch
          git apply -p0 /tmp/format.patch
          git rm -f "$helper"
          git add -A
          git diff --cached --check

          expected="$({
            printf '%s\n' "$helper"
            printf '%s\n' 'scripts/validate_v02_manifest.py'
            printf '%s\n' 'src/semantic_asr/experiment.py'
            printf '%s\n' 'src/semantic_asr/rights.py'
            printf '%s\n' 'tests/test_dataset_lineage_contract.py'
          } | sort)"
          actual="$(git diff --cached --name-only | sort)"
          test "$actual" = "$expected"
          test "$(git write-tree)" = "$final_tree"
          python -m compileall -q src tests scripts

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: apply Ruff formatting to dataset lineage contract"
          git push origin HEAD:codex/dataset-lineage-rights-v2
