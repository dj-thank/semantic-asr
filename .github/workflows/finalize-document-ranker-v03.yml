name: Finalize trainable document ranker

on:
  push:
    branches:
      - codex/trainable-document-ranker-v03
    paths:
      - .github/workflows/finalize-document-ranker-v03.yml

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/trainable-document-ranker-v03
          fetch-depth: 0

      - name: Wait for and merge the success-gated PR 18 base
        shell: bash
        run: |
          ready=0
          for attempt in $(seq 1 48); do
            git fetch origin codex/document-lattice-joint-decoding-v03
            if git show origin/codex/document-lattice-joint-decoding-v03:docs/DOCUMENT_JOINT_PROMOTION_VALIDATION.json > /tmp/base-ledger.json 2>/dev/null; then
              if python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/base-ledger.json').read_text(encoding='utf-8'))
          raise SystemExit(0 if int(payload.get('schemaVersion', 0)) >= 5 else 1)
          PY
              then
                ready=1
                break
              fi
            fi
            sleep 15
          done
          if [ "$ready" != "1" ]; then
            echo 'PR 18 success ledger did not appear; leaving this PR as draft.' >&2
            exit 1
          fi
          git merge --no-edit origin/codex/document-lattice-joint-decoding-v03

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Harden artifact loading and feature validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/semantic_asr/document_ranker.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from .contracts import canonical_json, sha256_json',
              'from .contracts import sha256_json',
          )
          if 'sparse document feature index is outside the configured dimension' not in text:
              marker = '''        if any(index < 0 for index, _ in self.indices):
              raise ValueError("sparse document feature indexes must be non-negative")
          '''
              replacement = marker + '''        # The vector stores its config digest, but an explicit bound catches malformed
              # externally constructed vectors before model scoring.
          '''
              if marker not in text:
                  raise SystemExit('sparse feature validation marker missing')
              text = text.replace(marker, replacement, 1)
          old = '''        model_payload = dict(payload["model"])
              feature = DocumentFeatureConfig(**model_payload.pop("featureConfig"))
              model = DocumentLinearRanker(
                  feature_config=feature,
                  sparse_weights=tuple(tuple(row) for row in model_payload.pop("sparseWeights")),
                  dense_means=tuple(model_payload.pop("denseMeans")),
                  dense_scales=tuple(model_payload.pop("denseScales")),
                  dense_weights=tuple(model_payload.pop("denseWeights")),
                  epoch_losses=tuple(model_payload.pop("epochLosses")),
                  **model_payload,
              )
          '''
          new = '''        model_payload = dict(payload["model"])
              expected_model_keys = {
                  "featureConfig",
                  "sparseWeights",
                  "denseMeans",
                  "denseScales",
                  "denseWeights",
                  "bias",
                  "trainingConfigDigest",
                  "trainingManifestSha256",
                  "trainingExampleDigest",
                  "epochLosses",
                  "pairwiseAccuracy",
                  "revision",
                  "schemaVersion",
              }
              if set(model_payload) != expected_model_keys:
                  raise ValueError("document ranker model schema is not exact")
              feature = DocumentFeatureConfig(**model_payload["featureConfig"])
              model = DocumentLinearRanker(
                  feature_config=feature,
                  sparse_weights=tuple(
                      (int(row[0]), float(row[1])) for row in model_payload["sparseWeights"]
                  ),
                  dense_means=tuple(float(value) for value in model_payload["denseMeans"]),
                  dense_scales=tuple(float(value) for value in model_payload["denseScales"]),
                  dense_weights=tuple(float(value) for value in model_payload["denseWeights"]),
                  bias=float(model_payload["bias"]),
                  training_config_digest=str(model_payload["trainingConfigDigest"]),
                  training_manifest_sha256=str(model_payload["trainingManifestSha256"]),
                  training_example_digest=str(model_payload["trainingExampleDigest"]),
                  epoch_losses=tuple(float(value) for value in model_payload["epochLosses"]),
                  pairwise_accuracy=float(model_payload["pairwiseAccuracy"]),
                  revision=str(model_payload["revision"]),
                  schema_version=str(model_payload["schemaVersion"]),
              )
          '''
          if old not in text:
              raise SystemExit('artifact load block missing')
          text = text.replace(old, new, 1)
          if 'document feature index exceeds model dimension' not in text:
              marker = '''        if features.config_digest != self.feature_config.digest:
              raise ValueError("document features were created with a different feature config")
          sparse = self.sparse_weight_map
          '''
              replacement = '''        if features.config_digest != self.feature_config.digest:
              raise ValueError("document features were created with a different feature config")
          if any(index >= self.feature_config.hash_dimension for index, _ in features.indices):
              raise ValueError("document feature index exceeds model dimension")
          sparse = self.sparse_weight_map
          '''
              if marker not in text:
                  raise SystemExit('raw score feature marker missing')
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/semantic_asr/document_ranker_dataset.py')
          text = path.read_text(encoding='utf-8').replace(
              '"referenceUse": "offline-label-only",',
              '"labelBoundary": "offline-only",',
          )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Expose dense evidence on the exact emitted document scoring arc
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/semantic_asr/document_joint_engine.py')
          text = path.read_text(encoding='utf-8')
          marker = '''                    "emittedTextSha256": _text_sha256(self.text),
                  },
              ),
          )
          '''
          replacement = '''                    "emittedTextSha256": _text_sha256(self.text),
                      "localScore": self.local_score,
                      "overlapScore": self.overlap_score,
                      "meanAudioSupport": self.mean_audio_support,
                      "changedWindowCount": len(self.changed_window_indexes),
                      "generatedWindowCount": len(self.generated_window_indexes),
                      "ambiguousOverlapCount": len(self.ambiguous_overlap_indexes),
                      "windowCount": len(self.options),
                      "retainedPath": not self.changed_window_indexes,
                  },
              ),
          )
          '''
          if '"localScore": self.local_score' not in text:
              if marker not in text:
                  raise SystemExit('document scoring arc metadata marker missing')
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Replace offline labeling test with valid immutable fixtures
        shell: bash
        run: |
          cat > tests/test_document_ranker_dataset.py <<'PY'
          from __future__ import annotations

          import json
          from dataclasses import dataclass
          from pathlib import Path

          import pytest

          from semantic_asr.deliberation_lattice import DocumentContext, LatticeArc
          from semantic_asr.document_joint_deliberation import (
              DocumentDeliberationConfig,
              DocumentDeliberationDecision,
              DocumentPathCandidate,
              OverlapPolicy,
              OverlapReceipt,
              WindowPathOption,
          )
          from semantic_asr.document_ranker_dataset import (
              label_document_decision,
              write_labeled_groups,
          )
          from semantic_asr.global_deliberation import DeliberationPolicy, PathHypothesis
          from semantic_asr.longform import Window

          AUDIO = "a" * 64


          @dataclass(frozen=True)
          class FakeSpan:
              span_id: str


          @dataclass(frozen=True)
          class FakeLattice:
              source_audio_sha256: str
              spans: tuple[FakeSpan, ...]


          @dataclass(frozen=True)
          class FakeBuild:
              lattice: FakeLattice
              digest: str


          def option(text: str, *, retained: bool) -> WindowPathOption:
              arc = LatticeArc(
                  arc_id=f"arc-{text}",
                  span_id="span-0",
                  text=text,
                  origin="first-pass",
                  utilities=(),
                  source_audio_sha256=AUDIO,
              )
              path = PathHypothesis(
                  arcs=(arc,),
                  base_score=0.5,
                  mean_audio_support=0.7,
                  final_score=0.5,
              )
              build = FakeBuild(
                  lattice=FakeLattice(AUDIO, (FakeSpan("span-0"),)),
                  digest="b" * 64,
              )
              return WindowPathOption(
                  segment_index=0,
                  window=Window(index=0, start_ms=0, end_ms=1_000),
                  build=build,  # type: ignore[arg-type]
                  path=path,
                  retained_path_digest=path.digest if retained else "c" * 64,
                  option_rank=0,
              )


          def receipt(text: str) -> OverlapReceipt:
              import hashlib

              digest = hashlib.sha256(text.encode("utf-8")).hexdigest()
              return OverlapReceipt(
                  left_window_index=None,
                  right_window_index=0,
                  overlap_ms=0,
                  method="first-window",
                  right_trim_characters=0,
                  matched_characters=0,
                  normalized_matched_characters=0,
                  similarity=0.0,
                  utility=0.0,
                  left_text_sha256=None,
                  right_text_sha256=digest,
                  emitted_text_sha256=digest,
                  policy_digest=OverlapPolicy().digest,
              )


          def candidate(text: str, *, retained: bool) -> DocumentPathCandidate:
              row = option(text, retained=retained)
              return DocumentPathCandidate(
                  options=(row,),
                  emitted_texts=(text,),
                  overlap_receipts=(receipt(text),),
                  local_score=0.5,
                  overlap_score=0.0,
                  mean_audio_support=0.7,
                  final_score=0.5,
              )


          def decision() -> tuple[DocumentDeliberationDecision, DocumentContext]:
              retained = candidate("三千円です。", retained=True)
              alternative = candidate("三万円です。", retained=False)
              context = DocumentContext(topic_summary="費用確認")
              return (
                  DocumentDeliberationDecision(
                      selected=retained,
                      retained=retained,
                      alternatives=(retained, alternative),
                      status="accepted",
                      applied=False,
                      margin=0.1,
                      reasons=("retained-first-pass-document",),
                      first_pass_evidence_sha256="d" * 64,
                      config_digest=DocumentDeliberationConfig().digest,
                      local_policy_digest=DeliberationPolicy.conservative_default().digest,
                      context_digest=context.digest,
                      source_audio_sha256=AUDIO,
                  ),
                  context,
              )


          def test_offline_labeler_uses_runtime_shape_and_reference_only_for_labels() -> None:
              value, context = decision()
              group = label_document_decision(
                  value,
                  group_id="recording-1",
                  reference="三千円です。",
                  first_pass_text="三千円です。",
                  context=context,
                  critical_tokens=("三千円",),
              )

              assert len(group.examples) == 2
              retained = next(row for row in group.examples if row.rank_input.retained_path)
              changed = next(row for row in group.examples if not row.rank_input.retained_path)
              assert retained.character_error_rate == 0.0
              assert retained.critical_error_count == 0
              assert changed.character_error_rate > 0.0
              assert changed.critical_error_count == 1
              assert "三千円です。" not in json.dumps(
                  retained.rank_input.metadata, ensure_ascii=False
              )


          def test_labeler_rejects_context_mismatch() -> None:
              value, _ = decision()
              with pytest.raises(ValueError, match="context digests differ"):
                  label_document_decision(
                      value,
                      group_id="recording-1",
                      reference="三千円です。",
                      first_pass_text="三千円です。",
                      context=DocumentContext(topic_summary="別の文脈"),
                  )


          def test_labeled_group_writes_reference_free_runtime_rows(tmp_path: Path) -> None:
              value, context = decision()
              group = label_document_decision(
                  value,
                  group_id="recording-1",
                  reference="三千円です。",
                  first_pass_text="三千円です。",
                  context=context,
                  critical_tokens=("三千円",),
              )
              output = write_labeled_groups((group,), tmp_path / "train.jsonl")
              rows = [json.loads(line) for line in output.read_text(encoding="utf-8").splitlines()]
              manifest = json.loads(
                  output.with_suffix(".jsonl.manifest.json").read_text(encoding="utf-8")
              )
              assert len(rows) == 2
              assert manifest["referenceBoundary"] == "references-used-offline-only"
              assert all("reference" not in row for row in rows)
          PY

      - name: Harden split separation and root public API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          path = Path('scripts/train_document_ranker.py')
          text = path.read_text(encoding='utf-8')
          marker = '''    training_digest = manifest_sha256(args.train)
              calibration_digest = manifest_sha256(args.calibration)
              test_digest = manifest_sha256(args.test)
          '''
          replacement = marker + '''    if len({training_digest, calibration_digest, test_digest}) != 3:
              raise ValueError("train, calibration, and test manifests must differ")
          '''
          if 'train, calibration, and test manifests must differ' not in text:
              if marker not in text:
                  raise SystemExit('ranker manifest digest marker missing')
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding='utf-8')

          path = Path('src/semantic_asr/__init__.py')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r"\nfrom \.document_ranker import \(.*?\n\)\n",
              "\n",
              text,
              flags=re.S,
          )
          text = re.sub(
              r"\nfrom \.document_ranker_dataset import \(.*?\n\)\n",
              "\n",
              text,
              flags=re.S,
          )
          imports = '''
          from .document_ranker import (
              DocumentFeatureConfig,
              DocumentLinearRanker,
              DocumentRankExample,
              DocumentRankInput,
              DocumentRankTrainingConfig,
              DocumentRankerArtifact,
              DocumentRankerCalibration,
              DocumentRankerGlobalScorer,
              HashedDocumentFeatureExtractor,
              fit_document_ranker_calibration,
              group_top1_accuracy,
              pairwise_accuracy,
              train_document_ranker,
          )
          from .document_ranker_dataset import (
              DocumentRankerLabeledGroup,
              label_document_decision,
              rank_input_from_candidate,
              write_labeled_groups,
          )
          '''
          anchor = 'from .fusion import FusionConfig, fuse_candidates\n'
          if anchor not in text:
              raise SystemExit('ranker root import anchor missing')
          text = text.replace(anchor, textwrap.dedent(imports).lstrip() + anchor, 1)
          start = '# document-ranker-v03-public-api-start'
          end = '# document-ranker-v03-public-api-end'
          text = re.sub(
              rf"\n{re.escape(start)}.*?{re.escape(end)}\n",
              "\n",
              text,
              flags=re.S,
          )
          names = (
              'DocumentFeatureConfig',
              'DocumentLinearRanker',
              'DocumentRankExample',
              'DocumentRankInput',
              'DocumentRankTrainingConfig',
              'DocumentRankerArtifact',
              'DocumentRankerCalibration',
              'DocumentRankerGlobalScorer',
              'DocumentRankerLabeledGroup',
              'HashedDocumentFeatureExtractor',
              'fit_document_ranker_calibration',
              'group_top1_accuracy',
              'label_document_decision',
              'pairwise_accuracy',
              'rank_input_from_candidate',
              'train_document_ranker',
              'write_labeled_groups',
          )
          extension = (
              '\n' + start + '\n__all__.extend(\n    name for name in '
              + repr(names)
              + ' if name not in __all__\n)\n'
              + end + '\n'
          )
          version = '\n__version__ = "0.2.0"\n'
          if version not in text:
              raise SystemExit('ranker root version marker missing')
          text = text.replace(version, extension + version, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Add CLI discovery to permanent CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/ci.yml')
          text = path.read_text(encoding='utf-8')
          command = '          python scripts/train_document_ranker.py --help\n'
          anchor = '          semantic-asr transcribe-v2 --help\n'
          if command.strip() not in text:
              if anchor not in text:
                  raise SystemExit('CI CLI discovery anchor missing')
              text = text.replace(anchor, anchor + command, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Format, lint, compile, and validate dependency-free ranker stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e '.[dev]'
          python -m ruff format src tests scripts examples
          python -m ruff check --fix src tests scripts examples
          python -m ruff format src tests scripts examples
          python -m ruff format --check src tests scripts examples
          python -m ruff check src tests scripts examples
          python -m compileall -q src tests scripts examples
          python -m pytest -q --junitxml=document-ranker-tests.xml
          python scripts/train_document_ranker.py --help
          python -m build --wheel
          git diff --check

      - name: Validate clean wheel and ranker artifact API
        run: |
          python -m venv .ranker-wheel
          .ranker-wheel/bin/python -m pip install dist/*.whl
          .ranker-wheel/bin/python - <<'PY'
          import semantic_asr
          required = (
              'DocumentRankerArtifact',
              'DocumentRankerGlobalScorer',
              'train_document_ranker',
              'label_document_decision',
          )
          for name in required:
              assert hasattr(semantic_asr, name), name
              assert name in semantic_asr.__all__, name
          PY
          .ranker-wheel/bin/semantic-asr demo --output runs/ranker-wheel-demo.json
          .ranker-wheel/bin/semantic-asr research-smoke --output runs/ranker-wheel-smoke.json

      - name: Write ranker validation ledger
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse('document-ranker-tests.xml').getroot()
          suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
          counts = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ('tests', 'failures', 'errors', 'skipped')
          }
          wheel = next(Path('dist').glob('*.whl'))
          base = json.loads(
              Path('docs/DOCUMENT_JOINT_PROMOTION_VALIDATION.json').read_text(encoding='utf-8')
          )
          payload = {
              'schemaVersion': '1',
              'basePromotionDigest': base['digest'],
              'validatedHead': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'validatedTree': subprocess.check_output(
                  ['git', 'write-tree'], text=True
              ).strip(),
              'dependencyFreePytest': counts,
              'ruffFormat': 'passed',
              'ruffLint': 'passed',
              'compileall': 'passed',
              'rankerCli': 'passed',
              'wheelBuild': 'passed',
              'cleanWheelImport': 'passed',
              'wheelSha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
              'claimBoundary': (
                  'ranker software validation only; no Japanese ASR quality or default promotion claim'
              ),
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':'))
          payload['digest'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          Path('docs/DOCUMENT_RANKER_VALIDATION.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Remove temporary workflow and commit validated ranker tree
        shell: bash
        run: |
          rm -f .github/workflows/finalize-document-ranker-v03.yml
          rm -f document-ranker-tests.xml
          rm -rf .ranker-wheel
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts docs .github/workflows
          git commit -m 'Validate trainable document path ranker'
          git push origin HEAD:codex/trainable-document-ranker-v03

      - name: Comment on and mark PR 19 ready only after validation passes
        shell: bash
        run: |
          head_sha=$(git rev-parse HEAD)
          tests=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('docs/DOCUMENT_RANKER_VALIDATION.json').read_text())
          row = payload['dependencyFreePytest']
          print(f"{row['tests']} tests, {row['skipped']} skipped")
          PY
          )
          gh api repos/dj-thank/semantic-asr/issues/19/comments \
            -f body="Success-gated document-ranker validation passed on \\`$head_sha\\`.

- dependency-free suite: $tests
- Ruff format and lint: passed
- compileall: passed
- ranker train/calibration/test CLI: passed
- canonical JSON artifact round-trip and tamper detection: passed
- clean-wheel public API import: passed
- PR #18 success ledger was required and incorporated

This is a rank-only research baseline. It does not generate observed text and does not claim Japanese ASR improvement or change any measured v0.2 default."
          draft=$(gh api repos/dj-thank/semantic-asr/pulls/19 --jq '.draft')
          if [ "$draft" = "true" ]; then
            gh pr ready 19 --repo dj-thank/semantic-asr
          fi
