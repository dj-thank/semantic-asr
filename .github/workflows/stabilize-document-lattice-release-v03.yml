name: Stabilize document lattice release stack

on:
  push:
    branches:
      - codex/document-lattice-release-v03
    paths:
      - .github/workflows/stabilize-document-lattice-release-v03.yml

permissions:
  contents: write

jobs:
  stabilize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/document-lattice-release-v03
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Canonicalize document modules and root research API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          compatibility = '''
          """Compatibility import for the canonical joint document-lattice engine."""

          from .document_joint_engine import (
              DocumentArcReceipt,
              DocumentDeliberatedResult,
              DocumentDeliberatedSegment,
              DocumentDeliberationConfig,
              DocumentDeliberationDecision,
              DocumentFailureReceipt,
              DocumentNormalizedTranscript,
              DocumentObservedTranscript,
              DocumentPassThroughResult,
              DocumentPathCandidate,
              DocumentProposalProvider,
              JointDocumentSemanticASRTranscriber,
              OverlapPolicy,
              OverlapReceipt,
              WindowPathOption,
              apply_joint_document_deliberation,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )

          __all__ = [name for name in globals() if not name.startswith("_")]
          '''
          Path("src/semantic_asr/document_joint_deliberation.py").write_text(
              textwrap.dedent(compatibility).lstrip(), encoding="utf-8"
          )

          facade = '''
          """Public research facade for document decoding, phonetic evidence, and evaluation."""

          from .audio_posterior_adapters import (
              AudioPosteriorBackend,
              DualPosteriorExtractor,
              FrozenAudioPosteriorExtractor,
              FrozenPosteriorModelConfig,
              PosteriorBundle,
              PosteriorLogits,
              PosteriorResourcePolicy,
              TransformersCTCBackend,
              canonical_audio_sha256,
              posterior_sequence_from_logits,
              read_mono_wav,
          )
          from .document_deliberation_benchmark import (
              BootstrapInterval,
              DocumentBenchmarkReport,
              DocumentEvaluationCase,
              DocumentPromotionGate,
              PromotionDecision,
              apply_document_promotion_gate,
              character_error_rate,
              evaluate_document_deliberation,
              paired_bootstrap_cer_delta,
          )
          from .document_joint_engine import (
              DocumentArcReceipt,
              DocumentDeliberatedResult,
              DocumentDeliberatedSegment,
              DocumentDeliberationConfig,
              DocumentDeliberationDecision,
              DocumentFailureReceipt,
              DocumentNormalizedTranscript,
              DocumentObservedTranscript,
              DocumentPassThroughResult,
              DocumentPathCandidate,
              DocumentProposalProvider,
              JointDocumentSemanticASRTranscriber,
              OverlapPolicy,
              OverlapReceipt,
              WindowPathOption,
              apply_joint_document_deliberation,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )
          from .phonetic_heads_optional import JointPhoneMoraCTCHead
          from .phonetic_span_provider import (
              LoadedMonoAudio,
              MonoAudioLoader,
              PhoneticSpanProviderConfig,
              SelectivePhoneticSpanProposalProvider,
              SoundFileMonoAudioLoader,
              SpanAudioReceipt,
              SpanLexiconProvider,
              SpanProposalFailure,
              StaticSpanLexiconProvider,
          )
          from .phonetic_training import (
              JointPhoneticArtifact,
              JointPhoneticHeadConfig,
              PhoneticLabelInventory,
              PhoneticTrainingManifest,
              PhoneticValidationMetrics,
              posterior_configs_from_artifact,
          )

          __all__ = [name for name in globals() if not name.startswith("_")]
          '''
          Path("src/semantic_asr/document_deliberation.py").write_text(
              textwrap.dedent(facade).lstrip(), encoding="utf-8"
          )

          path = Path("src/semantic_asr/__init__.py")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"\nfrom \.document_deliberation import \(.*?\n\)\n",
              "\n",
              text,
              flags=re.S,
          )
          import_block = '''
          from .document_deliberation import (
              AudioPosteriorBackend,
              DocumentBenchmarkReport,
              DocumentDeliberatedResult,
              DocumentDeliberationConfig,
              DocumentEvaluationCase,
              DocumentFailureReceipt,
              DocumentPassThroughResult,
              DocumentPromotionGate,
              DualPosteriorExtractor,
              FrozenAudioPosteriorExtractor,
              FrozenPosteriorModelConfig,
              JointDocumentSemanticASRTranscriber,
              JointPhoneticArtifact,
              JointPhoneticHeadConfig,
              JointPhoneMoraCTCHead,
              LoadedMonoAudio,
              OverlapPolicy,
              OverlapReceipt,
              PhoneticLabelInventory,
              PhoneticSpanProviderConfig,
              PhoneticTrainingManifest,
              PhoneticValidationMetrics,
              PosteriorBundle,
              PosteriorLogits,
              PosteriorResourcePolicy,
              PromotionDecision,
              SelectivePhoneticSpanProposalProvider,
              SpanAudioReceipt,
              StaticSpanLexiconProvider,
              TransformersCTCBackend,
              apply_document_promotion_gate,
              apply_joint_document_deliberation,
              canonical_audio_sha256,
              evaluate_document_deliberation,
              paired_bootstrap_cer_delta,
              posterior_configs_from_artifact,
              posterior_sequence_from_logits,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )
          '''
          anchor = "from .fusion import FusionConfig, fuse_candidates\n"
          if anchor not in text:
              raise SystemExit("root public API import anchor missing")
          text = text.replace(anchor, textwrap.dedent(import_block).lstrip() + anchor, 1)

          start = "# document-v03-public-api-start"
          end = "# document-v03-public-api-end"
          text = re.sub(
              rf"\n{re.escape(start)}.*?{re.escape(end)}\n",
              "\n",
              text,
              flags=re.S,
          )
          names = (
              "AudioPosteriorBackend",
              "DocumentBenchmarkReport",
              "DocumentDeliberatedResult",
              "DocumentDeliberationConfig",
              "DocumentEvaluationCase",
              "DocumentFailureReceipt",
              "DocumentPassThroughResult",
              "DocumentPromotionGate",
              "DualPosteriorExtractor",
              "FrozenAudioPosteriorExtractor",
              "FrozenPosteriorModelConfig",
              "JointDocumentSemanticASRTranscriber",
              "JointPhoneticArtifact",
              "JointPhoneticHeadConfig",
              "JointPhoneMoraCTCHead",
              "LoadedMonoAudio",
              "OverlapPolicy",
              "OverlapReceipt",
              "PhoneticLabelInventory",
              "PhoneticSpanProviderConfig",
              "PhoneticTrainingManifest",
              "PhoneticValidationMetrics",
              "PosteriorBundle",
              "PosteriorLogits",
              "PosteriorResourcePolicy",
              "PromotionDecision",
              "SelectivePhoneticSpanProposalProvider",
              "SpanAudioReceipt",
              "StaticSpanLexiconProvider",
              "TransformersCTCBackend",
              "apply_document_promotion_gate",
              "apply_joint_document_deliberation",
              "canonical_audio_sha256",
              "evaluate_document_deliberation",
              "paired_bootstrap_cer_delta",
              "posterior_configs_from_artifact",
              "posterior_sequence_from_logits",
              "resolve_window_overlap",
              "with_joint_document_deliberation",
          )
          extension = (
              "\n"
              + start
              + "\n__all__.extend(\n"
              + "    name for name in "
              + repr(names)
              + " if name not in __all__\n)\n"
              + end
              + "\n"
          )
          version = '\n__version__ = "0.2.0"\n'
          if version not in text:
              raise SystemExit("root public API version marker missing")
          text = text.replace(version, extension + version, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Harden document resource bounds, identity, and first-pass receipts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/semantic_asr/document_joint_engine.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label}, found {count}")
              text = text.replace(old, new, 1)

          if "maximum_windows:" not in text:
              replace_once(
                  "    maximum_changed_windows: int = 12\n    maximum_changed_ratio: float = 0.50",
                  "    maximum_changed_windows: int = 12\n"
                  "    maximum_windows: int = 512\n"
                  "    maximum_total_local_options: int = 4_096\n"
                  "    maximum_document_characters: int = 500_000\n"
                  "    maximum_changed_ratio: float = 0.50",
                  "document resource fields",
              )
              replace_once(
                  '        for name in ("maximum_changed_windows",):',
                  '        for name in (\n'
                  '            "maximum_changed_windows",\n'
                  '            "maximum_windows",\n'
                  '            "maximum_total_local_options",\n'
                  '            "maximum_document_characters",\n'
                  '        ):',
                  "document resource integer validation",
              )
              replace_once(
                  '            if isinstance(value, bool) or value < 0:\n'
                  '                raise ValueError(f"{name} must be a non-negative integer")',
                  '            if isinstance(value, bool) or value < 0:\n'
                  '                raise ValueError(f"{name} must be a non-negative integer")\n'
                  '        if self.maximum_windows < 1:\n'
                  '            raise ValueError("maximum_windows must be positive")\n'
                  '        if self.maximum_total_local_options < 1:\n'
                  '            raise ValueError("maximum_total_local_options must be positive")\n'
                  '        if self.maximum_document_characters < 1:\n'
                  '            raise ValueError("maximum_document_characters must be positive")',
                  "document resource positive validation",
              )

          if "proposal_kwargs = dict(kwargs)" not in text:
              replace_once(
                  "            build = build_semantic_deliberation_lattice(**kwargs, proposals=proposals)",
                  "            proposal_kwargs = dict(kwargs)\n"
                  "            proposal_kwargs[\"proposals\"] = proposals\n"
                  "            build = build_semantic_deliberation_lattice(**proposal_kwargs)",
                  "proposal keyword merge",
              )

          if "normalized_match == len(normalized_right)" not in text:
              replace_once(
                  "        trim = right_map[normalized_match - 1]\n        if trim == len(right_text)",
                  "        trim = right_map[normalized_match - 1]\n"
                  "        if normalized_match == len(normalized_right):\n"
                  "            trim = len(right_text)\n"
                  "        if trim == len(right_text)",
                  "normalized full-window duplicate trim",
              )

          if "def _verify_first_pass_evidence(" not in text:
              replace_once(
                  '''def _text_sha256(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()
              ''',
                  '''def _text_sha256(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()


          def _verify_first_pass_evidence(first_pass: LongformResult) -> None:
              expected = sha256_json(
                  {
                      "sourceAudioSha256": first_pass.source_audio_sha256,
                      "durationMs": first_pass.duration_ms,
                      "observedText": first_pass.observed_text,
                      "normalizedText": first_pass.normalized_text,
                      "segmentEvidence": [
                          segment.observed.evidence_sha256 for segment in first_pass.segments
                      ],
                  }
              )
              if expected != first_pass.evidence_sha256:
                  raise ValueError("first-pass long-form evidence hash mismatch")
              ''',
                  "first-pass evidence helper",
              )

          if "failure receipt is linked to different source audio" not in text:
              replace_once(
                  '        if self.failure.first_pass_evidence_sha256 != self.first_pass_evidence_sha256:\n'
                  '            raise ValueError("failure receipt is linked to different first-pass evidence")',
                  '        if self.failure.first_pass_evidence_sha256 != self.first_pass_evidence_sha256:\n'
                  '            raise ValueError("failure receipt is linked to different first-pass evidence")\n'
                  '        if self.failure.source_audio_sha256 != self.source_audio_sha256:\n'
                  '            raise ValueError("failure receipt is linked to different source audio")',
                  "failure source audio binding",
              )

          pass_section = text.split("class DocumentPassThroughResult", 1)[1].split(
              "class DocumentArcReceipt", 1
          )[0]
          if "_verify_first_pass_evidence(self.first_pass)" not in pass_section:
              replace_once(
                  '        if self.first_pass.evidence_sha256 != self.first_pass_evidence_sha256:\n'
                  '            raise ValueError("pass-through result is linked to different first-pass evidence")',
                  '        if self.first_pass.evidence_sha256 != self.first_pass_evidence_sha256:\n'
                  '            raise ValueError("pass-through result is linked to different first-pass evidence")\n'
                  '        _verify_first_pass_evidence(self.first_pass)',
                  "pass-through first-pass verification",
              )

          result_section = text.split("class DocumentDeliberatedResult", 1)[1].split(
              "class _BeamState", 1
          )[0]
          if "_verify_first_pass_evidence(self.first_pass)" not in result_section:
              # The first matching line may be in pass-through, so replace inside the result section.
              marker = '        if self.first_pass.evidence_sha256 != self.first_pass_evidence_sha256:\n            raise ValueError("document result is linked to different first-pass evidence")'
              index = text.find(marker, text.find("class DocumentDeliberatedResult"))
              if index < 0:
                  raise SystemExit("document result first-pass verification marker missing")
              text = (
                  text[:index]
                  + marker
                  + "\n        _verify_first_pass_evidence(self.first_pass)"
                  + text[index + len(marker) :]
              )

          if "def _preserved_normalization(" not in text:
              marker = "\ndef _build_result(\n"
              helper = '''

          def _preserved_normalization(
              first_pass_segment: LongformSegment,
              observed: DocumentObservedTranscript,
          ) -> DocumentNormalizedTranscript:
              return DocumentNormalizedTranscript(
                  text=first_pass_segment.normalized.text,
                  observed_evidence_sha256=observed.evidence_sha256,
                  mode=getattr(first_pass_segment.normalized, "mode", "first-pass-linked"),
                  normalizer_version=getattr(
                      first_pass_segment.normalized,
                      "normalizer_version",
                      "first-pass-linked-v1",
                  ),
              )
          '''
              if marker not in text:
                  raise SystemExit("document build-result marker missing")
              text = text.replace(marker, helper + marker, 1)

          if "if decision.applied\n                    else _preserved_normalization" not in text:
              replace_once(
                  "                normalized=_normalization(observed),",
                  "                normalized=(\n"
                  "                    _normalization(observed)\n"
                  "                    if decision.applied\n"
                  "                    else _preserved_normalization(first_segment, observed)\n"
                  "                ),",
                  "unapplied normalization preservation",
              )

          resource_anchor = '''    if config.require_document_scorer and document_scorer is None:
              raise ValueError("joint document deliberation requires an explicit document scorer")
              if not first_pass.segments:
                  return first_pass
              try:
          '''
          if "document exceeds maximum_windows" not in text:
              replacement = '''    if config.require_document_scorer and document_scorer is None:
              raise ValueError("joint document deliberation requires an explicit document scorer")
              if not first_pass.segments:
                  return first_pass
              try:
                  _verify_first_pass_evidence(first_pass)
                  if len(first_pass.segments) > config.maximum_windows:
                      raise ValueError("document exceeds maximum_windows")
                  if sum(len(segment.observed.text) for segment in first_pass.segments) > (
                      config.maximum_document_characters
                  ):
                      raise ValueError("document exceeds maximum_document_characters")
          '''
              replace_once(resource_anchor, replacement, "document preflight resource guard")

          if "document exceeds maximum_total_local_options" not in text:
              replace_once(
                  '''        options_by_window = tuple(
              _window_options(
                  first_pass,
                  index,
                  config=config,
                  build_config=build_config,
                  local_policy=local_policy,
                  proposal_provider=proposal_provider,
                  declared_context=declared_context,
                  audio_path=audio_path,
              )
              for index in range(len(first_pass.segments))
          )
          candidates = _expand_document_beam(options_by_window, config=config)
          ''',
                  '''        options_by_window = tuple(
              _window_options(
                  first_pass,
                  index,
                  config=config,
                  build_config=build_config,
                  local_policy=local_policy,
                  proposal_provider=proposal_provider,
                  declared_context=declared_context,
                  audio_path=audio_path,
              )
              for index in range(len(first_pass.segments))
          )
          if sum(len(options) for options in options_by_window) > (
              config.maximum_total_local_options
          ):
              raise ValueError("document exceeds maximum_total_local_options")
          candidates = _expand_document_beam(options_by_window, config=config)
          ''',
                  "total local option guard",
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Fix clip-level posterior provenance and lexicon resource limits
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/semantic_asr/phonetic_span_provider.py")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label}, found {count}")
              text = text.replace(old, new, 1)

          if "maximum_surface_length_delta" not in text:
              replace_once(
                  "    proposals_per_span: int = 4\n    minimum_combined_utility: float = -0.20",
                  "    proposals_per_span: int = 4\n"
                  "    maximum_surface_length_delta: int = 2\n"
                  "    maximum_lexicon_entries: int = 4_096\n"
                  "    minimum_combined_utility: float = -0.20",
                  "phonetic provider resource fields",
              )
          elif "maximum_lexicon_entries" not in text:
              replace_once(
                  "    maximum_surface_length_delta: int = 2\n    minimum_combined_utility: float = -0.20",
                  "    maximum_surface_length_delta: int = 2\n"
                  "    maximum_lexicon_entries: int = 4_096\n"
                  "    minimum_combined_utility: float = -0.20",
                  "phonetic lexicon resource field",
              )

          if '"maximum_lexicon_entries"' not in text.split("def __post_init__", 1)[1].split(
              "@property", 1
          )[0]:
              replace_once(
                  '            "maximum_surface_length_delta",\n        ):',
                  '            "maximum_surface_length_delta",\n'
                  '            "maximum_lexicon_entries",\n'
                  '        ):',
                  "phonetic integer resource validation",
              )

          if "clip_sha256 = canonical_audio_sha256" not in text:
              replace_once(
                  '''        clip = audio.samples[sample_start:sample_end]
              bundle = self.extractor.extract(
                  clip,
                  sample_rate=audio.sample_rate,
                  source_audio_sha256=source_audio_sha256,
              )
          ''',
                  '''        clip = audio.samples[sample_start:sample_end]
              clip_sha256 = canonical_audio_sha256(clip, audio.sample_rate)
              bundle = self.extractor.extract(
                  clip,
                  sample_rate=audio.sample_rate,
                  source_audio_sha256=clip_sha256,
              )
          ''',
                  "clip posterior source binding",
              )
              replace_once(
                  "            canonical_clip_sha256=canonical_audio_sha256(clip, audio.sample_rate),",
                  "            canonical_clip_sha256=clip_sha256,",
                  "clip receipt digest reuse",
              )

          if "lexicon exceeds maximum_lexicon_entries" not in text:
              replace_once(
                  "                lexicon = self.lexicon_provider(span=span, context=context, build=build)\n                proposals = propose_text_from_pronunciation(",
                  "                lexicon = self.lexicon_provider(span=span, context=context, build=build)\n"
                  "                if len(lexicon.entries) > self.config.maximum_lexicon_entries:\n"
                  "                    raise ValueError(\"lexicon exceeds maximum_lexicon_entries\")\n"
                  "                proposals = propose_text_from_pronunciation(",
                  "phonetic lexicon size guard",
              )

          if "proposal posterior is bound to a different clip" not in text:
              replace_once(
                  "                existing = {\n                    arc.text: set(arc.independent_audio_channels) for arc in span.arcs\n                }",
                  "                if any(\n"
                  "                    proposal.source_audio_sha256 != receipt.canonical_clip_sha256\n"
                  "                    for proposal in proposals\n"
                  "                ):\n"
                  "                    raise ValueError(\"proposal posterior is bound to a different clip\")\n"
                  "                existing = {\n"
                  "                    arc.text: set(arc.independent_audio_channels) for arc in span.arcs\n"
                  "                }",
                  "phonetic proposal clip check",
              )

          if "posteriorClipSha256" not in text:
              replace_once(
                  '                                "posteriorBundleDigest": bundle.digest,',
                  '                                "posteriorBundleDigest": bundle.digest,\n'
                  '                                "posteriorClipSha256": receipt.canonical_clip_sha256,\n'
                  '                                "sourceRecordingSha256": source_audio_sha256,',
                  "phonetic proposal dual provenance",
              )

          if "existing_lengths = [len(arc.text) for arc in span.arcs]" not in text:
              replace_once(
                  "                verified = []\n                for proposal in proposals:\n",
                  "                existing_lengths = [len(arc.text) for arc in span.arcs]\n"
                  "                minimum_length = max(\n"
                  "                    0, min(existing_lengths) - self.config.maximum_surface_length_delta\n"
                  "                )\n"
                  "                maximum_length = (\n"
                  "                    max(existing_lengths) + self.config.maximum_surface_length_delta\n"
                  "                )\n"
                  "                verified = []\n"
                  "                for proposal in proposals:\n"
                  "                    if not minimum_length <= len(proposal.text) <= maximum_length:\n"
                  "                        continue\n",
                  "phonetic span-local surface guard",
              )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Normalize phonetic provider tests to local spans
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/test_phonetic_span_provider.py")
          text = path.read_text(encoding="utf-8")
          text = text.replace('assert receipt.canonical_clip_sha256 != AUDIO', 'assert receipt.canonical_clip_sha256 != AUDIO\n    assert receipt.posterior_bundle_digest')
          if "posteriorClipSha256" not in text:
              text = text.replace(
                  '    assert all("spanAudioReceiptDigest" in row.metadata for row in proposals[span_id])',
                  '    assert all("spanAudioReceiptDigest" in row.metadata for row in proposals[span_id])\n'
                  '    assert all(\n'
                  '        row.metadata["posteriorClipSha256"] == receipt.canonical_clip_sha256\n'
                  '        for row in proposals[span_id]\n'
                  '    )',
              )
          path.write_text(text, encoding="utf-8")
          PY

      - name: Extend permanent CPU training validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          old = "python -m pytest -q tests/test_training_optional.py tests/test_acoustic_verifier_optional.py"
          new = old + " tests/test_phonetic_heads_optional.py"
          if "tests/test_phonetic_heads_optional.py" not in text:
              if old not in text:
                  raise SystemExit("permanent optional CPU test command missing")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY

      - name: Format, lint, compile, and run dependency-free tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e '.[dev]'
          python -m ruff format src tests scripts examples
          python -m ruff check --fix src tests scripts examples
          python -m ruff format src tests scripts examples
          python -m ruff format --check src tests scripts examples
          python -m ruff check src tests scripts examples
          python -m compileall -q src tests scripts examples
          python -m pytest -q --junitxml=document-release-tests.xml
          python -m build --wheel
          python examples/document_joint_deliberation.py --help
          python scripts/benchmark_document_deliberation.py --help
          git diff --check

      - name: Run optional CPU PyTorch tests
        run: |
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q tests/test_phonetic_heads_optional.py

      - name: Validate clean wheel and public API
        run: |
          python -m venv .release-wheel
          .release-wheel/bin/python -m pip install dist/*.whl
          .release-wheel/bin/python - <<'PY'
          import semantic_asr
          required = (
              "DocumentDeliberationConfig",
              "DocumentPassThroughResult",
              "SelectivePhoneticSpanProposalProvider",
              "JointPhoneticHeadConfig",
              "apply_joint_document_deliberation",
              "evaluate_document_deliberation",
          )
          for name in required:
              assert hasattr(semantic_asr, name), name
              assert name in semantic_asr.__all__, name
          PY
          .release-wheel/bin/semantic-asr demo --output runs/release-wheel-demo.json
          .release-wheel/bin/semantic-asr research-smoke --output runs/release-wheel-smoke.json

      - name: Write immutable validation ledger
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("document-release-tests.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          counts = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          wheel = next(Path("dist").glob("*.whl"))
          payload = {
              "schemaVersion": "4",
              "validatedHead": subprocess.check_output(
                  ["git", "rev-parse", "HEAD"], text=True
              ).strip(),
              "validatedTree": subprocess.check_output(
                  ["git", "write-tree"], text=True
              ).strip(),
              "dependencyFreePytest": counts,
              "optionalCpuPyTorch": "passed",
              "ruffFormat": "passed",
              "ruffLint": "passed",
              "compileall": "passed",
              "wheelBuild": "passed",
              "cleanWheelImport": "passed",
              "wheelSha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "claimBoundary": (
                  "software and reproducibility validation only; no Japanese CER promotion claim"
              ),
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          payload["digest"] = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          Path("docs/DOCUMENT_JOINT_VALIDATION.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Remove every temporary document workflow, commit, and update PR branch
        shell: bash
        run: |
          rm -f .github/workflows/finalize-document-joint.yml
          rm -f .github/workflows/finalize-document-joint-v3.yml
          rm -f .github/workflows/validate-document-joint-v03.yml
          rm -f .github/workflows/reconcile-document-joint-v03.yml
          rm -f .github/workflows/repair-document-joint-v4.yml
          rm -f .github/workflows/stabilize-document-lattice-release-v03.yml
          rm -f document-release-tests.xml
          rm -rf .release-wheel
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts examples docs .github/workflows
          git commit -m 'Stabilize joint document lattice and phonetic evidence release'
          git push origin HEAD:codex/document-lattice-release-v03
          git push origin HEAD:codex/document-lattice-joint-decoding-v03
