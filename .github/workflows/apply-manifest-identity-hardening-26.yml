name: Apply manifest identity hardening for issue 26

on:
  push:
    branches:
      - codex/manifest-identity-hardening-26
    paths:
      - ".patch-bootstrap/READY-MANIFEST-26"

permissions:
  contents: write

concurrency:
  group: apply-manifest-identity-hardening-26
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/manifest-identity-hardening-26
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Verify, apply, and test pinned patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .patch-bootstrap/manifest-validation.patch.gz.b64 | gzip -dc > /tmp/manifest-validation.patch
          echo "05f6e314c320478976ad88f273b386c9d994001ec1f7388cc2901d9c2273a69f  /tmp/manifest-validation.patch" | sha256sum -c -
          git apply --check /tmp/manifest-validation.patch
          git apply /tmp/manifest-validation.patch
          echo "34e8a036584d762dc8e641c0ab9a7155871f7f718dea3e2db96a356162ae4a61  docs/REAL_AUDIO_EXPERIMENTS.md" | sha256sum -c -
          echo "432902a85e330760cf6d117f2501cc6c6595a3f87a0ec47c2dcbb47a819c4451  schemas/v02-experiment-manifest.schema.json" | sha256sum -c -
          echo "bf8ad1b3e9845276714f8740e1d465935c80c44657969769c9b577361c02a704  src/semantic_asr/experiment.py" | sha256sum -c -
          echo "4efced0c3338cfdc502a2e63b8bdef57b087be51ab897811abf5e9efcdd79b86  tests/test_dataset_manifest_contract.py" | sha256sum -c -
          echo "0e9c010f690ae26139f4a231f67e381d40ff3e643850589394e8a106a89332cb  tests/test_v02_schemas.py" | sha256sum -c -
          python -m pip install -e '.[dev]'
          python -m ruff format --check src/semantic_asr/experiment.py tests/test_dataset_manifest_contract.py tests/test_v02_schemas.py
          python -m ruff check src/semantic_asr/experiment.py tests/test_dataset_manifest_contract.py tests/test_v02_schemas.py
          python -m compileall -q src/semantic_asr/experiment.py tests/test_dataset_manifest_contract.py tests/test_v02_schemas.py
          python -m pytest -q tests/test_dataset_manifest_contract.py tests/test_v02_schemas.py tests/test_v02_research_stack.py
          git diff --check
          git add docs/REAL_AUDIO_EXPERIMENTS.md schemas/v02-experiment-manifest.schema.json src/semantic_asr/experiment.py tests/test_dataset_manifest_contract.py tests/test_v02_schemas.py
          test "$(git diff --cached --name-only)" = $'docs/REAL_AUDIO_EXPERIMENTS.md\nschemas/v02-experiment-manifest.schema.json\nsrc/semantic_asr/experiment.py\ntests/test_dataset_manifest_contract.py\ntests/test_v02_schemas.py'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: reject ambiguous manifest identities"
          git push origin HEAD:codex/manifest-identity-hardening-26
