name: Probe cross-domain Japanese speech snapshots

on:
  push:
    branches:
      - codex/japanese-audio-tuning-20260904
    paths:
      - .github/workflows/ja-cross-domain-dataset-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install lightweight data stack
        run: python -m pip install 'datasets==3.6.0' soundfile huggingface-hub
      - name: Resolve and probe candidate snapshots
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: "180"
        run: |
          python - <<'PY'
          import io
          import json
          import traceback

          import soundfile as sf
          from datasets import Audio, load_dataset
          from huggingface_hub import HfApi

          api = HfApi()
          candidates = [
              'japanese-asr/ja_asr.jsut_basic5000',
              'japanese-asr/ja_asr.common_voice_8_0',
          ]
          for dataset_id in candidates:
              try:
                  revision = api.dataset_info(dataset_id).sha
                  ds = load_dataset(dataset_id, revision=revision, split='test')
                  ds = ds.cast_column('audio', Audio(decode=False))
                  row = ds[0]
                  data, rate = sf.read(io.BytesIO(row['audio']['bytes']), dtype='float32')
                  print(json.dumps({
                      'status': 'ok',
                      'dataset': dataset_id,
                      'revision': revision,
                      'rows': len(ds),
                      'columns': ds.column_names,
                      'sampleRate': rate,
                      'duration': round(len(data) / rate, 3),
                      'transcription': str(row.get('transcription', '')),
                  }, ensure_ascii=False))
              except Exception as exc:
                  print(json.dumps({
                      'status': 'error',
                      'dataset': dataset_id,
                      'errorType': type(exc).__name__,
                      'error': str(exc),
                  }, ensure_ascii=False))
                  traceback.print_exc()
          PY
