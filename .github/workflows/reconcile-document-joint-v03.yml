name: Reconcile and validate canonical document stack

on:
  push:
    branches:
      - codex/document-lattice-joint-decoding-v03
    paths:
      - .github/workflows/reconcile-document-joint-v03.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/document-lattice-joint-decoding-v03
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Point compatibility surfaces to the canonical engine
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          compatibility = '''
          """Compatibility import for the canonical joint document-lattice engine."""

          from .document_joint_engine import (
              DocumentArcReceipt,
              DocumentDeliberatedResult,
              DocumentDeliberatedSegment,
              DocumentDeliberationConfig,
              DocumentDeliberationDecision,
              DocumentFailureReceipt,
              DocumentNormalizedTranscript,
              DocumentObservedTranscript,
              DocumentPassThroughResult,
              DocumentPathCandidate,
              DocumentProposalProvider,
              JointDocumentSemanticASRTranscriber,
              OverlapPolicy,
              OverlapReceipt,
              WindowPathOption,
              apply_joint_document_deliberation,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )

          __all__ = [name for name in globals() if not name.startswith("_")]
          '''
          Path("src/semantic_asr/document_joint_deliberation.py").write_text(
              textwrap.dedent(compatibility).lstrip(), encoding="utf-8"
          )

          facade = '''
          """Public research facade for document decoding, phonetic evidence, and evaluation."""

          from .audio_posterior_adapters import (
              AudioPosteriorBackend,
              DualPosteriorExtractor,
              FrozenAudioPosteriorExtractor,
              FrozenPosteriorModelConfig,
              PosteriorBundle,
              PosteriorLogits,
              PosteriorResourcePolicy,
              TransformersCTCBackend,
              canonical_audio_sha256,
              posterior_sequence_from_logits,
              read_mono_wav,
          )
          from .document_deliberation_benchmark import (
              BootstrapInterval,
              DocumentBenchmarkReport,
              DocumentEvaluationCase,
              DocumentPromotionGate,
              PromotionDecision,
              apply_document_promotion_gate,
              character_error_rate,
              evaluate_document_deliberation,
              paired_bootstrap_cer_delta,
          )
          from .document_joint_engine import (
              DocumentArcReceipt,
              DocumentDeliberatedResult,
              DocumentDeliberatedSegment,
              DocumentDeliberationConfig,
              DocumentDeliberationDecision,
              DocumentFailureReceipt,
              DocumentNormalizedTranscript,
              DocumentObservedTranscript,
              DocumentPassThroughResult,
              DocumentPathCandidate,
              DocumentProposalProvider,
              JointDocumentSemanticASRTranscriber,
              OverlapPolicy,
              OverlapReceipt,
              WindowPathOption,
              apply_joint_document_deliberation,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )
          from .phonetic_heads_optional import JointPhoneMoraCTCHead
          from .phonetic_span_provider import (
              LoadedMonoAudio,
              MonoAudioLoader,
              PhoneticSpanProviderConfig,
              SelectivePhoneticSpanProposalProvider,
              SoundFileMonoAudioLoader,
              SpanAudioReceipt,
              SpanLexiconProvider,
              SpanProposalFailure,
              StaticSpanLexiconProvider,
          )
          from .phonetic_training import (
              JointPhoneticArtifact,
              JointPhoneticHeadConfig,
              PhoneticLabelInventory,
              PhoneticTrainingManifest,
              PhoneticValidationMetrics,
              posterior_configs_from_artifact,
          )

          __all__ = [name for name in globals() if not name.startswith("_")]
          '''
          Path("src/semantic_asr/document_deliberation.py").write_text(
              textwrap.dedent(facade).lstrip(), encoding="utf-8"
          )

          path = Path("src/semantic_asr/__init__.py")
          text = path.read_text(encoding="utf-8")
          text = re.sub(
              r"\nfrom \.document_deliberation import \(.*?\n\)\n",
              "\n",
              text,
              flags=re.S,
          )
          block = '''
          from .document_deliberation import (
              AudioPosteriorBackend,
              DocumentBenchmarkReport,
              DocumentDeliberatedResult,
              DocumentDeliberationConfig,
              DocumentEvaluationCase,
              DocumentFailureReceipt,
              DocumentPassThroughResult,
              DocumentPromotionGate,
              DualPosteriorExtractor,
              FrozenAudioPosteriorExtractor,
              FrozenPosteriorModelConfig,
              JointDocumentSemanticASRTranscriber,
              JointPhoneticArtifact,
              JointPhoneticHeadConfig,
              JointPhoneMoraCTCHead,
              LoadedMonoAudio,
              OverlapPolicy,
              OverlapReceipt,
              PhoneticLabelInventory,
              PhoneticSpanProviderConfig,
              PhoneticTrainingManifest,
              PhoneticValidationMetrics,
              PosteriorBundle,
              PosteriorLogits,
              PosteriorResourcePolicy,
              PromotionDecision,
              SelectivePhoneticSpanProposalProvider,
              SpanAudioReceipt,
              StaticSpanLexiconProvider,
              TransformersCTCBackend,
              apply_document_promotion_gate,
              apply_joint_document_deliberation,
              canonical_audio_sha256,
              evaluate_document_deliberation,
              paired_bootstrap_cer_delta,
              posterior_configs_from_artifact,
              posterior_sequence_from_logits,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )
          '''
          anchor = "from .fusion import FusionConfig, fuse_candidates\n"
          if anchor not in text:
              raise SystemExit("root import anchor missing")
          text = text.replace(anchor, textwrap.dedent(block).lstrip() + anchor, 1)
          names = (
              "AudioPosteriorBackend",
              "DocumentBenchmarkReport",
              "DocumentDeliberatedResult",
              "DocumentDeliberationConfig",
              "DocumentEvaluationCase",
              "DocumentFailureReceipt",
              "DocumentPassThroughResult",
              "DocumentPromotionGate",
              "DualPosteriorExtractor",
              "FrozenAudioPosteriorExtractor",
              "FrozenPosteriorModelConfig",
              "JointDocumentSemanticASRTranscriber",
              "JointPhoneticArtifact",
              "JointPhoneticHeadConfig",
              "JointPhoneMoraCTCHead",
              "LoadedMonoAudio",
              "OverlapPolicy",
              "OverlapReceipt",
              "PhoneticLabelInventory",
              "PhoneticSpanProviderConfig",
              "PhoneticTrainingManifest",
              "PhoneticValidationMetrics",
              "PosteriorBundle",
              "PosteriorLogits",
              "PosteriorResourcePolicy",
              "PromotionDecision",
              "SelectivePhoneticSpanProposalProvider",
              "SpanAudioReceipt",
              "StaticSpanLexiconProvider",
              "TransformersCTCBackend",
              "apply_document_promotion_gate",
              "apply_joint_document_deliberation",
              "canonical_audio_sha256",
              "evaluate_document_deliberation",
              "paired_bootstrap_cer_delta",
              "posterior_configs_from_artifact",
              "posterior_sequence_from_logits",
              "resolve_window_overlap",
              "with_joint_document_deliberation",
          )
          version = '\n__version__ = "0.2.0"\n'
          if version not in text:
              raise SystemExit("root version marker missing")
          if "canonical_audio_sha256" not in text.split("__version__")[0].split("__all__.extend")[-1]:
              extension = (
                  "\n__all__.extend(\n"
                  "    name for name in "
                  + repr(names)
                  + " if name not in __all__\n)\n"
              )
              text = text.replace(version, extension + version, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Apply idempotent canonical hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/semantic_asr/document_joint_engine.py")
          text = path.read_text(encoding="utf-8")
          old = "            build = build_semantic_deliberation_lattice(**kwargs, proposals=proposals)"
          if old in text:
              text = text.replace(
                  old,
                  "            proposal_kwargs = dict(kwargs)\n"
                  "            proposal_kwargs[\"proposals\"] = proposals\n"
                  "            build = build_semantic_deliberation_lattice(**proposal_kwargs)",
                  1,
              )
          old = "        trim = right_map[normalized_match - 1]\n        if trim == len(right_text)"
          if old in text:
              text = text.replace(
                  old,
                  "        trim = right_map[normalized_match - 1]\n"
                  "        if normalized_match == len(normalized_right):\n"
                  "            trim = len(right_text)\n"
                  "        if trim == len(right_text)",
                  1,
              )
          if "def _preserved_normalization(" not in text:
              marker = '''def _normalization(observed: DocumentObservedTranscript):
              normalized = deterministic_normalize(observed.text)
              if normalized:
                  return NormalizedTranscript.attach(
                      observed,
                      text=normalized,
                      mode="deterministic",
                  )
              return DocumentNormalizedTranscript(
                  text="",
                  observed_evidence_sha256=observed.evidence_sha256,
              )
              '''
              addition = marker + '''

              def _preserved_normalization(
                  first_pass_segment: LongformSegment,
                  observed: DocumentObservedTranscript,
              ) -> DocumentNormalizedTranscript:
                  return DocumentNormalizedTranscript(
                      text=first_pass_segment.normalized.text,
                      observed_evidence_sha256=observed.evidence_sha256,
                      mode=getattr(first_pass_segment.normalized, "mode", "first-pass-linked"),
                      normalizer_version=getattr(
                          first_pass_segment.normalized,
                          "normalizer_version",
                          "first-pass-linked-v1",
                      ),
                  )
              '''
              if marker not in text:
                  raise SystemExit("normalization helper marker missing")
              text = text.replace(marker, addition, 1)
          old = "                normalized=_normalization(observed),"
          if old in text:
              text = text.replace(
                  old,
                  "                normalized=(\n"
                  "                    _normalization(observed)\n"
                  "                    if decision.applied\n"
                  "                    else _preserved_normalization(first_segment, observed)\n"
                  "                ),",
                  1,
              )
          source_marker = '''        if self.failure.first_pass_evidence_sha256 != self.first_pass_evidence_sha256:
              raise ValueError("failure receipt is linked to different first-pass evidence")
          '''
          if "failure receipt is linked to different source audio" not in text:
              if source_marker not in text:
                  raise SystemExit("failure source marker missing")
              text = text.replace(
                  source_marker,
                  source_marker
                  + '''        if self.failure.source_audio_sha256 != self.source_audio_sha256:
              raise ValueError("failure receipt is linked to different source audio")
          ''',
                  1,
              )
          if "def _verify_first_pass_evidence(" not in text:
              anchor = '''def _text_sha256(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()
              '''
              helper = anchor + '''

              def _verify_first_pass_evidence(first_pass: LongformResult) -> None:
                  expected = sha256_json(
                      {
                          "sourceAudioSha256": first_pass.source_audio_sha256,
                          "durationMs": first_pass.duration_ms,
                          "observedText": first_pass.observed_text,
                          "normalizedText": first_pass.normalized_text,
                          "segmentEvidence": [
                              segment.observed.evidence_sha256 for segment in first_pass.segments
                          ],
                      }
                  )
                  if expected != first_pass.evidence_sha256:
                      raise ValueError("first-pass long-form evidence hash mismatch")
              '''
              if anchor not in text:
                  raise SystemExit("text hash helper marker missing")
              text = text.replace(anchor, helper, 1)
          pass_marker = '''        if self.first_pass.evidence_sha256 != self.first_pass_evidence_sha256:
              raise ValueError("pass-through result is linked to different first-pass evidence")
          '''
          if "_verify_first_pass_evidence(self.first_pass)" not in text.split("class DocumentPassThroughResult", 1)[1].split("class DocumentArcReceipt", 1)[0]:
              if pass_marker not in text:
                  raise SystemExit("pass-through verification marker missing")
              text = text.replace(
                  pass_marker,
                  pass_marker + "        _verify_first_pass_evidence(self.first_pass)\n",
                  1,
              )
          result_marker = '''        if self.first_pass.evidence_sha256 != self.first_pass_evidence_sha256:
              raise ValueError("document result is linked to different first-pass evidence")
          '''
          result_section = text.split("class DocumentDeliberatedResult", 1)[1]
          if "_verify_first_pass_evidence(self.first_pass)" not in result_section:
              if result_marker not in text:
                  raise SystemExit("document result verification marker missing")
              text = text.replace(
                  result_marker,
                  result_marker + "        _verify_first_pass_evidence(self.first_pass)\n",
                  1,
              )
          path.write_text(text, encoding="utf-8")

          path = Path("src/semantic_asr/phonetic_span_provider.py")
          text = path.read_text(encoding="utf-8")
          if "maximum_surface_length_delta" not in text:
              text = text.replace(
                  "    proposals_per_span: int = 4\n    minimum_combined_utility: float = -0.20",
                  "    proposals_per_span: int = 4\n"
                  "    maximum_surface_length_delta: int = 2\n"
                  "    minimum_combined_utility: float = -0.20",
                  1,
              )
              text = text.replace(
                  '            "proposals_per_span",\n        ):',
                  '            "proposals_per_span",\n'
                  '            "maximum_surface_length_delta",\n'
                  '        ):',
                  1,
              )
          if "existing_lengths = [len(arc.text) for arc in span.arcs]" not in text:
              marker = '''                existing = {
                  arc.text: set(arc.independent_audio_channels) for arc in span.arcs
              }
              verified = []
              for proposal in proposals:
              '''
              replacement = '''                existing = {
                  arc.text: set(arc.independent_audio_channels) for arc in span.arcs
              }
              existing_lengths = [len(arc.text) for arc in span.arcs]
              minimum_length = max(
                  0, min(existing_lengths) - self.config.maximum_surface_length_delta
              )
              maximum_length = max(existing_lengths) + self.config.maximum_surface_length_delta
              verified = []
              for proposal in proposals:
                  if not minimum_length <= len(proposal.text) <= maximum_length:
                      continue
              '''
              if marker not in text:
                  raise SystemExit("provider proposal marker missing")
              text = text.replace(marker, replacement, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Normalize selective provider tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/test_phonetic_span_provider.py")
          text = path.read_text(encoding="utf-8")
          # The canonical provider test uses span-local replacement labels and no invalid segment.
          text = text.replace('text="まだ",\n                phone_symbols=("m", "a", "d", "a"),\n                mora_symbols=("マ", "ダ"),', 'text="だ",\n                phone_symbols=("d", "a"),\n                mora_symbols=("ダ",),')
          text = text.replace('text="また",\n                phone_symbols=("m", "a", "t", "a"),\n                mora_symbols=("マ", "タ"),', 'text="た",\n                phone_symbols=("t", "a"),\n                mora_symbols=("タ",),')
          text = text.replace('assert texts[0] == "まだ"', 'assert texts[0] == "だ"')
          text = text.replace('segment=segment,', 'segment=None,')
          path.write_text(text, encoding="utf-8")
          PY
      - name: Extend permanent optional CPU validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          old = "python -m pytest -q tests/test_training_optional.py tests/test_acoustic_verifier_optional.py"
          new = (
              "python -m pytest -q tests/test_training_optional.py "
              "tests/test_acoustic_verifier_optional.py "
              "tests/test_phonetic_heads_optional.py"
          )
          if new not in text:
              if old not in text:
                  raise SystemExit("optional CPU pytest command missing")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Dependency-free full validation
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e '.[dev]'
          python -m ruff format src tests scripts examples
          python -m ruff check --fix src tests scripts examples
          python -m ruff format src tests scripts examples
          python -m ruff format --check src tests scripts examples
          python -m ruff check src tests scripts examples
          python -m compileall -q src tests scripts examples
          python -m pytest -q --junitxml=document-joint-tests.xml
          python -m build --wheel
          python examples/document_joint_deliberation.py --help
          python scripts/benchmark_document_deliberation.py --help
          git diff --check
      - name: Optional CPU PyTorch validation
        run: |
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pytest -q tests/test_phonetic_heads_optional.py
      - name: Clean-wheel validation
        run: |
          python -m venv .document-wheel-venv
          .document-wheel-venv/bin/python -m pip install dist/*.whl
          .document-wheel-venv/bin/python - <<'PY'
          import semantic_asr
          required = (
              "apply_joint_document_deliberation",
              "SelectivePhoneticSpanProposalProvider",
              "evaluate_document_deliberation",
          )
          assert all(hasattr(semantic_asr, name) for name in required)
          PY
          .document-wheel-venv/bin/semantic-asr demo --output runs/document-wheel-demo.json
      - name: Write validation ledger
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import subprocess
          import xml.etree.ElementTree as ET
          from pathlib import Path

          root = ET.parse("document-joint-tests.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite"))
          counts = {
              key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
              for key in ("tests", "failures", "errors", "skipped")
          }
          wheel = next(Path("dist").glob("*.whl"))
          payload = {
              "schemaVersion": "2",
              "head": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "treeBeforeLedger": subprocess.check_output(
                  ["git", "rev-parse", "HEAD^{tree}"], text=True
              ).strip(),
              "python": "3.12",
              "dependencyFreePytest": counts,
              "optionalCpuPyTorch": "passed",
              "ruffFormat": "passed",
              "ruffLint": "passed",
              "compileall": "passed",
              "wheelBuild": "passed",
              "cleanWheelImport": "passed",
              "wheelSha256": hashlib.sha256(wheel.read_bytes()).hexdigest(),
              "claimBoundary": (
                  "software and reproducibility validation only; no Japanese CER promotion claim"
              ),
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":"))
          payload["digest"] = hashlib.sha256(canonical.encode("utf-8")).hexdigest()
          Path("docs/DOCUMENT_JOINT_VALIDATION.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Remove all temporary workflows and commit the validated tree
        shell: bash
        run: |
          rm -f .github/workflows/finalize-document-joint.yml
          rm -f .github/workflows/finalize-document-joint-v3.yml
          rm -f .github/workflows/validate-document-joint-v03.yml
          rm -f .github/workflows/reconcile-document-joint-v03.yml
          rm -f document-joint-tests.xml
          rm -rf .document-wheel-venv
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts examples docs .github/workflows
          git commit -m 'Validate joint document lattice and phonetic evidence stack'
          git push origin HEAD:codex/document-lattice-joint-decoding-v03
