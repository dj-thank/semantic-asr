name: Mark integration PR ready once

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-integrated
    paths:
      - .github/workflows/mark-integration-pr-ready-once.yml

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: semantic-asr-mark-integration-pr-ready
  cancel-in-progress: false

jobs:
  mark-ready:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify and mark PR 7 ready
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_HEAD: codex/semantic-asr-v0.2-integrated
        shell: bash
        run: |
          set -euo pipefail
          actual_head="$(gh api repos/${GITHUB_REPOSITORY}/pulls/7 --jq .head.ref)"
          actual_state="$(gh api repos/${GITHUB_REPOSITORY}/pulls/7 --jq .state)"
          actual_draft="$(gh api repos/${GITHUB_REPOSITORY}/pulls/7 --jq .draft)"
          test "$actual_head" = "$EXPECTED_HEAD"
          test "$actual_state" = "open"
          if [ "$actual_draft" = "true" ]; then
            gh pr ready 7 --repo "$GITHUB_REPOSITORY"
          fi
