name: Semantic ASR CI

on:
  push:
    branches:
      - main
      - codex/semantic-asr-foundation-v0.1.0
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-asr-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e '.[dev]'
      - name: Compile and lint
        run: |
          python -m compileall -q src tests scripts
          ruff format --check src tests scripts
          ruff check --ignore E402,E501,SIM117 src tests scripts
      - name: Model-free tests
        run: pytest -q -k 'not training_optional'
      - name: Rights and CLI smoke tests
        run: |
          python scripts/validate_rights_registry.py data/rights_registry.example.json
          semantic-asr --help
          semantic-asr demo --output runs/ci-demo.json
          semantic-asr fuse examples/candidates.json --output runs/ci-fused.json
          semantic-asr rights --help

  torch-heads:
    name: Auxiliary heads / CPU PyTorch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU PyTorch and project
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Multitask head tests
        run: pytest -q tests/test_training_optional.py

  package:
    name: Wheel / clean installation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel build
          python -m build --wheel
      - name: Install wheel into a clean environment
        run: |
          python -m venv /tmp/semantic-asr-clean
          /tmp/semantic-asr-clean/bin/python -m pip install --upgrade pip
          /tmp/semantic-asr-clean/bin/python -m pip install dist/*.whl
          /tmp/semantic-asr-clean/bin/semantic-asr --help
          /tmp/semantic-asr-clean/bin/semantic-asr demo --output /tmp/semantic-asr-demo.json
          /tmp/semantic-asr-clean/bin/semantic-asr fuse examples/candidates.json --output /tmp/semantic-asr-fused.json

  hygiene:
    name: Rights, repository and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate rights registry
        run: python scripts/validate_rights_registry.py data/rights_registry.example.json
      - name: Reject raw audio, model weights and likely secrets
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.wav' -o -name '*.mp3' -o -name '*.m4a' -o -name '*.flac' -o -name '*.pt' -o -name '*.pth' -o -name '*.safetensors' \) | grep -q .; then
            echo 'Raw audio or model weights must not be committed.' >&2
            exit 1
          fi
          if grep -RIE --exclude-dir=.git --exclude-dir=dist --exclude='*.md' '(sk-[A-Za-z0-9_-]{20,}|gh[pousr]_[A-Za-z0-9]{20,})' .; then
            echo 'Possible secret detected.' >&2
            exit 1
          fi
          git diff --check
