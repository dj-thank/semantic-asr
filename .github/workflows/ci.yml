name: Semantic ASR CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

env:
  PYTHONUTF8: "1"

concurrency:
  group: semantic-asr-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Core (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record the checked source revision
        run: git show -s --format='HEAD=%H%nTREE=%T' HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install base validation environment
        run: python -m pip install -e '.[dev]'
      - name: Require the dependency-free test path
        run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - name: Check formatting without modifying source
        run: python -m ruff format --check src tests scripts
      - name: Check lint without modifying source
        run: python -m ruff check src tests scripts
      - name: Compile
        run: python -m compileall -q src tests scripts
      - name: Run base tests
        run: python -m pytest -q
      - name: Run the model-free demo
        run: semantic-asr demo --output runs/demo.json
      - name: Build a wheel
        run: python -m build --wheel
      - name: Verify tracked source stayed unchanged
        run: git diff --exit-code

  training-cpu:
    name: Optional training (CPU)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Record the checked source revision
        run: git show -s --format='HEAD=%H%nTREE=%T' HEAD
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only training test dependencies
        run: |
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
      - name: Require PyTorch and run real auxiliary-head tests
        run: |
          python -c "import torch; print(torch.__version__); assert torch.empty(0).device.type == 'cpu'"
          python -m pytest -q tests/test_training_optional.py
      - name: Verify tracked source stayed unchanged
        run: git diff --exit-code
