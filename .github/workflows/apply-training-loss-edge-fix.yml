name: Apply Semantic ASR training loss edge fix

on:
  push:
    branches:
      - codex/semantic-asr-foundation-v0.1.0
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-asr-training-loss-edge-fix
  cancel-in-progress: false

jobs:
  apply-test-and-commit:
    if: ${{ !contains(github.event.head_commit.message || '', '[training-loss-edge-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/semantic-asr-foundation-v0.1.0
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply deterministic training fix
        run: python scripts/apply_training_loss_edge_fix.py
      - name: Install and validate all contracts
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]'
          ruff format src tests scripts
          ruff check --ignore E402,E501,SIM117 src tests scripts
          python -m compileall -q src tests scripts
          git diff --check
          pytest -q
      - name: Commit only after every regression passes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m '[training-loss-edge-fix] Ignore fully padded auxiliary heads safely'
          git push origin HEAD:codex/semantic-asr-foundation-v0.1.0
