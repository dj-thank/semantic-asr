name: Semantic ASR frontier contracts

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontier-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install model-free development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" pyyaml

      - name: Parse all workflow YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          for path in sorted(Path('.github/workflows').glob('*.yml')):
              with path.open(encoding='utf-8') as handle:
                  payload = yaml.safe_load(handle)
              if not isinstance(payload, dict):
                  raise SystemExit(f'invalid workflow object: {path}')
          PY

      - name: Run frontier contract tests
        run: python -m pytest -q tests/test_v02_*.py

      - name: Build wheel
        run: python -m build --wheel

      - name: Install wheel in a clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/wheel-venv"
          source "$RUNNER_TEMP/wheel-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl
          semantic-asr --help >/dev/null
          semantic-asr train-ngram --help >/dev/null
          semantic-asr train-listwise-ranker --help >/dev/null
          semantic-asr train-fusion --help >/dev/null
          semantic-asr generate-candidates --help >/dev/null
          semantic-asr partition-manifest --help >/dev/null
          semantic-asr score-ranker-calibration --help >/dev/null
          semantic-asr apply-ranker --help >/dev/null
          semantic-asr calibrate-ranker --help >/dev/null
          semantic-asr benchmark --help >/dev/null
          semantic-asr deployment-gate --help >/dev/null
          semantic-asr throttle-policy --effort ultra-light >/dev/null
