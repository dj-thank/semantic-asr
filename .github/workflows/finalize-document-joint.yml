name: Finalize joint document lattice

on:
  push:
    branches:
      - codex/document-lattice-joint-decoding-v03
    paths:
      - .github/workflows/finalize-document-joint.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/document-lattice-joint-decoding-v03
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Apply document-level audit hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label}, found {count}")
              return text.replace(old, new)

          path = Path("src/semantic_asr/document_joint_deliberation.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "from .deliberation_lattice import DocumentContext, LatticeArc",
              "from .deliberation_lattice import DocumentContext, LatticeArc, path_digest",
              "path_digest import",
          )
          old = '''    @property
              def path_arcs(self) -> tuple[LatticeArc, ...]:
                  return tuple(arc for option in self.options for arc in option.path.arcs)

              @property
              def digest(self) -> str:'''
          new = '''    @property
              def path_arcs(self) -> tuple[LatticeArc, ...]:
                  return tuple(arc for option in self.options for arc in option.path.arcs)

              @property
              def scoring_arcs(self) -> tuple[LatticeArc, ...]:
                  """Evidence-bound arcs containing exactly the text emitted by this document."""

                  output = []
                  for option, emitted, receipt in zip(
                      self.options,
                      self.emitted_texts,
                      self.overlap_receipts,
                      strict=True,
                  ):
                      output.append(
                          LatticeArc(
                              arc_id=(
                                  f"document-emission:{option.segment_index:06d}:"
                                  f"{receipt.digest[:16]}"
                              ),
                              span_id=f"document-emission:{option.segment_index:06d}",
                              text=emitted,
                              origin="first-pass",
                              utilities=(),
                              observed_eligible=False,
                              source_candidate_ids=option.exact_source_candidate_ids,
                              source_audio_sha256=option.build.lattice.source_audio_sha256,
                              is_epsilon=not emitted,
                              metadata={
                                  "windowOptionDigest": option.digest,
                                  "overlapReceiptDigest": receipt.digest,
                                  "underlyingArcDigests": tuple(
                                      arc.digest for arc in option.path.arcs
                                  ),
                                  "fullWindowTextSha256": _text_sha256(option.text),
                                  "emittedTextSha256": _text_sha256(emitted),
                              },
                          )
                      )
                  return tuple(output)

              @property
              def digest(self) -> str:'''
          text = replace_once(text, textwrap.dedent(old), textwrap.dedent(new), "scoring arcs")
          old = '''    score_many = getattr(scorer, "score_many", None)
              if callable(score_many):
                  rows = tuple(
                      score_many(tuple(candidate.path_arcs for candidate in candidates), context=context)
                  )
              else:
                  rows = tuple(scorer.score(candidate.path_arcs, context=context) for candidate in candidates)
              if len(rows) != len(candidates):
                  raise ValueError("document scorer returned the wrong number of scores")
              by_digest: dict[str, GlobalPathScore] = {}
              for row in rows:
                  if row.context_digest != context.digest:
                      raise ValueError("document score is bound to different context")
                  if row.path_digest in by_digest:
                      raise ValueError("document scorer returned a duplicate path score")
                  by_digest[row.path_digest] = row
              expected = {sha256_json([arc.digest for arc in row.path_arcs]) for row in candidates}
              actual = set(by_digest)
              if expected != actual:
                  # GlobalPathScore uses path_digest(), not a bare digest list. Recompute explicitly to make
                  # stale/missing path scores fail closed without trusting output order.
                  from .deliberation_lattice import path_digest

                  expected = {path_digest(row.path_arcs) for row in candidates}
                  if expected != actual:
                      raise ValueError("document scorer returned unknown or missing path scores")
              sources = {row.source for row in rows}
              profiles = {row.profile_digest for row in rows}
              if len(sources) != 1 or len(profiles) != 1:
                  raise ValueError("one document decision cannot mix scorer identities")
              from .deliberation_lattice import path_digest

              output = []
              for candidate in candidates:
                  row = by_digest[path_digest(candidate.path_arcs)]'''
          new = '''    score_many = getattr(scorer, "score_many", None)
              if callable(score_many):
                  rows = tuple(
                      score_many(
                          tuple(candidate.scoring_arcs for candidate in candidates),
                          context=context,
                      )
                  )
              else:
                  rows = tuple(
                      scorer.score(candidate.scoring_arcs, context=context)
                      for candidate in candidates
                  )
              if len(rows) != len(candidates):
                  raise ValueError("document scorer returned the wrong number of scores")
              by_digest: dict[str, GlobalPathScore] = {}
              for row in rows:
                  if row.context_digest != context.digest:
                      raise ValueError("document score is bound to different context")
                  if row.path_digest in by_digest:
                      raise ValueError("document scorer returned a duplicate path score")
                  by_digest[row.path_digest] = row
              expected = {path_digest(row.scoring_arcs) for row in candidates}
              if set(by_digest) != expected:
                  raise ValueError("document scorer returned unknown or missing path scores")
              sources = {row.source for row in rows}
              profiles = {row.profile_digest for row in rows}
              if len(sources) != 1 or len(profiles) != 1:
                  raise ValueError("one document decision cannot mix scorer identities")

              output = []
              for candidate in candidates:
                  row = by_digest[path_digest(candidate.scoring_arcs)]'''
          text = replace_once(
              text,
              textwrap.dedent(old),
              textwrap.dedent(new),
              "emission scorer block",
          )
          old = '''    candidates.sort(
                  key=lambda row: (
                      -row.base_score,
                      row.digest,
                  )
              )
              selected = candidates[: config.local_paths_per_window]
              if retained_digest not in {row.digest for row in selected}:
                  selected[-1] = local.retained
                  selected.sort(key=lambda row: (-row.base_score, row.digest))'''
          new = '''    candidates.sort(
                  key=lambda row: (
                      -row.base_score,
                      row.digest,
                  )
              )
              distinct_surfaces = {candidate.text for candidate in segment.observed.candidates}
              if len(distinct_surfaces) < config.minimum_distinct_surfaces:
                  selected = [local.retained]
              else:
                  selected = candidates[: config.local_paths_per_window]
                  if retained_digest not in {row.digest for row in selected}:
                      selected[-1] = local.retained
                      selected.sort(key=lambda row: (-row.base_score, row.digest))'''
          text = replace_once(text, textwrap.dedent(old), textwrap.dedent(new), "minimum distinct use")

          marker = "\n\n@dataclass(frozen=True, slots=True)\nclass _BeamState:"
          failure_types = '''

              @dataclass(frozen=True, slots=True)
              class DocumentFailureReceipt:
                  error_type: str
                  error_message_sha256: str
                  first_pass_evidence_sha256: str
                  source_audio_sha256: str
                  config_digest: str
                  local_policy_digest: str
                  stage: str = "joint-document-deliberation"

                  def __post_init__(self) -> None:
                      if not self.error_type or not self.stage:
                          raise ValueError("document failure receipt requires error type and stage")
                      for digest in (
                          self.error_message_sha256,
                          self.first_pass_evidence_sha256,
                          self.source_audio_sha256,
                          self.config_digest,
                          self.local_policy_digest,
                      ):
                          if not _is_sha256(digest):
                              raise ValueError("document failure receipt contains an invalid digest")

                  @property
                  def digest(self) -> str:
                      return sha256_json(asdict(self))


              @dataclass(frozen=True, slots=True)
              class DocumentPassThroughResult:
                  source_name: str
                  source_audio_sha256: str
                  duration_ms: int
                  observed_text: str
                  normalized_text: str
                  segments: tuple[LongformSegment, ...]
                  evidence_sha256: str
                  diagnostics: dict[str, object]
                  first_pass_evidence_sha256: str
                  failure: DocumentFailureReceipt
                  first_pass: LongformResult = field(repr=False)

                  def __post_init__(self) -> None:
                      self.verify()
                      object.__setattr__(self, "diagnostics", dict(self.diagnostics))

                  @classmethod
                  def create(
                      cls,
                      first_pass: LongformResult,
                      *,
                      error: Exception,
                      config: DocumentDeliberationConfig,
                      local_policy: DeliberationPolicy,
                  ) -> DocumentPassThroughResult:
                      failure = DocumentFailureReceipt(
                          error_type=type(error).__name__,
                          error_message_sha256=hashlib.sha256(
                              str(error).encode("utf-8")
                          ).hexdigest(),
                          first_pass_evidence_sha256=first_pass.evidence_sha256,
                          source_audio_sha256=first_pass.source_audio_sha256,
                          config_digest=config.digest,
                          local_policy_digest=local_policy.digest,
                      )
                      evidence = sha256_json(
                          {
                              "firstPassEvidenceSha256": first_pass.evidence_sha256,
                              "failureDigest": failure.digest,
                              "segmentEvidence": [
                                  segment.observed.evidence_sha256
                                  for segment in first_pass.segments
                              ],
                          }
                      )
                      diagnostics = {
                          **dict(first_pass.diagnostics),
                          "documentJointDeliberation": {
                              "enabled": True,
                              "applied": False,
                              "failedClosed": True,
                              "failureDigest": failure.digest,
                              "errorType": failure.error_type,
                              "firstPassEvidenceSha256": first_pass.evidence_sha256,
                          },
                      }
                      return cls(
                          source_name=first_pass.source_name,
                          source_audio_sha256=first_pass.source_audio_sha256,
                          duration_ms=first_pass.duration_ms,
                          observed_text=first_pass.observed_text,
                          normalized_text=first_pass.normalized_text,
                          segments=first_pass.segments,
                          evidence_sha256=evidence,
                          diagnostics=diagnostics,
                          first_pass_evidence_sha256=first_pass.evidence_sha256,
                          failure=failure,
                          first_pass=first_pass,
                      )

                  def as_dict(self) -> dict[str, object]:
                      payload = dict(self.first_pass.as_dict())
                      payload.update(
                          {
                              "evidence_sha256": self.evidence_sha256,
                              "first_pass_evidence_sha256": self.first_pass_evidence_sha256,
                              "document_failure": asdict(self.failure),
                              "document_failure_digest": self.failure.digest,
                              "diagnostics": dict(self.diagnostics),
                          }
                      )
                      return payload

                  def verify(self) -> None:
                      if self.first_pass.evidence_sha256 != self.first_pass_evidence_sha256:
                          raise ValueError("pass-through result is linked to different first-pass evidence")
                      if self.failure.first_pass_evidence_sha256 != self.first_pass_evidence_sha256:
                          raise ValueError("failure receipt is linked to different first-pass evidence")
                      if self.observed_text != self.first_pass.observed_text:
                          raise ValueError("fail-closed result changed observed text")
                      expected = sha256_json(
                          {
                              "firstPassEvidenceSha256": self.first_pass_evidence_sha256,
                              "failureDigest": self.failure.digest,
                              "segmentEvidence": [
                                  segment.observed.evidence_sha256 for segment in self.segments
                              ],
                          }
                      )
                      if expected != self.evidence_sha256:
                          raise ValueError("pass-through evidence hash mismatch")
          '''
          if marker not in text:
              raise SystemExit("beam state marker not found")
          text = text.replace(marker, textwrap.dedent(failure_types) + marker, 1)
          text = replace_once(
              text,
              '''    except Exception:
                      if not config.fail_closed_to_first_pass:
                          raise
                      return first_pass''',
              '''    except Exception as exc:
                      if not config.fail_closed_to_first_pass:
                          raise
                      return DocumentPassThroughResult.create(
                          first_pass,
                          error=exc,
                          config=config,
                          local_policy=local_policy,
                      )''',
              "fail-closed result",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("src/semantic_asr/document_deliberation.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    DocumentPathCandidate,\n    DocumentProposalProvider,",
              "    DocumentPassThroughResult,\n    DocumentPathCandidate,\n    DocumentProposalProvider,\n    DocumentFailureReceipt,",
              "facade failure imports",
          )
          text = replace_once(
              text,
              '    "DocumentObservedTranscript",\n    "DocumentPathCandidate",',
              '    "DocumentObservedTranscript",\n    "DocumentPassThroughResult",\n    "DocumentPathCandidate",\n    "DocumentFailureReceipt",',
              "facade failure exports",
          )
          path.write_text(text, encoding="utf-8")

          path = Path("tests/test_document_joint_deliberation.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    DocumentDeliberatedResult,\n    DocumentDeliberationConfig,",
              "    DocumentDeliberatedResult,\n    DocumentDeliberationConfig,\n    DocumentPassThroughResult,",
              "failure test import",
          )
          addition = '''

              def test_fail_closed_returns_auditable_pass_through_result() -> None:
                  class BrokenScorer:
                      source = "broken"
                      profile_digest = "f" * 64

                      def score(self, path, *, context):
                          raise RuntimeError("broken document scorer")

                  raw = first_pass()
                  result = apply_joint_document_deliberation(
                      raw,
                      config=document_config(),
                      local_policy=local_policy(),
                      document_scorer=BrokenScorer(),
                  )

                  assert isinstance(result, DocumentPassThroughResult)
                  assert result.observed_text == raw.observed_text
                  assert result.failure.error_type == "RuntimeError"
                  assert result.evidence_sha256 != raw.evidence_sha256
                  assert result.diagnostics["documentJointDeliberation"]["failedClosed"]
                  result.verify()
          '''
          if "test_fail_closed_returns_auditable_pass_through_result" in text:
              raise SystemExit("failure test already exists")
          path.write_text(text.rstrip() + textwrap.dedent(addition) + "\n", encoding="utf-8")
          PY
      - name: Export document research API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/semantic_asr/__init__.py")
          text = path.read_text(encoding="utf-8")
          anchor = "from .fusion import FusionConfig, fuse_candidates\n"
          imports = '''from .document_deliberation import (
              AudioPosteriorBackend,
              DocumentBenchmarkReport,
              DocumentDeliberatedResult,
              DocumentDeliberationConfig,
              DocumentEvaluationCase,
              DocumentFailureReceipt,
              DocumentPassThroughResult,
              DocumentPromotionGate,
              DualPosteriorExtractor,
              FrozenAudioPosteriorExtractor,
              FrozenPosteriorModelConfig,
              JointDocumentSemanticASRTranscriber,
              OverlapPolicy,
              OverlapReceipt,
              PosteriorBundle,
              PosteriorLogits,
              PosteriorResourcePolicy,
              PromotionDecision,
              TransformersCTCBackend,
              apply_document_promotion_gate,
              apply_joint_document_deliberation,
              canonical_audio_sha256,
              evaluate_document_deliberation,
              paired_bootstrap_cer_delta,
              posterior_sequence_from_logits,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )
          '''
          if "from .document_deliberation import" not in text:
              if anchor not in text:
                  raise SystemExit("__init__ import anchor missing")
              text = text.replace(anchor, imports + anchor, 1)
          extension = '''

          __all__.extend(
              [
                  "AudioPosteriorBackend",
                  "DocumentBenchmarkReport",
                  "DocumentDeliberatedResult",
                  "DocumentDeliberationConfig",
                  "DocumentEvaluationCase",
                  "DocumentFailureReceipt",
                  "DocumentPassThroughResult",
                  "DocumentPromotionGate",
                  "DualPosteriorExtractor",
                  "FrozenAudioPosteriorExtractor",
                  "FrozenPosteriorModelConfig",
                  "JointDocumentSemanticASRTranscriber",
                  "OverlapPolicy",
                  "OverlapReceipt",
                  "PosteriorBundle",
                  "PosteriorLogits",
                  "PosteriorResourcePolicy",
                  "PromotionDecision",
                  "TransformersCTCBackend",
                  "apply_document_promotion_gate",
                  "apply_joint_document_deliberation",
                  "canonical_audio_sha256",
                  "evaluate_document_deliberation",
                  "paired_bootstrap_cer_delta",
                  "posterior_sequence_from_logits",
                  "resolve_window_overlap",
                  "with_joint_document_deliberation",
              ]
          )
          '''
          marker = '\n__version__ = "0.2.0"\n'
          if '"DocumentDeliberationConfig"' not in text.split(marker)[-2].split("__all__.extend")[-1]:
              if marker not in text:
                  raise SystemExit("__init__ version marker missing")
              text = text.replace(marker, extension + marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Format, lint, compile, and test
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff format src tests scripts examples
          python -m ruff check --fix src tests scripts examples
          python -m ruff format src tests scripts examples
          python -m compileall -q src tests scripts examples
          python -m pytest -q
          git diff --check
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/finalize-document-joint.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts examples .github/workflows/finalize-document-joint.yml
          git commit -m 'Finalize joint document lattice integration'
          git push origin HEAD:codex/document-lattice-joint-decoding-v03
