name: Apply verified integration core fixes once

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-integration
    paths:
      - .github/integration/core-fixes.patch
      - .github/workflows/apply-integration-core-fixes.yml

permissions:
  contents: write

concurrency:
  group: semantic-asr-v02-integration-core-fixes
  cancel-in-progress: false

jobs:
  apply-validate-and-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the integration branch
        uses: actions/checkout@v4
        with:
          ref: codex/semantic-asr-v0.2-integration
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply the reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .github/integration/core-fixes.patch
          git apply .github/integration/core-fixes.patch
      - name: Install the model-free development environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Format and validate the complete Python surface
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff format src tests scripts
          python -m ruff check --fix src tests scripts
          python -m ruff check src tests scripts
          python -m pytest -q
          python -m compileall -q src tests scripts
          semantic-asr research-smoke --output runs/integration-research-smoke.json
      - name: Remove one-time integration machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/integration/core-fixes.patch
          rm -f .github/workflows/apply-integration-core-fixes.yml
          git diff --check
      - name: Commit only the validated result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "semantic-asr-integration"
          git config user.email "204638875+dj-thank@users.noreply.github.com"
          git add -A
          test -n "$(git status --porcelain)"
          git commit -m "fix: preserve ASR evidence and restore v0.2 validation"
          git push origin HEAD:codex/semantic-asr-v0.2-integration
