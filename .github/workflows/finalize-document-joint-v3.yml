name: Finalize canonical document joint engine

on:
  push:
    branches:
      - codex/document-lattice-joint-decoding-v03
    paths:
      - .github/workflows/finalize-document-joint-v3.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/document-lattice-joint-decoding-v03
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Canonicalize modules and public API
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import textwrap

          compatibility = '''
          """Compatibility import for the canonical joint document-lattice engine."""

          from .document_joint_engine import (
              DocumentArcReceipt,
              DocumentDeliberatedResult,
              DocumentDeliberatedSegment,
              DocumentDeliberationConfig,
              DocumentDeliberationDecision,
              DocumentFailureReceipt,
              DocumentNormalizedTranscript,
              DocumentObservedTranscript,
              DocumentPassThroughResult,
              DocumentPathCandidate,
              DocumentProposalProvider,
              JointDocumentSemanticASRTranscriber,
              OverlapPolicy,
              OverlapReceipt,
              WindowPathOption,
              apply_joint_document_deliberation,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )

          __all__ = [
              "DocumentArcReceipt",
              "DocumentDeliberatedResult",
              "DocumentDeliberatedSegment",
              "DocumentDeliberationConfig",
              "DocumentDeliberationDecision",
              "DocumentFailureReceipt",
              "DocumentNormalizedTranscript",
              "DocumentObservedTranscript",
              "DocumentPassThroughResult",
              "DocumentPathCandidate",
              "DocumentProposalProvider",
              "JointDocumentSemanticASRTranscriber",
              "OverlapPolicy",
              "OverlapReceipt",
              "WindowPathOption",
              "apply_joint_document_deliberation",
              "resolve_window_overlap",
              "with_joint_document_deliberation",
          ]
          '''
          Path("src/semantic_asr/document_joint_deliberation.py").write_text(
              textwrap.dedent(compatibility).lstrip(), encoding="utf-8"
          )

          facade = '''
          """Public research facade for joint document decoding, phonetic evidence, and evaluation."""

          from .audio_posterior_adapters import (
              AudioPosteriorBackend,
              DualPosteriorExtractor,
              FrozenAudioPosteriorExtractor,
              FrozenPosteriorModelConfig,
              PosteriorBundle,
              PosteriorLogits,
              PosteriorResourcePolicy,
              TransformersCTCBackend,
              canonical_audio_sha256,
              posterior_sequence_from_logits,
              read_mono_wav,
          )
          from .document_deliberation_benchmark import (
              BootstrapInterval,
              DocumentBenchmarkReport,
              DocumentEvaluationCase,
              DocumentPromotionGate,
              PromotionDecision,
              apply_document_promotion_gate,
              character_error_rate,
              evaluate_document_deliberation,
              paired_bootstrap_cer_delta,
          )
          from .document_joint_engine import (
              DocumentArcReceipt,
              DocumentDeliberatedResult,
              DocumentDeliberatedSegment,
              DocumentDeliberationConfig,
              DocumentDeliberationDecision,
              DocumentFailureReceipt,
              DocumentNormalizedTranscript,
              DocumentObservedTranscript,
              DocumentPassThroughResult,
              DocumentPathCandidate,
              DocumentProposalProvider,
              JointDocumentSemanticASRTranscriber,
              OverlapPolicy,
              OverlapReceipt,
              WindowPathOption,
              apply_joint_document_deliberation,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )
          from .phonetic_heads_optional import JointPhoneMoraCTCHead
          from .phonetic_span_provider import (
              LoadedMonoAudio,
              MonoAudioLoader,
              PhoneticSpanProviderConfig,
              SelectivePhoneticSpanProposalProvider,
              SoundFileMonoAudioLoader,
              SpanAudioReceipt,
              SpanLexiconProvider,
              SpanProposalFailure,
              StaticSpanLexiconProvider,
          )
          from .phonetic_training import (
              JointPhoneticArtifact,
              JointPhoneticHeadConfig,
              PhoneticLabelInventory,
              PhoneticTrainingManifest,
              PhoneticValidationMetrics,
              posterior_configs_from_artifact,
          )

          __all__ = [name for name in globals() if not name.startswith("_")]
          '''
          Path("src/semantic_asr/document_deliberation.py").write_text(
              textwrap.dedent(facade).lstrip(), encoding="utf-8"
          )

          path = Path("src/semantic_asr/__init__.py")
          text = path.read_text(encoding="utf-8")
          # Remove an earlier direct document_deliberation block if a preliminary workflow added it.
          text = re.sub(
              r"\nfrom \.document_deliberation import \(.*?\n\)\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          import_block = '''
          from .document_deliberation import (
              AudioPosteriorBackend,
              DocumentBenchmarkReport,
              DocumentDeliberatedResult,
              DocumentDeliberationConfig,
              DocumentEvaluationCase,
              DocumentFailureReceipt,
              DocumentPassThroughResult,
              DocumentPromotionGate,
              DualPosteriorExtractor,
              FrozenAudioPosteriorExtractor,
              FrozenPosteriorModelConfig,
              JointDocumentSemanticASRTranscriber,
              JointPhoneticArtifact,
              JointPhoneticHeadConfig,
              JointPhoneMoraCTCHead,
              LoadedMonoAudio,
              OverlapPolicy,
              OverlapReceipt,
              PhoneticLabelInventory,
              PhoneticSpanProviderConfig,
              PhoneticTrainingManifest,
              PhoneticValidationMetrics,
              PosteriorBundle,
              PosteriorLogits,
              PosteriorResourcePolicy,
              PromotionDecision,
              SelectivePhoneticSpanProposalProvider,
              SpanAudioReceipt,
              StaticSpanLexiconProvider,
              TransformersCTCBackend,
              apply_document_promotion_gate,
              apply_joint_document_deliberation,
              canonical_audio_sha256,
              evaluate_document_deliberation,
              paired_bootstrap_cer_delta,
              posterior_configs_from_artifact,
              posterior_sequence_from_logits,
              resolve_window_overlap,
              with_joint_document_deliberation,
          )
          '''
          anchor = "from .fusion import FusionConfig, fuse_candidates\n"
          if anchor not in text:
              raise SystemExit("root API import anchor missing")
          text = text.replace(anchor, textwrap.dedent(import_block).lstrip() + anchor, 1)
          names = [
              "AudioPosteriorBackend",
              "DocumentBenchmarkReport",
              "DocumentDeliberatedResult",
              "DocumentDeliberationConfig",
              "DocumentEvaluationCase",
              "DocumentFailureReceipt",
              "DocumentPassThroughResult",
              "DocumentPromotionGate",
              "DualPosteriorExtractor",
              "FrozenAudioPosteriorExtractor",
              "FrozenPosteriorModelConfig",
              "JointDocumentSemanticASRTranscriber",
              "JointPhoneticArtifact",
              "JointPhoneticHeadConfig",
              "JointPhoneMoraCTCHead",
              "LoadedMonoAudio",
              "OverlapPolicy",
              "OverlapReceipt",
              "PhoneticLabelInventory",
              "PhoneticSpanProviderConfig",
              "PhoneticTrainingManifest",
              "PhoneticValidationMetrics",
              "PosteriorBundle",
              "PosteriorLogits",
              "PosteriorResourcePolicy",
              "PromotionDecision",
              "SelectivePhoneticSpanProposalProvider",
              "SpanAudioReceipt",
              "StaticSpanLexiconProvider",
              "TransformersCTCBackend",
              "apply_document_promotion_gate",
              "apply_joint_document_deliberation",
              "canonical_audio_sha256",
              "evaluate_document_deliberation",
              "paired_bootstrap_cer_delta",
              "posterior_configs_from_artifact",
              "posterior_sequence_from_logits",
              "resolve_window_overlap",
              "with_joint_document_deliberation",
          ]
          extension = "\n__all__.extend(\n    name for name in " + repr(tuple(names)) + " if name not in __all__\n)\n"
          version_marker = '\n__version__ = "0.2.0"\n'
          # Remove a preliminary extension containing document symbols, then add the canonical one.
          text = re.sub(
              r"\n__all__\.extend\(\n.*?\n\)\n(?=\n__version__)",
              "\n",
              text,
              flags=re.S,
          )
          if version_marker not in text:
              raise SystemExit("root API version marker missing")
          text = text.replace(version_marker, extension + version_marker, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Harden canonical engine and selective provider
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one {label}, found {count}")
              return text.replace(old, new)

          path = Path("src/semantic_asr/document_joint_engine.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "            build = build_semantic_deliberation_lattice(**kwargs, proposals=proposals)",
              "            proposal_kwargs = dict(kwargs)\n            proposal_kwargs[\"proposals\"] = proposals\n            build = build_semantic_deliberation_lattice(**proposal_kwargs)",
              "proposal kwargs construction",
          )
          text = replace_once(
              text,
              "        trim = right_map[normalized_match - 1]\n        if trim == len(right_text)",
              "        trim = right_map[normalized_match - 1]\n        if normalized_match == len(normalized_right):\n            trim = len(right_text)\n        if trim == len(right_text)",
              "normalized full duplicate trim",
          )
          old = '''def _normalization(observed: DocumentObservedTranscript):
              normalized = deterministic_normalize(observed.text)
              if normalized:
                  return NormalizedTranscript.attach(
                      observed,
                      text=normalized,
                      mode="deterministic",
                  )
              return DocumentNormalizedTranscript(
                  text="",
                  observed_evidence_sha256=observed.evidence_sha256,
              )
          '''
          new = '''def _normalization(observed: DocumentObservedTranscript):
              normalized = deterministic_normalize(observed.text)
              if normalized:
                  return NormalizedTranscript.attach(
                      observed,
                      text=normalized,
                      mode="deterministic",
                  )
              return DocumentNormalizedTranscript(
                  text="",
                  observed_evidence_sha256=observed.evidence_sha256,
              )


          def _preserved_normalization(
              first_pass_segment: LongformSegment,
              observed: DocumentObservedTranscript,
          ) -> DocumentNormalizedTranscript:
              return DocumentNormalizedTranscript(
                  text=first_pass_segment.normalized.text,
                  observed_evidence_sha256=observed.evidence_sha256,
                  mode=getattr(first_pass_segment.normalized, "mode", "first-pass-linked"),
                  normalizer_version=getattr(
                      first_pass_segment.normalized,
                      "normalizer_version",
                      "first-pass-linked-v1",
                  ),
              )
          '''
          text = replace_once(text, old, new, "normalization helpers")
          text = replace_once(
              text,
              "                normalized=_normalization(observed),",
              "                normalized=(\n                    _normalization(observed)\n                    if decision.applied\n                    else _preserved_normalization(first_segment, observed)\n                ),",
              "preserved normalization",
          )
          text = replace_once(
              text,
              "        if self.failure.first_pass_evidence_sha256 != self.first_pass_evidence_sha256:\n            raise ValueError(\"failure receipt is linked to different first-pass evidence\")",
              "        if self.failure.first_pass_evidence_sha256 != self.first_pass_evidence_sha256:\n            raise ValueError(\"failure receipt is linked to different first-pass evidence\")\n        if self.failure.source_audio_sha256 != self.source_audio_sha256:\n            raise ValueError(\"failure receipt is linked to different source audio\")",
              "failure source binding",
          )
          # Recompute the base long-form evidence hash in both output types.
          marker = '''        if self.first_pass.evidence_sha256 != self.first_pass_evidence_sha256:
              raise ValueError("document result is linked to different first-pass evidence")
          '''
          addition = marker + '''        expected_first_pass = sha256_json(
              {
                  "sourceAudioSha256": self.first_pass.source_audio_sha256,
                  "durationMs": self.first_pass.duration_ms,
                  "observedText": self.first_pass.observed_text,
                  "normalizedText": self.first_pass.normalized_text,
                  "segmentEvidence": [
                      segment.observed.evidence_sha256 for segment in self.first_pass.segments
                  ],
              }
          )
          if expected_first_pass != self.first_pass_evidence_sha256:
              raise ValueError("first-pass long-form evidence hash mismatch")
          '''
          text = replace_once(text, marker, addition, "document first-pass verification")
          path.write_text(text, encoding="utf-8")

          path = Path("src/semantic_asr/phonetic_span_provider.py")
          text = path.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "    proposals_per_span: int = 4\n    minimum_combined_utility: float = -0.20",
              "    proposals_per_span: int = 4\n    maximum_surface_length_delta: int = 2\n    minimum_combined_utility: float = -0.20",
              "surface length config",
          )
          text = replace_once(
              text,
              '            "proposals_per_span",\n        ):',
              '            "proposals_per_span",\n            "maximum_surface_length_delta",\n        ):',
              "surface length integer validation",
          )
          text = replace_once(
              text,
              "                existing = {\n                    arc.text: set(arc.independent_audio_channels) for arc in span.arcs\n                }\n                verified = []\n                for proposal in proposals:",
              "                existing = {\n                    arc.text: set(arc.independent_audio_channels) for arc in span.arcs\n                }\n                existing_lengths = [len(arc.text) for arc in span.arcs]\n                minimum_length = max(\n                    0, min(existing_lengths) - self.config.maximum_surface_length_delta\n                )\n                maximum_length = (\n                    max(existing_lengths) + self.config.maximum_surface_length_delta\n                )\n                verified = []\n                for proposal in proposals:\n                    if not minimum_length <= len(proposal.text) <= maximum_length:\n                        continue",
              "proposal surface envelope",
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Replace phonetic provider test with span-local labels
        shell: bash
        run: |
          cat > tests/test_phonetic_span_provider.py <<'PY'
          from __future__ import annotations

          from semantic_asr.audio_posterior_adapters import (
              DualPosteriorExtractor,
              FrozenAudioPosteriorExtractor,
              FrozenPosteriorModelConfig,
              PosteriorLogits,
          )
          from semantic_asr.contracts import CandidateEvidence
          from semantic_asr.deliberation_evidence import UtilityCalibrationProfile
          from semantic_asr.deliberation_lattice import DocumentContext
          from semantic_asr.phonetic_bridge import (
              FrozenPronunciationLexicon,
              PronunciationLexiconEntry,
          )
          from semantic_asr.phonetic_span_provider import (
              LoadedMonoAudio,
              PhoneticSpanProviderConfig,
              SelectivePhoneticSpanProposalProvider,
              StaticSpanLexiconProvider,
          )
          from semantic_asr.score_semantics import ScoreKind
          from semantic_asr.semantic_deliberation import build_semantic_deliberation_lattice

          AUDIO = "a" * 64
          REVISION = "1" * 40


          def candidate(candidate_id: str, text: str, score: float) -> CandidateEvidence:
              return CandidateEvidence(
                  candidate_id=candidate_id,
                  text=text,
                  acoustic=score,
                  mora=score - 0.02,
                  lexical=score - 0.04,
                  preservation=score - 0.01,
                  cross_model=score - 0.03,
                  source="test-asr",
              )


          def model_config(kind: str) -> FrozenPosteriorModelConfig:
              vocabulary = (
                  ("<blk>", "d", "t", "a")
                  if kind == "phone"
                  else ("<blk>", "ダ", "タ")
              )
              return FrozenPosteriorModelConfig(
                  kind=kind,
                  model_id=f"test-{kind}",
                  model_revision=REVISION,
                  vocabulary=vocabulary,
                  blank_symbol="<blk>",
                  sample_rate=1_000,
                  frame_stride_ms=20.0,
              )


          class FakeBackend:
              def __init__(self, config):
                  self.config = config

              def infer_logits(self, samples, *, sample_rate, source_audio_sha256):
                  del samples, sample_rate
                  winners = (
                      ("<blk>", "d", "a", "<blk>")
                      if self.config.kind == "phone"
                      else ("<blk>", "ダ", "<blk>")
                  )
                  rows = [
                      tuple(
                          5.0 if symbol == winner else -3.0
                          for symbol in self.config.vocabulary
                      )
                      for winner in winners
                  ]
                  return PosteriorLogits(
                      values=tuple(rows),
                      source_audio_sha256=source_audio_sha256,
                      model_config_digest=self.config.digest,
                  )


          class FakeLoader:
              def __init__(self, source_sha=AUDIO):
                  self.source_sha = source_sha
                  self.calls = 0

              def load(self, path):
                  del path
                  self.calls += 1
                  return LoadedMonoAudio(
                      samples=tuple(0.0 for _ in range(2_000)),
                      sample_rate=1_000,
                      source_audio_sha256=self.source_sha,
                      source_name="meeting.wav",
                  )


          def lexicon():
              return FrozenPronunciationLexicon(
                  name="test-local-ja",
                  revision="lex-r1",
                  entries=(
                      PronunciationLexiconEntry(
                          entry_id="da",
                          text="だ",
                          phone_symbols=("d", "a"),
                          mora_symbols=("ダ",),
                      ),
                      PronunciationLexiconEntry(
                          entry_id="ta",
                          text="た",
                          phone_symbols=("t", "a"),
                          mora_symbols=("タ",),
                      ),
                  ),
              )


          def build():
              rows = (
                  candidate("mata", "計画はまた保留です", 0.7),
                  candidate("mada", "計画はまだ保留です", 0.68),
              )
              return build_semantic_deliberation_lattice(
                  rows,
                  posterior={"mata": 0.55, "mada": 0.45},
                  pivot_candidate_id="mata",
                  document_id="doc-window-0",
                  source_audio_sha256=AUDIO,
                  segment_start_ms=0,
                  segment_end_ms=1_000,
              )


          def calibration(config, channel):
              return UtilityCalibrationProfile(
                  channel=channel,
                  score_source=(
                      f"ctc-{channel}:{config.model_id}@{config.model_revision}:"
                      f"{config.digest}"
                  ),
                  score_kind=ScoreKind.LOG_LIKELIHOOD,
                  center=-1.0,
                  scale=1.0,
                  fitted_manifest_sha256="b" * 64,
                  revision="cal-r1",
              )


          def provider(loader=None):
              phone_config = model_config("phone")
              mora_config = model_config("mora")
              extractor = DualPosteriorExtractor(
                  phone=FrozenAudioPosteriorExtractor(FakeBackend(phone_config)),
                  mora=FrozenAudioPosteriorExtractor(FakeBackend(mora_config)),
              )
              return SelectivePhoneticSpanProposalProvider(
                  extractor=extractor,
                  lexicon_provider=StaticSpanLexiconProvider(lexicon()),
                  phone_calibration=calibration(phone_config, "phone"),
                  mora_calibration=calibration(mora_config, "mora"),
                  audio_loader=loader or FakeLoader(),
                  config=PhoneticSpanProviderConfig(
                      padding_ms=20,
                      minimum_combined_utility=-1.0,
                      proposals_per_span=2,
                  ),
              )


          def test_provider_extracts_only_contradiction_spans_and_binds_receipts() -> None:
              build_result = build()
              loader = FakeLoader()
              subject = provider(loader)

              proposals = subject(
                  audio_path="meeting.wav",
                  segment_index=0,
                  segment=None,
                  build=build_result,
                  context=DocumentContext(),
                  source_audio_sha256=AUDIO,
              )

              assert loader.calls == 1
              assert proposals
              target_span = next(iter(proposals))
              texts = [row.text for row in proposals[target_span]]
              assert texts[0] == "だ"
              receipt = subject.receipts[target_span]
              assert receipt.source_audio_sha256 == AUDIO
              assert receipt.canonical_clip_sha256 != AUDIO
              assert all(row.source_audio_sha256 == AUDIO for row in proposals[target_span])
              assert all(
                  "spanAudioReceiptDigest" in row.metadata
                  for row in proposals[target_span]
              )


          def test_audio_is_loaded_once_across_repeated_window_calls() -> None:
              loader = FakeLoader()
              subject = provider(loader)
              for _ in range(2):
                  subject(
                      audio_path="meeting.wav",
                      segment_index=0,
                      segment=None,
                      build=build(),
                      context=DocumentContext(),
                      source_audio_sha256=AUDIO,
                  )

              assert loader.calls == 1


          def test_wrong_source_audio_fails_before_posterior_fusion() -> None:
              subject = provider(FakeLoader(source_sha="c" * 64))

              try:
                  subject(
                      audio_path="meeting.wav",
                      segment_index=0,
                      segment=None,
                      build=build(),
                      context=DocumentContext(),
                      source_audio_sha256=AUDIO,
                  )
              except ValueError as exc:
                  assert "does not match" in str(exc)
              else:
                  raise AssertionError("wrong source audio was accepted")
          PY
      - name: Extend optional training CI
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/ci.yml")
          text = path.read_text(encoding="utf-8")
          old = "python -m pytest -q tests/test_training_optional.py tests/test_acoustic_verifier_optional.py"
          new = (
              "python -m pytest -q tests/test_training_optional.py "
              "tests/test_acoustic_verifier_optional.py "
              "tests/test_phonetic_heads_optional.py"
          )
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit("optional training test command not found")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Install, format, lint, compile, test, and build
        run: |
          python -m pip install -e '.[dev]'
          python -m ruff format src tests scripts examples
          python -m ruff check --fix src tests scripts examples
          python -m ruff format src tests scripts examples
          python -m compileall -q src tests scripts examples
          python -m pytest -q
          python -m build --wheel
          python examples/document_joint_deliberation.py --help
          python scripts/benchmark_document_deliberation.py --help
          git diff --check
      - name: Remove temporary workflows and commit
        shell: bash
        run: |
          rm -f .github/workflows/finalize-document-joint.yml
          rm -f .github/workflows/finalize-document-joint-v3.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src tests scripts examples docs .github/workflows
          git commit -m 'Finalize joint document lattice and phonetic evidence stack'
          git push origin HEAD:codex/document-lattice-joint-decoding-v03
