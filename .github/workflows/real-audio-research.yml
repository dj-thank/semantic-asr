name: Real audio research (self-hosted, opt-in)

on:
  workflow_dispatch:
    inputs:
      audio_manifest:
        description: "Absolute or workspace-relative rights-gated audio manifest JSONL"
        required: true
        type: string
      experiment_name:
        description: "Artifact directory name"
        required: true
        default: "japanese-asr-experiment"
        type: string
      model:
        description: "faster-whisper model name or local path"
        required: true
        default: "large-v3-turbo"
        type: string
      model_revision:
        description: "Immutable model revision or local artifact SHA"
        required: true
        type: string
      compute_type:
        description: "CTranslate2 compute type"
        required: true
        default: "float16"
        type: choice
        options:
          - float16
          - int8_float16
          - int8
          - float32
      beam_size:
        description: "Whisper beam size"
        required: true
        default: "12"
        type: string
      hypotheses:
        description: "Maximum unique N-best hypotheses"
        required: true
        default: "12"
        type: string
      ranker_objective:
        description: "Small learned reranker objective"
        required: true
        default: "listwise-mwer"
        type: choice
        options:
          - listwise-mwer
          - pairwise
      bootstrap_iterations:
        description: "Group bootstrap iterations"
        required: true
        default: "2000"
        type: string
      upload_text_artifacts:
        description: "Upload transcript/reference-bearing artifacts to GitHub"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  real-audio-experiment:
    # This workflow never provisions a hosted or paid GPU. Register a runner with
    # all four labels only after reviewing the local data and model licences.
    runs-on: [self-hosted, linux, x64, semantic-asr-research]
    timeout-minutes: 720
    steps:
      - name: Check out exact source revision
        uses: actions/checkout@v7

      - name: Resolve and validate local paths
        id: paths
        shell: bash
        env:
          AUDIO_MANIFEST_INPUT: ${{ inputs.audio_manifest }}
          EXPERIMENT_NAME_INPUT: ${{ inputs.experiment_name }}
        run: |
          set -euo pipefail
          if [[ "$AUDIO_MANIFEST_INPUT" = /* ]]; then
            manifest="$AUDIO_MANIFEST_INPUT"
          else
            manifest="$GITHUB_WORKSPACE/$AUDIO_MANIFEST_INPUT"
          fi
          if [[ ! -f "$manifest" ]]; then
            echo "Audio manifest does not exist: $manifest" >&2
            exit 2
          fi
          if [[ "$EXPERIMENT_NAME_INPUT" =~ [^A-Za-z0-9._-] ]]; then
            echo "experiment_name may contain only A-Z, a-z, 0-9, dot, underscore, and hyphen" >&2
            exit 2
          fi
          output="$RUNNER_TEMP/semantic-asr/$EXPERIMENT_NAME_INPUT"
          mkdir -p "$output"
          echo "manifest=$manifest" >> "$GITHUB_OUTPUT"
          echo "output=$output" >> "$GITHUB_OUTPUT"

      - name: Create isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python3.12 -m venv "$RUNNER_TEMP/semantic-asr-venv"
          source "$RUNNER_TEMP/semantic-asr-venv/bin/activate"
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,asr]"

      - name: Record immutable environment manifest
        shell: bash
        env:
          OUTPUT: ${{ steps.paths.outputs.output }}
          MODEL_NAME: ${{ inputs.model }}
          MODEL_REVISION: ${{ inputs.model_revision }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/semantic-asr-venv/bin/activate"
          python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from pathlib import Path

          output = Path(os.environ["OUTPUT"])
          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          packages = subprocess.check_output(
              ["python", "-m", "pip", "freeze", "--all"], text=True
          ).splitlines()
          payload = {
              "schemaVersion": "real-audio-environment-v1",
              "sourceSha": source_sha,
              "model": os.environ["MODEL_NAME"],
              "modelRevision": os.environ["MODEL_REVISION"],
              "python": platform.python_version(),
              "platform": platform.platform(),
              "machine": platform.machine(),
              "packages": sorted(packages),
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          payload["sha256"] = hashlib.sha256(canonical).hexdigest()
          (output / "environment.json").write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + "\n", encoding="utf-8"
          )
          PY

      - name: Generate path-preserving N-best evidence
        shell: bash
        env:
          MANIFEST: ${{ steps.paths.outputs.manifest }}
          OUTPUT: ${{ steps.paths.outputs.output }}
          MODEL: ${{ inputs.model }}
          MODEL_REVISION: ${{ inputs.model_revision }}
          COMPUTE_TYPE: ${{ inputs.compute_type }}
          BEAM_SIZE: ${{ inputs.beam_size }}
          HYPOTHESES: ${{ inputs.hypotheses }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/semantic-asr-venv/bin/activate"
          semantic-asr generate-candidates "$MANIFEST" \
            --output "$OUTPUT/all-candidates.jsonl" \
            --ranker-output "$OUTPUT/all-ranker.jsonl" \
            --model "$MODEL" \
            --model-revision "$MODEL_REVISION" \
            --runtime-revision "$(python -c 'import ctranslate2; print(ctranslate2.__version__)')" \
            --device auto \
            --compute-type "$COMPUTE_TYPE" \
            --beam-size "$BEAM_SIZE" \
            --hypotheses "$HYPOTHESES"

      - name: Enforce speaker/source/near-duplicate partition isolation
        shell: bash
        env:
          OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/semantic-asr-venv/bin/activate"
          semantic-asr partition-manifest "$OUTPUT/all-candidates.jsonl" \
            --output-dir "$OUTPUT/splits"
          test -s "$OUTPUT/splits/train.jsonl"
          test -s "$OUTPUT/splits/calibration.jsonl"
          test -s "$OUTPUT/splits/test.jsonl"

      - name: Train small candidate reranker on train split only
        shell: bash
        env:
          OUTPUT: ${{ steps.paths.outputs.output }}
          OBJECTIVE: ${{ inputs.ranker_objective }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/semantic-asr-venv/bin/activate"
          if [[ "$OBJECTIVE" == "listwise-mwer" ]]; then
            semantic-asr train-listwise-ranker "$OUTPUT/splits/train.jsonl" \
              --output "$OUTPUT/ranker.json"
          else
            semantic-asr train-ranker "$OUTPUT/splits/train.jsonl" \
              --output "$OUTPUT/ranker.json"
          fi

      - name: Score calibration split and fit monotonic calibration
        shell: bash
        env:
          OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/semantic-asr-venv/bin/activate"
          semantic-asr score-ranker-calibration "$OUTPUT/splits/calibration.jsonl" \
            --ranker-profile "$OUTPUT/ranker.json" \
            --output "$OUTPUT/calibration-scores.jsonl"
          semantic-asr calibrate-ranker "$OUTPUT/calibration-scores.jsonl" \
            --source-ranker "$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("${{ steps.paths.outputs.output }}/ranker.json").read_text())
          print(payload["profile"]["name"])
          PY
          )" \
            --output "$OUTPUT/calibration.json"

      - name: Apply calibrated evidence to locked test split
        shell: bash
        env:
          OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/semantic-asr-venv/bin/activate"
          semantic-asr apply-ranker "$OUTPUT/splits/test.jsonl" \
            --ranker-profile "$OUTPUT/ranker.json" \
            --calibration "$OUTPUT/calibration.json" \
            --output "$OUTPUT/test-reranked.jsonl"

      - name: Evaluate raw baseline, Semantic MBR, calibrated cascade, and oracle at K
        shell: bash
        env:
          OUTPUT: ${{ steps.paths.outputs.output }}
          BOOTSTRAP_ITERATIONS: ${{ inputs.bootstrap_iterations }}
        run: |
          set -euo pipefail
          source "$RUNNER_TEMP/semantic-asr-venv/bin/activate"
          semantic-asr benchmark "$OUTPUT/test-reranked.jsonl" \
            --output "$OUTPUT/report.json" \
            --ks "1,3,5,8,12,16,25,50" \
            --bootstrap-iterations "$BOOTSTRAP_ITERATIONS"

      - name: Write non-sensitive run summary
        shell: bash
        env:
          OUTPUT: ${{ steps.paths.outputs.output }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path
          report = json.loads((Path(os.environ["OUTPUT"]) / "report.json").read_text())
          print("## Semantic ASR real-audio experiment")
          print(f"- Samples: {report['sample_count']}")
          print(f"- Groups: {report['group_count']}")
          print(f"- Raw ASR CER: {report['baseline_cer']:.6f}")
          print(f"- Calibrated cascade CER: {report['cascade_cer']:.6f}")
          print(f"- Semantic MBR CER: {report['mbr_cer']:.6f}")
          interval = report['cascade_improvement']
          print(
              "- Baseline minus cascade CER: "
              f"{interval['estimate']:.6f} "
              f"[{interval['lower']:.6f}, {interval['upper']:.6f}]"
          )
          print("- No raw audio was uploaded by this workflow.")
          PY

      - name: Upload transcript-bearing research artifacts only when explicitly requested
        if: ${{ inputs.upload_text_artifacts }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.experiment_name }}-${{ github.run_id }}
          path: ${{ steps.paths.outputs.output }}
          if-no-files-found: error
          retention-days: 7
