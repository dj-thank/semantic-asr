name: Real audio research (self-hosted, opt-in)

on:
  workflow_dispatch:
    inputs:
      audio_manifest:
        description: "Absolute external manifest; local PCM16 16kHz mono WAVs and allow/license evidence"
        required: true
        type: string
      model:
        description: "Preprovisioned Hugging Face model ID (local model directories: use the CLI)"
        default: "large-v3-turbo"
        required: true
        type: string
      model_revision:
        description: "Exact 40-character Hub commit, passed to the actual loader"
        default: "0a363e9161cbc7ed1431c9597a8ceaf0c4f78fcf"
        required: true
        type: string
      runtime:
        description: "Use existing hardware only; no GPU provisioning"
        default: "cpu-int8"
        required: true
        type: choice
        options: [cpu-int8, cuda-float16]
      evaluation_role:
        description: "This legacy loop is not a fresh-test promotion gate"
        default: "regression-exposed"
        required: true
        type: choice
        options: [development, regression-exposed]
      max_records:
        description: "Maximum number of manifest rows"
        default: "100"
        required: true
        type: string
      max_audio_seconds:
        description: "Maximum total audio seconds, verified from WAVs"
        default: "600"
        required: true
        type: string
      max_wall_seconds:
        description: "Total cooperative stage wall-clock budget; job also has a 90 minute hard limit"
        default: "3600"
        required: true
        type: string
      max_storage_bytes:
        description: "Run-directory storage monitoring limit; runner disk quota is separate"
        default: "2147483648"
        required: true
        type: string
      allow_local_research:
        description: "Explicitly authorize local processing; NOT publication of audio/text/weights"
        default: false
        required: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: semantic-asr-local-research
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require explicit permission and reviewed main before touching the private runner
        env:
          ALLOW: ${{ inputs.allow_local_research }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          test "$ALLOW" = "true" || { echo "Local research permission was not granted"; exit 2; }
          test "$SOURCE_REF" = "refs/heads/main" || { echo "Only reviewed main may use the research runner"; exit 2; }

  real-audio-experiment:
    needs: authorize
    runs-on: [self-hosted, linux, x64, semantic-asr-research]
    timeout-minutes: 90
    env:
      PYTHONUTF8: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      TOKENIZERS_PARALLELISM: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
    steps:
      - name: Check out the dispatch revision without persistent credentials
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Prepare software only; models and data must already exist
        run: |
          set -euo pipefail
          venv="$RUNNER_TEMP/semantic-asr-env-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          python3.12 -m venv "$venv"
          "$venv/bin/python" -m pip install -e '.[asr]'
          "$venv/bin/python" -m pip check
          echo "ASR_PYTHON=$venv/bin/python" >> "$GITHUB_ENV"
          echo "ASR_OUTPUT=$RUNNER_TEMP/semantic-asr-research/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_ENV"
      - name: Run one bounded, local-only generation and evaluation cycle
        env:
          MANIFEST: ${{ inputs.audio_manifest }}
          MODEL: ${{ inputs.model }}
          MODEL_REVISION: ${{ inputs.model_revision }}
          RUNTIME: ${{ inputs.runtime }}
          EVALUATION_ROLE: ${{ inputs.evaluation_role }}
          MAX_RECORDS: ${{ inputs.max_records }}
          MAX_AUDIO: ${{ inputs.max_audio_seconds }}
          MAX_WALL: ${{ inputs.max_wall_seconds }}
          MAX_STORAGE: ${{ inputs.max_storage_bytes }}
        run: |
          set -euo pipefail
          case "$RUNTIME" in
            cpu-int8) device=cpu; compute=int8 ;;
            cuda-float16) device=cuda; compute=float16 ;;
            *) echo "Unsupported runtime"; exit 2 ;;
          esac
          "$ASR_PYTHON" scripts/codex_pipeline.py research \
            --manifest "$MANIFEST" --model "$MODEL" --model-revision "$MODEL_REVISION" \
            --device "$device" --compute-type "$compute" \
            --evaluation-role "$EVALUATION_ROLE" --allow-local-research \
            --max-records "$MAX_RECORDS" --max-audio-seconds "$MAX_AUDIO" \
            --max-wall-seconds "$MAX_WALL" --max-storage-bytes "$MAX_STORAGE" \
            --output-dir "$ASR_OUTPUT"
      - name: Report status without uploading references, paths, models, or raw logs
        if: always()
        run: |
          python3.12 - <<'PY'
          import json
          import os
          from pathlib import Path
          output = os.environ.get("ASR_OUTPUT")
          receipt = Path(output) / "receipt.json" if output else None
          if receipt is None or not receipt.is_file():
              print("No research receipt: provisioning or authorization did not complete.")
          else:
              data = json.loads(receipt.read_text(encoding="utf-8"))
              print(json.dumps({"status": data["status"], "promotion": "not-evaluated"}))
          PY
