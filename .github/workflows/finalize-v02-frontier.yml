name: Finalize Semantic ASR v0.2 frontier

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-final-audit
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: semantic-asr-v02-final-audit
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/semantic-asr-v0.2-final-audit
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: Reconstruct and verify reviewed finalizer
        shell: bash
        run: |
          set -euo pipefail
          cat .github/finalizer_payload/0* | tr -d '\r\n' | base64 --decode > /tmp/finalizer.py.xz
          echo 'd21a1caa66997c249922334f262222951928d59e04ad9b62eb2330ac85861667  /tmp/finalizer.py.xz' | sha256sum --check --strict
          mkdir -p .github/scripts
          xz --decompress --stdout /tmp/finalizer.py.xz > .github/scripts/finalize_v02_frontier.py
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/scripts/finalize_v02_frontier.py')
          text = path.read_text(encoding='utf-8')
          old = 'from .mbr import extract_critical_units'
          new = 'from .mbr import critical_units'
          if text.count(old) != 2:
              raise SystemExit('unexpected finalizer compatibility-anchor count')
          text = text.replace(old, new)

          # candidate_pool gained score-domain validation on the concurrent
          # implementation branch. Preserve that stronger implementation and
          # apply the representative-path change with a local, narrow patch.
          start = text.index('def _patch_candidate_pool() -> None:')
          end = text.index('\n\ndef _patch_advanced_adapters()', start)
          text = (
              text[:start]
              + 'def _patch_candidate_pool() -> None:\n    pass\n'
              + text[end:]
          )
          path.write_text(text, encoding='utf-8', newline='\n')
          PY
          python -m py_compile .github/scripts/finalize_v02_frontier.py

      - name: Apply representative-path score semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/semantic_asr/candidate_pool.py')
          text = path.read_text(encoding='utf-8')
          old_metadata = '''        metadata["aggregateCumulativeLogprob"] = aggregate_cumulative
                  metadata["pathProbabilityMassAggregated"] = True
          '''
          if text.count(old_metadata) != 1:
              raise SystemExit('candidate-pool aggregate metadata anchor mismatch')
          text = text.replace(old_metadata, '', 1)

          old_return = '''        return replace(
                      representative,
                      acoustic=aggregate_average,
                      avg_logprob=aggregate_average,
                      metadata=metadata,
                  )
          '''
          new_return = '''        metadata.update(
                      {
                          "aggregateCumulativeLogprob": aggregate_cumulative,
                          "aggregateAverageLogprob": aggregate_average,
                          "pathProbabilityMassAggregated": True,
                          "representativeSequenceScore": representative.sequence_score,
                          "representativeAvgLogprob": representative.avg_logprob,
                          "representativeAcoustic": representative.acoustic,
                      }
                  )
                  # Aggregate mass belongs to the surface equivalence class, not
                  # to a synthetic decoder path. Preserve the strongest real path.
                  return replace(representative, metadata=metadata)
          '''
          if text.count(old_return) != 1:
              raise SystemExit('candidate-pool return anchor mismatch')
          path.write_text(
              text.replace(old_return, new_return, 1),
              encoding='utf-8',
              newline='\n',
          )
          PY

      - name: Apply final audit atomically
        run: python .github/scripts/finalize_v02_frontier.py

      - name: Remove transport payload
        run: rm -rf .github/finalizer_payload

      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'

      - name: Normalize concurrent implementation lint anchors
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          ngram = Path('src/semantic_asr/ngram.py')
          text = ngram.read_text(encoding='utf-8')
          old = '            source = candidate.reading if self.mode == "mora" and candidate.reading else candidate.text\n'
          new = (
              '            source = (\n'
              '                candidate.reading\n'
              '                if self.mode == "mora" and candidate.reading\n'
              '                else candidate.text\n'
              '            )\n'
          )
          if text.count(old) != 1:
              raise SystemExit('ngram lint anchor mismatch')
          ngram.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')

          pipeline = Path('src/semantic_asr/pipeline.py')
          text = pipeline.read_text(encoding='utf-8')
          old = '        for left, right in zip(self.stages, self.stages[1:]):\n'
          new = '        for left, right in zip(self.stages, self.stages[1:], strict=False):\n'
          if text.count(old) != 1:
              raise SystemExit('pipeline lint anchor mismatch')
          pipeline.write_text(text.replace(old, new, 1), encoding='utf-8', newline='\n')
          PY

      - name: Format and lint
        run: |
          ruff check --fix .
          ruff format .
          ruff check .
          ruff format --check .

      - name: Compile and test
        run: |
          python -m compileall -q src tests scripts
          python -m pytest -q

      - name: Exercise installed research paths
        run: |
          semantic-asr research-smoke
          semantic-asr-risk-control --help >/dev/null

      - name: Commit validated source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'semantic-asr-final-audit-bot'
          git config user.email '204638875+dj-thank@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(v0.2): finalize risk-controlled edge frontier'
          git push origin HEAD:codex/semantic-asr-v0.2-final-audit
