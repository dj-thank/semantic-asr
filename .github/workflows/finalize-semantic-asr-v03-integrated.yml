name: Finalize integrated Semantic ASR v0.3 research stack

on:
  push:
    branches:
      - codex/semantic-asr-v03-integrated-research
    paths:
      - .github/workflows/finalize-semantic-asr-v03-integrated.yml

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  checks: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: codex/semantic-asr-v03-integrated-research
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reconcile the complete document, ranker, phonetic, and export stack
        run: |
          python scripts/_reconcile_v03_document.py
          python scripts/_reconcile_v03_phonetic.py
          python scripts/_reconcile_v03_export.py
          python scripts/_reconcile_v03_public.py
          python - <<'PY'
          from pathlib import Path

          # Keep canonical_json available when an older ranker snapshot still uses it.
          path = Path('src/semantic_asr/document_ranker.py')
          text = path.read_text(encoding='utf-8')
          if 'canonical_json(' in text and 'canonical_json, sha256_json' not in text:
              text = text.replace(
                  'from .contracts import sha256_json',
                  'from .contracts import canonical_json, sha256_json',
                  1,
              )
          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove inherited lower-stack automation before validation
        shell: bash
        run: |
          rm -f \
            .github/workflows/finalize-document-joint.yml \
            .github/workflows/finalize-document-joint-v3.yml \
            .github/workflows/validate-document-joint-v03.yml \
            .github/workflows/reconcile-document-joint-v03.yml \
            .github/workflows/repair-document-joint-v4.yml \
            .github/workflows/stabilize-document-lattice-release-v03.yml \
            .github/workflows/promote-document-lattice-v03.yml \
            .github/workflows/finalize-document-ranker-v03.yml \
            .github/workflows/finalize-joint-phonetic-training-v03.yml \
            .github/workflows/finalize-phonetic-feature-export-v03.yml \
            .github/workflows/format-pr17.yml

      - name: Install dependency-free validation environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e '.[dev]'

      - name: Format, lint, and compile the integrated source tree
        run: |
          python -m ruff format src tests scripts examples
          python -m ruff check --fix src tests scripts examples
          python -m ruff format src tests scripts examples
          python -m ruff format --check src tests scripts examples
          python -m ruff check src tests scripts examples
          python -m compileall -q src tests scripts examples
          git diff --check

      - name: Run complete dependency-free tests and executable discovery
        run: |
          python -m pytest -q --junitxml=/tmp/v03-dependency-free.xml
          semantic-asr demo --output runs/v03-integrated-demo.json
          semantic-asr research-smoke --output runs/v03-integrated-research-smoke.json
          semantic-asr cascade --help
          semantic-asr train-ranker --help
          semantic-asr transcribe-v2 --help
          python scripts/benchmark_document_deliberation.py --help
          python scripts/train_document_ranker.py --help
          python scripts/train_joint_phonetic_head.py --help
          python scripts/export_phonetic_features.py --help
          python examples/multilevel_deliberation.py
          python examples/document_joint_deliberation.py

      - name: Install optional CPU numeric, training, and audio dependencies
        run: |
          python -m pip install 'torch>=2.4' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install \
            'numpy>=1.26' \
            'safetensors>=0.4' \
            'soundfile>=0.12'

      - name: Run the full suite with optional CPU paths enabled
        run: |
          python -m pytest -q --junitxml=/tmp/v03-optional-cpu.xml
          python - <<'PY'
          import torch
          assert torch.empty(0).device.type == 'cpu'
          print(torch.__version__)
          PY

      - name: Build wheel and inspect declared extras
        run: |
          rm -rf dist build
          python -m build --wheel
          python - <<'PY'
          import email
          import zipfile
          from pathlib import Path

          wheel = next(Path('dist').glob('*.whl'))
          with zipfile.ZipFile(wheel) as archive:
              metadata_name = next(name for name in archive.namelist() if name.endswith('.dist-info/METADATA'))
              metadata = email.message_from_bytes(archive.read(metadata_name))
          extras = set(metadata.get_all('Provides-Extra', []))
          assert 'train' in extras
          assert 'phonetic-export' in extras
          PY

      - name: Validate clean wheel and public integrated API
        run: |
          python -m venv /tmp/v03-wheel
          /tmp/v03-wheel/bin/python -m pip install dist/*.whl
          /tmp/v03-wheel/bin/python - <<'PY'
          import semantic_asr

          required = (
              'DocumentDeliberatedResult',
              'DocumentRankerArtifact',
              'DocumentRankerGlobalScorer',
              'JointPhoneticPosteriorExtractor',
              'JapanesePronunciationPolicy',
              'PhoneticFeatureExporter',
              'apply_joint_document_deliberation',
              'train_document_ranker',
              'train_joint_phonetic_head',
          )
          for name in required:
              assert hasattr(semantic_asr, name), name
              assert name in semantic_asr.__all__, name
          PY
          /tmp/v03-wheel/bin/semantic-asr demo --output runs/v03-wheel-demo.json
          /tmp/v03-wheel/bin/semantic-asr research-smoke --output runs/v03-wheel-smoke.json
          /tmp/v03-wheel/bin/python -m pip check

      - name: Capture test counts
        shell: bash
        run: |
          python - <<'PY'
          import json
          import xml.etree.ElementTree as ET
          from pathlib import Path

          def counts(path: str):
              root = ET.parse(path).getroot()
              suites = [root] if root.tag == 'testsuite' else list(root.findall('testsuite'))
              return {
                  key: sum(int(suite.attrib.get(key, 0)) for suite in suites)
                  for key in ('tests', 'failures', 'errors', 'skipped')
              }

          Path('/tmp/v03-counts.json').write_text(
              json.dumps(
                  {
                      'dependencyFree': counts('/tmp/v03-dependency-free.xml'),
                      'optionalCpu': counts('/tmp/v03-optional-cpu.xml'),
                  },
                  sort_keys=True,
              ),
              encoding='utf-8',
          )
          PY

      - name: Remove one-shot sources and write integrated validation ledger
        shell: bash
        run: |
          rm -f \
            scripts/_reconcile_v03_document.py \
            scripts/_reconcile_v03_phonetic.py \
            scripts/_reconcile_v03_export.py \
            scripts/_reconcile_v03_public.py \
            .github/workflows/finalize-semantic-asr-v03-integrated.yml
          git add -A
          source_tree=$(git write-tree)
          git reset
          SOURCE_TREE="$source_tree" python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          counts = json.loads(Path('/tmp/v03-counts.json').read_text(encoding='utf-8'))
          wheel = next(Path('dist').glob('*.whl'))
          payload = {
              'schemaVersion': '1',
              'inputHead': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], text=True
              ).strip(),
              'validatedSourceTree': os.environ['SOURCE_TREE'],
              'dependencyFreePytest': counts['dependencyFree'],
              'optionalCpuPytest': counts['optionalCpu'],
              'ruffFormat': 'passed',
              'ruffLint': 'passed',
              'compileall': 'passed',
              'modelFreeDemo': 'passed',
              'researchSmoke': 'passed',
              'documentRankerCli': 'passed',
              'jointPhoneticTrainingCli': 'passed',
              'phoneticFeatureExportCli': 'passed',
              'jointDocumentExample': 'passed',
              'jointPhoneMoraCpuTraining': 'passed',
              'frozenFeatureRuntime': 'passed',
              'resumableFeatureExport': 'passed',
              'soundfileMonoBoundary': 'passed',
              'wheelBuild': 'passed',
              'cleanWheelImport': 'passed',
              'wheelSha256': hashlib.sha256(wheel.read_bytes()).hexdigest(),
              'supersedesPullRequests': [18, 19, 20, 21],
              'basePullRequest': 17,
              'claimBoundary': (
                  'integrated software validation only; no Japanese CER, PER/MER, '
                  'risk-coverage, latency, energy, or production-promotion claim'
              ),
          }
          canonical = json.dumps(payload, sort_keys=True, separators=(',', ':'))
          payload['digest'] = hashlib.sha256(canonical.encode('utf-8')).hexdigest()
          Path('docs/SEMANTIC_ASR_V03_INTEGRATED_VALIDATION.json').write_text(
              json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Commit and push the validated integrated source tree
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Validate integrated Semantic ASR v0.3 research stack'
          git push origin HEAD:codex/semantic-asr-v03-integrated-research

      - name: Wait for permanent CI and frontier checks on the validated commit
        shell: bash
        run: |
          head_sha=$(git rev-parse HEAD)
          ready=0
          for attempt in $(seq 1 80); do
            payload=$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/dj-thank/semantic-asr/commits/$head_sha/check-runs?per_page=100")
            total=$(printf '%s' "$payload" | jq '.total_count')
            pending=$(printf '%s' "$payload" | jq '[.check_runs[] | select(.status != "completed")] | length')
            failed=$(printf '%s' "$payload" | jq '[.check_runs[] | select(.status == "completed" and (.conclusion | IN("success", "neutral", "skipped") | not))] | length')
            names=$(printf '%s' "$payload" | jq -r '[.check_runs[].name] | join("\n")')
            required=1
            for marker in 'Core (ubuntu-latest, Python 3.11)' 'Core (ubuntu-latest, Python 3.12)' 'Core (windows-latest, Python 3.12)' 'Optional training and acoustic verifier (CPU)' 'Clean wheel installation'; do
              if ! printf '%s\n' "$names" | grep -Fq "$marker"; then
                required=0
              fi
            done
            if [ "$total" -ge 5 ] && [ "$pending" -eq 0 ] && [ "$failed" -eq 0 ] && [ "$required" -eq 1 ]; then
              ready=1
              break
            fi
            sleep 15
          done
          if [ "$ready" != "1" ]; then
            echo 'Permanent CI/check gate did not reach success; leaving integrated PR draft.' >&2
            exit 1
          fi

      - name: Mark integrated PR ready and supersede intermediate drafts
        shell: bash
        run: |
          pr_number=$(gh pr list \
            --repo dj-thank/semantic-asr \
            --head codex/semantic-asr-v03-integrated-research \
            --state open \
            --json number \
            --jq '.[0].number')
          head_sha=$(git rev-parse HEAD)
          counts=$(python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(
              Path('docs/SEMANTIC_ASR_V03_INTEGRATED_VALIDATION.json').read_text()
          )
          dependency = payload['dependencyFreePytest']
          optional = payload['optionalCpuPytest']
          print(
              f"dependency-free {dependency['tests']} tests/{dependency['skipped']} skipped; "
              f"optional CPU {optional['tests']} tests/{optional['skipped']} skipped"
          )
          PY
          )
          gh pr comment "$pr_number" --repo dj-thank/semantic-asr --body "Integrated Semantic ASR v0.3 validation passed on \\`$head_sha\\`.

- $counts
- Ruff format/lint and compileall: passed
- document-wide beam and overlap receipts: passed
- trainable document ranker CLI/artifact: passed
- joint phone/mora CPU CTC training and runtime: passed
- kana target and resumable feature export: passed
- wheel build, clean install, permanent CI, and source immutability: passed

This remains an opt-in research stack. No Japanese quality or default-profile promotion claim is made."
          draft=$(gh api "repos/dj-thank/semantic-asr/pulls/$pr_number" --jq '.draft')
          if [ "$draft" = "true" ]; then
            gh pr ready "$pr_number" --repo dj-thank/semantic-asr
          fi
          for old in 18 19 20 21; do
            state=$(gh api "repos/dj-thank/semantic-asr/pulls/$old" --jq '.state' 2>/dev/null || true)
            if [ "$state" = "open" ]; then
              gh pr close "$old" --repo dj-thank/semantic-asr --comment "Superseded by the success-gated integrated v0.3 PR #$pr_number. Its validated tree includes and hardens this draft's intended functionality."
            fi
          done
