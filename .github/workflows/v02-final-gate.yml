name: Semantic ASR v0.2 final gate

on:
  push:
    branches:
      - codex/semantic-asr-v0.2-adaptive-reranking
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: semantic-asr-v02-final-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-package:
    name: source-and-package (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and validation tools
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m pip install -e '.[dev]'
      - name: Static and contract validation
        shell: bash
        run: |
          python -m compileall -q src tests
          python -m ruff check .
          python -m ruff format --check .
      - name: Full model-free test suite
        shell: bash
        run: python -m pytest -q
      - name: Build wheel
        shell: bash
        run: python -m build --wheel
      - name: Installed CLI smoke test
        shell: bash
        run: |
          python -m venv .wheel-venv
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            .wheel-venv/Scripts/python -m pip install --upgrade pip
            .wheel-venv/Scripts/python -m pip install dist/*.whl
            .wheel-venv/Scripts/semantic-asr --help
            .wheel-venv/Scripts/semantic-asr research-ledger --format json > research-ledger.json
          else
            .wheel-venv/bin/python -m pip install --upgrade pip
            .wheel-venv/bin/python -m pip install dist/*.whl
            .wheel-venv/bin/semantic-asr --help
            .wheel-venv/bin/semantic-asr research-ledger --format json > research-ledger.json
          fi
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('research-ledger.json').read_text(encoding='utf-8'))
          if not payload:
              raise SystemExit('research ledger is empty')
          PY

  optional-training:
    name: optional training and gradient contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU training extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,train]'
      - name: Run training, verifier and calibration tests
        run: |
          python -m pytest -q \
            tests/test_ranker_training.py \
            tests/test_acoustic_verifier.py \
            tests/test_calibration.py \
            tests/test_adaptive.py

  hygiene:
    name: repository and claim hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject committed model/audio/secrets
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '\.(wav|mp3|flac|m4a|ogg|pt|pth|ckpt|safetensors|gguf|bin)$' ; then
            echo 'Raw audio or model-weight-like files are committed.' >&2
            exit 1
          fi
          if git grep -nEI '(sk-[A-Za-z0-9_-]{20,}|hf_[A-Za-z0-9]{20,}|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' -- . ':!*.lock' ; then
            echo 'Likely secret material found.' >&2
            exit 1
          fi
      - name: Validate research claim boundary
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = '\n'.join(
              path.read_text(encoding='utf-8', errors='replace')
              for path in [Path('README.md'), *Path('docs').glob('*.md')]
              if path.is_file()
          ).lower()
          required = ('held-out', 'ablation', 'real audio')
          missing = [value for value in required if value not in text]
          if missing:
              raise SystemExit(f'missing claim-boundary language: {missing}')
          PY
