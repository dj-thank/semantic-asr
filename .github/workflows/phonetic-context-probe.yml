name: Public speech context probe

on:
  workflow_dispatch:
  push:
    branches: [codex/phonetic-error-driven-20260905]
    paths: [.github/workflows/phonetic-context-probe.yml]

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  OMP_NUM_THREADS: "2"
  MKL_NUM_THREADS: "2"
  TOKENIZERS_PARALLELISM: "false"
  HF_HUB_DISABLE_TELEMETRY: "1"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Read the immutable public-audio probe artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33946834870 --repo dj-thank/semantic-asr --name public-phonetic-probe-33946834870 --dir public-probe
      - name: Install CPU language-scoring runtime
        run: |
          python -m pip install 'torch>=2.6' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e . 'transformers>=4.52,<5'
      - name: Score only already-decoded candidates
        run: python scripts/score_public_probe_context.py --probe public-probe --output context-probe
      - name: Verify source immutability
        run: git diff --exit-code
      - name: Retain numeric language scores and frozen provenance
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-context-probe-${{ github.run_id }}
          path: context-probe/
          retention-days: 7
          if-no-files-found: error
